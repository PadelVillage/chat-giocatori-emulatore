<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Anti-cache: chiediamo al browser di non tenere in cache questa pagina (evita di
     mostrare una versione vecchia col telefono, es. promemoria già rimossi). Difesa
     debole (i meta non ripuliscono una copia GIÀ in cache) → vedi freshnessGuard nel JS. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Emulatore chat giocatori — Padel Village</title>
<style>
  :root{--ink:#111b21;--muted:#667781;--wa-green:#128C7E;--wa-bg:#ECE5DD}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0b141a;color:var(--ink);display:flex;justify-content:center}
  .app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;background:var(--wa-bg);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:520px){
    body{align-items:center;background:#111b21}
    .app{height:92vh;max-height:900px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  }
  /* Header */
  .head{background:var(--wa-green);display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;flex:0 0 auto;z-index:5}
  .head .back{font-size:20px;line-height:1;opacity:.9}
  .av{width:36px;height:36px;border-radius:50%;background:#0c5f57;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .hname{font-size:15px;font-weight:600;line-height:1.15}
  .hstatus{font-size:11px;opacity:.85}
  .head .spacer{flex:1}
  .head .reset{font-size:12px;background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 9px;border-radius:14px;cursor:pointer}
  /* (Banda identità rimossa: un business NON può ancorare una barra fissa in cima
     alla chat su WhatsApp. Il riconoscimento è implicito nel saluto per nome; lo
     stato "prenotazioni sospese" viene comunicato come MESSAGGIO — vedi boot.) */
  /* Chat */
  .chat{flex:1 1 auto;overflow-y:auto;padding:12px 10px 14px;display:flex;flex-direction:column;gap:8px}
  .sys{align-self:center;background:#d6e7d2;color:#3a5a40;font-size:11px;padding:4px 12px;border-radius:10px;text-align:center;max-width:92%}
  .in,.out{max-width:82%;padding:7px 10px 5px;border-radius:9px;font-size:15.5px;line-height:1.44;position:relative;white-space:pre-wrap;word-wrap:break-word}
  .in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
  .out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
  .meta{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:3px}
  .tick{color:#34b7f1}
  /* Bolla "card" = come un normale messaggio in entrata (nessun bordo colorato:
     le bolle WhatsApp non hanno bordi/accenti di colore — fedeltà). */
  .card{background:#fff;align-self:flex-start;max-width:86%;border-radius:9px;border-top-left-radius:2px;padding:9px 11px;
    font-size:15px;line-height:1.6}
  /* Reply buttons (stile WhatsApp) */
  .qr{align-self:flex-start;width:min(86%,320px);background:#fff;border-radius:9px;overflow:hidden;margin-top:-2px;
    box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;flex-direction:column;flex:0 0 auto}
  .qbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:15.5px;color:#027eb5;
    border-top:1px solid #eff2f3;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:inherit;
    outline:none;-webkit-tap-highlight-color:transparent;text-transform:uppercase}   /* MAIUSCOLO = enfasi ammessa WA (etichetta inviata in maiuscolo, len invariata) */
  .qbtn:focus,.qbtn:focus-visible{outline:none}
  .qr .qbtn:first-child{border-top:0}
  .qbtn.danger{color:#c0392b}
  .qbtn:active{background:#f2f5f6}
  /* Reply-button "spesi": dopo il tap restano in cronologia ma inerti (fedele WA) */
  .qr.spent .qbtn{color:#8696a0;cursor:default;pointer-events:none}
  .qr.spent .qbtn.danger{color:#b09a9a}
  /* Menu a lista (list message) */
  .menu{align-self:flex-start;width:min(92%,340px);background:#fff;border-radius:9px;border-top-left-radius:2px;overflow:hidden;
    box-shadow:0 1px 1px rgba(0,0,0,.06);flex:0 0 auto}
  .menu-head{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px 3px;font-weight:600}
  .menu-body{font-size:15px;color:var(--ink);padding:11px 12px 9px;line-height:1.4}   /* corpo del List Message (testo sopra le voci) */
  .menu-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #f0f3f4;cursor:pointer}
  .menu-row:active{background:#f4f7f8}
  .menu-ic{width:24px;text-align:center;font-size:16px}
  .menu-lb{flex:1;font-size:15.5px;color:var(--ink);min-width:0}
  .menu-lb-t{display:block}
  .menu-lb-d{display:block;font-size:13.5px;color:var(--muted);margin-top:1px;line-height:1.35}
  .menu-ch{color:#c3cbcf;font-size:18px}
  /* Pulsante del List Message (WA reale: 1 solo pulsante che apre le voci in una schermata) */
  .lm-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;font-size:15.5px;font-weight:500;
    color:#027eb5;background:none;border:0;border-top:1px solid #eff2f3;cursor:pointer;font-family:inherit;text-transform:uppercase}   /* MAIUSCOLO = enfasi ammessa WA */
  .lm-btn:active{background:#f2f5f6}
  .lm-ic{font-size:15px}
  /* Typing */
  .typing{align-self:flex-start;background:#fff;border-radius:9px;border-top-left-radius:2px;padding:10px 12px;display:inline-flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b5c0c4;display:inline-block;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  /* Nota demo */
  .demo-note{flex:0 0 auto;background:#fff4d6;color:#8a6d00;font-size:11.5px;text-align:center;padding:6px 12px;border-top:1px solid #f0e3b0}
  /* Controlli DEMO (🎭) — chrome dell'emulatore, distinti dalle bolle WhatsApp */
  .demorow{display:flex;justify-content:center;margin:5px 0}
  .demobtn{background:#fff4d6;color:#8a6d00;border:1px dashed #d9c37a;border-radius:14px;font-size:11.5px;padding:5px 12px;cursor:pointer}
  /* Input */
  .bar{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--wa-bg);flex:0 0 auto}
  .ic-btn{background:none;border:0;font-size:20px;cursor:pointer;color:#54656f;flex:0 0 auto;padding:4px}
  .field{flex:1;background:#fff;border-radius:20px;padding:10px 14px;font-size:16px;border:0;outline:0;font-family:inherit;color:var(--ink)}
  .send{width:42px;height:42px;border-radius:50%;background:var(--wa-green);border:0;color:#fff;font-size:19px;cursor:pointer;flex:0 0 auto}
  .send:active{background:#0c5f57}
  /* Bottom sheet (simulazione WhatsApp Flow / schermate) */
  .sheet-ov{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;z-index:20}
  .sheet-ov.show{opacity:1}
  .sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .25s;padding-bottom:16px}
  .sheet.show{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #eef1f2;display:flex;align-items:flex-start;z-index:2}
  .sheet-handle{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#d5dbdd}
  .sheet-title{font-size:16px;font-weight:600;color:var(--ink);flex:1}
  .sheet-sub{font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px}
  .sheet-x{background:none;border:0;font-size:16px;color:var(--muted);cursor:pointer}
  /* Sottotitoli del Flow: colore di DEFAULT (dark), non brand — i componenti testo
     dei Flow WhatsApp non colorano il testo (come in chat). */
  .flow-lb{font-size:13.5px;font-weight:600;color:var(--ink);padding:13px 14px 3px}
  /* EmbeddedLink nativo del Flow (link accent, non un bottone custom) */
  .flow-link{display:inline-block;margin:8px 14px 2px;font-size:15px;font-weight:600;color:#027eb5;cursor:pointer;text-decoration:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:3px 14px 4px}
  .chip{border:1px solid #cdd6d9;background:#fff;color:var(--ink);border-radius:16px;padding:8px 13px;font-size:15px;cursor:pointer;font-family:inherit}
  .chip.sel{background:var(--wa-green);border-color:var(--wa-green);color:#fff}
  .chip.opt:not(.sel){background:#fff4d6;border-color:#f0e3b0;color:#8a6d00}
  .flow-inp{width:calc(100% - 28px);margin:3px 14px 4px;background:#f3f6f7;border:1px solid #e2e8ea;border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;outline:0}
  .friend-list{padding:2px 14px}
  .friend-row{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:15px;border-bottom:1px solid #f2f5f6;cursor:pointer}
  .friend-row input{width:19px;height:19px;flex:0 0 auto}
  /* Questionario autovalutazione = WhatsApp Flow: un RadioButtonsGroup per domanda
     (opzioni native, niente testo colorato). Riga = radio + etichetta. */
  .assess-opts{padding:1px 14px 8px}
  .assess-opt{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;font-size:15px;border-bottom:1px solid #f2f5f6;cursor:pointer;line-height:1.35}
  .assess-opt input{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
  /* Descrizione secondaria di un'opzione (Flow reale: title ≤30, description ≤300):
     riga sotto il titolo, testo secondario NATIVO (muted, come il tema) — non è "colore
     custom", è la gerarchia standard del componente. Usata quando il titolo dev'essere
     corto ma serve spiegare la risposta. */
  .opt-d{display:block;font-size:13px;color:var(--muted);margin-top:1px;line-height:1.3}
  /* OptIn privacy del Flow: checkbox + pannello espandibile (EmbeddedLink per aprirlo). */
  .assess-policy{margin:4px 14px 6px;padding:10px 12px;background:#f3f6f7;border-radius:10px;font-size:13px;color:var(--muted);line-height:1.5}
  /* Disponibilità nel Flow: striscia giorni + orari a 3 stati */
  .days{display:flex;gap:8px;overflow-x:auto;padding:3px 14px 4px}
  .day{flex:0 0 auto;min-width:62px;border:1px solid #cdd6d9;background:#fff;border-radius:10px;padding:7px 8px;text-align:center;cursor:pointer;font-family:inherit;line-height:1.25}
  .day b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
  .day span{display:block;font-size:12px;color:var(--muted)}
  .day small{display:block;font-size:11px;margin-top:2px;font-weight:600}
  .day small.ok{color:#0f8a6d}
  .day small.no{color:#b5c0c4}
  .day.sel{border-color:var(--wa-green);background:#d9f2ee}
  .slot-fascia{font-size:12px;font-weight:600;color:var(--muted);padding:7px 14px 3px;text-transform:uppercase;letter-spacing:.4px}
  .slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
  .slot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 3px;border-radius:9px;font-family:inherit;cursor:pointer;border:1px solid transparent;line-height:1.1}
  .slot b{font-size:15px;font-weight:600}
  .slot small{font-size:11.5px;font-weight:600;opacity:.9}
  .slot.free{background:#eaf7e6;color:#0c5f57;border-color:#bfe6c8}
  .slot.conf{background:#fff4d6;color:#8a6d00;border-color:#f0e3b0}
  .slot.busy{background:#f4f6f7;color:#b9c2c6;border-color:#eef1f2;text-decoration:line-through;cursor:default}
  .slot.sel{background:var(--wa-green);color:#fff;border-color:var(--wa-green)}
  .slot-empty{font-size:14.5px;color:var(--muted);padding:12px 16px;text-align:center}
  .luce-hint{font-size:11.5px;color:var(--muted);padding:3px 2px 0}
  /* Riepilogo del Flow = testo semplice (TextBody nativo): niente testo colorato
     né sfondo "verde di stato" — il colore lo decide il tema (fedeltà WhatsApp).
     Placeholder muted; selezione valida = testo scuro leggibile, sfondo neutro. */
  .flow-sum{margin:12px 14px 0;padding:10px 12px;background:#f3f6f7;border-radius:10px;font-size:14.5px;color:var(--muted)}
  .flow-sum.on{background:#f3f6f7;color:var(--ink)}
  .flow-sum .warn{font-weight:600}
  .flow-submit{margin:16px 14px 4px;width:calc(100% - 28px);background:var(--wa-green);color:#fff;border:0;border-radius:22px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase}   /* MAIUSCOLO = enfasi ammessa WA (footer Flow ≤35 char, len invariata) */
  .toast{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;font-size:13px;padding:9px 15px;border-radius:20px;z-index:30;max-width:80%;text-align:center}
  /* Ice Breakers (bottoni primo contatto — Meta: niente emoji, max 4) */
  .ice{align-self:center;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:2px 8px 4px;max-width:96%}
  .ice-b{background:#fff;border:1px solid #cfe0dc;color:#0c5f57;border-radius:17px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
  .ice-b:active{background:#eef6f4}
  /* Menu comandi "/" (Commands — sempre richiamabile digitando /) */
  .cmd-pop{display:none;flex-direction:column;background:#fff;border-top:1px solid #e2e8ea;max-height:230px;overflow-y:auto;flex:0 0 auto}
  .cmd-pop.show{display:flex}
  .cmd-head{font-size:11px;color:var(--muted);padding:9px 14px 3px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .cmd-row{display:flex;align-items:baseline;gap:10px;padding:10px 14px;cursor:pointer;border-top:1px solid #f2f5f6}
  .cmd-row:active{background:#f4f7f8}
  .cmd-c{font-size:15px;color:#027eb5;font-weight:600}
  .cmd-d{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <span class="back">‹</span>
    <div class="av">PV</div>
    <div><div class="hname">Padel Village</div><div class="hstatus" id="hstatus">online</div></div>
    <div class="spacer"></div>
    <button class="reset" id="resetBtn" title="Ricomincia da capo">↺ Ricomincia</button>
  </div>
  <div class="chat" id="chat"></div>
  <div class="demo-note">🔒 Modalità demo — nessuna prenotazione reale · <span id="buildTag"></span> · <button type="button" class="demobtn" id="nudgeTestBtn" style="vertical-align:middle" title="Solo test: fa comparire subito il promemoria partita (nel prodotto reale sono ~15 min)">🔔 Testa promemoria</button></div>
  <div class="cmd-pop" id="cmdPop"></div>
  <form class="bar" id="bar" autocomplete="off">
    <button type="button" class="ic-btn" id="emojiBtn">😊</button>
    <input class="field" id="field" placeholder="💬 Scrivi un messaggio…" autocomplete="off">
    <button type="button" class="ic-btn" id="clipBtn">📎</button>
    <button class="send" id="send" type="submit">↑</button>
  </form>
</div>

<script>
/* ============================================================================
   EMULATORE CHAT GIOCATORI — Padel Village · Fase B (mockup-first)
   100% self-contained: nessuna chiamata reale, nessuna scrittura in Matchpoint.
   Simula i tipi di messaggio WhatsApp (bolle, pulsanti di risposta, menu a
   lista) e i "WhatsApp Flows" (moduli a scomparsa dal basso). Backend FINTO
   in localStorage. Vedi 01-analisi-operativita-chat-giocatori.md
   🔒 REGOLA FERMA (doc §9): qui si realizza SOLO ciò che è riproducibile
   fedelmente su WhatsApp reale (componenti/limiti Flows + policy Meta).
   Verificare sui doc Meta PRIMA di aggiungere grafica/layout/interazioni.
   ========================================================================== */
/* v11: REGISTRO DISPONIBILITÀ (S.player.disponibilita + pool con optIn/disponibilita).
   Il bump della chiave è OBBLIGATORIO, non cosmetico: load() non migra nulla e
   ensurePool() rigenera il pool solo se è VUOTO → restando su v10 i soci già in
   localStorage non avrebbero i campi nuovi, `optIn` sarebbe undefined per tutti e
   l'open-match non troverebbe MAI nessuno. */
const LS_KEY='pmo_emu_state_v11';
/* Versione visibile nel footer: serve a capire SUBITO se il browser sta
   mostrando una versione vecchia in cache (Cmd+Shift+R per forzare il reload). */
const APP_BUILD='v0.99 · 18/07';

/* ─── freshnessGuard: auto-guarigione da cache vecchia ──────────────────────
   GitHub Pages / il browser del telefono possono servire un index.html VECCHIO
   dalla cache (è così che riapparivano "Promemoria"/"Ultima chiamata" già rimossi
   dal codice: il JS vecchio in memoria li ri-programmava). I meta anti-cache non
   bastano perché non ripuliscono una copia già memorizzata. Qui, all'avvio,
   scarichiamo il file dal server SENZA cache e confrontiamo APP_BUILD: se il server
   ha un build diverso da quello in esecuzione, la pagina si ricarica DA SOLA su una
   URL con build stampato (nuova chiave di cache = fetch garantito fresco). Nessun
   hard reload manuale; si auto-corregge a ogni visita. Loop-safe: non re-indirizza
   se la URL contiene già ?b=. */
(function freshnessGuard(){
  try{
    if(location.search.indexOf('b=')!==-1) return;      // già arrivati da un redirect: stop
    fetch(location.pathname+'?_fresh='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m=html.match(/APP_BUILD='([^']+)'/);
        if(m && m[1]!==APP_BUILD){
          location.replace(location.pathname+'?b='+encodeURIComponent(m[1]));
        }
      })
      .catch(function(){});
  }catch(e){}
})();

/* --- Dati demo ------------------------------------------------------------- */
function demoState(){
  return {
    player:{ nome:'Marco Aprea', numero:'+39 333 123 4567', socio:true, livello:'4.0', inRegola:true,
             livelloFonte:'segreteria',   // come è stato determinato il livello: 'segreteria' (anagrafica MP) | 'autovalutazione'
             livelloVerifica:null,        // se l'autovalutazione è incoerente: livello indicativo in coda validazione staff (l'ufficiale NON cambia)
             email:'',                    // contatto FACOLTATIVO, self-editable dal giocatore (nome/telefono restano gestiti dalla segreteria)
             /* `openMatch` = opt-IN esplicito «cercami per le partite». Default FALSE:
                chi non sceglie NON viene contattato. È il consenso che rende difendibile
                il push mirato — e la prova da mostrare a Meta se arriva una segnalazione. */
             prefs:{ promemoria:true, novita:false, openMatch:false },
             /* REGISTRO DISPONIBILITÀ. Vocabolario allineato a `availabilityProfile` della
                scheda socio staff (web app: days/time/frequency/notice/matchType/source/
                updatedAt) → il Flow WhatsApp scrive nel registro che la segreteria GIÀ vede
                e modifica, invece di aprirne uno parallelo. `giorni`/`fasce` sono i gemelli
                STRUTTURATI (il matching non può parsare a mano "Lunedi, Mercoledi");
                `frequenza`/`preavviso` usano le stringhe ESATTE delle select staff. */
             disponibilita:null,   // null = mai compilato (diverso da «compilato vuoto»)
             genere:'M',   // dal dato anagrafica (campo del modello socio; non usato in UI al momento)
             // Borsellino allineato al modello della NOSTRA app (record `wallet_balance`
             // = {balance_cents, synced_at}): in Fase 2 l'emulatore leggerà QUEL record dal
             // cloud, non Matchpoint. `borselloCent`=balance_cents · `borselloAggiornato`=synced_at.
             borselloCent:2400, borselloAggiornato:'28/06 · 12:30' },
    /* Amici = SOCI del circolo (numero in anagrafica). Niente livello: dopo la
       rimozione delle partite aperte non filtra più nulla.
       MODELLO COST-ZERO: l'invito parte dal WhatsApp PERSONALE dell'organizzatore
       (link wa.me persona-a-persona = gratis) → OGNI amico è invitabile, anche chi
       non ha ancora scritto al canale (Giulia). `suWhatsApp` resta come metadato ma
       NON blocca più l'invito. L'unico stop è `optOut` = ha risposto "🔕 Non
       invitarmi più" a un invito → non-invitabile (igiene Meta). `origine`
       ('socio'|'invitato') annota da dove arriva l'amico (tutti 'socio' qui; il ramo
       'invitato' = amici entrati via invito è Fase 2, quando ci sarà persistenza reale;
       `privacy_notice_sent_at` del brief → Fase 2, nessun DB nell'emulatore).
       Demo: Paolo RIFIUTA, Davide fa OPT-OUT (per mostrare i due rami oltre alla conferma). */
    friends:[
      {id:11,nome:'Luca Bianchi',  numero:'+39 333 555 0102', suWhatsApp:true,  origine:'socio'},
      {id:12,nome:'Sara Rossi',    numero:'+39 333 555 0103', suWhatsApp:true,  origine:'socio'},
      {id:13,nome:'Giulia Verdi',  numero:'+39 333 555 0104', suWhatsApp:false, origine:'socio'},
      {id:14,nome:'Paolo Neri',    numero:'+39 333 555 0105', suWhatsApp:true,  origine:'socio'},

function openListSheet(title, rows){
  const body=el('flow');
  const m=el('menu'); m.style.width='100%'; m.style.boxShadow='none'; let cur=null;
  (rows||[]).forEach(r=>{
    if(r.section && r.section!==cur){ cur=r.section; const h=el('menu-head'); h.textContent=r.section; m.appendChild(h); }

/* --- LISTINO ESTIVO (prezzi a testa; campo = ×4) --------------------------
   Modello IBRIDO per tipo di giorno (vedi listino.html). LUCE SEMPRE INCLUSA
   (nessun supplemento). Prezzi:
   · Lun–Gio: fascia diurna 09:00–18:00 = 8€, MA 12:00–15:00 = 10€ (fascia
     centrale), avvii ogni 30' · fissi serali 18:00=12, 19:30=13, 21:00=12.
   · Ven: fascia 09:00–17:30 = 8€, 12:00–15:00 = 10€ · fissi 17:30/19:00/20:30=12.
   · Sab–Dom: solo fissi ogni 90' (09:00→18:00) = 8€.
   La fascia diurna chiude dove iniziano i fissi; la partita (durata) deve
   rientrare nella fascia → l'ultimo avvio dipende dalla durata. */
/* Partita SEMPRE 90' in 4 (niente tariffa "in due" / slot da 60'). */
const LISTINO={
  weekday:{ fascia:{start:'09:00',end:'18:00',prezzo:8},
            fissi:[{ora:'18:00',prezzo:12},{ora:'19:30',prezzo:13},{ora:'21:00',prezzo:12}] },
  friday :{ fascia:{start:'09:00',end:'17:30',prezzo:8},
            fissi:[{ora:'17:30',prezzo:12},{ora:'19:00',prezzo:12},{ora:'20:30',prezzo:12}] },
  weekend:{ fascia:null,
            fissi:[{ora:'09:00',prezzo:8},{ora:'10:30',prezzo:8},{ora:'12:00',prezzo:8},{ora:'13:30',prezzo:8},{ora:'15:00',prezzo:8},{ora:'16:30',prezzo:8},{ora:'18:00',prezzo:8}] }
};
/* Fascia centrale (solo lun–ven, dove esiste la fascia diurna): l'avvio tra le
   12:00 e le 15:00 costa 10€/testa invece di 8. Determinato dall'ORARIO DI AVVIO. */
const MIDDAY={start:12*60,end:15*60,prezzo:10};
function dayConfig(dow){ if(dow===0||dow===6) return LISTINO.weekend; if(dow===5) return LISTINO.friday; return LISTINO.weekday; }
function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
/* Prezzo a testa di uno slot di FASCIA diurna: 8€, oppure 10€ se l'avvio è
   nella fascia centrale 12–15 (partita sempre 90' in 4). */
function fasciaPrezzo(fascia,ora){
  const t=toMin(ora);
  if(t>=MIDDAY.start && t<MIDDAY.end) return MIDDAY.prezzo;
  return fascia.prezzo;
}
function fromMin(x){ return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); }
/* Avvii della fascia diurna: ogni 30' finché la partita (durata) rientra nella fascia. */
function fasciaTimes(fascia,durata){ const res=[]; const end=toMin(fascia.end); let t=toMin(fascia.start);
  while(t+durata<=end){ res.push(fromMin(t)); t+=30; if(res.length>60) break; } return res; }
/* Gruppi di slot del giorno, con prezzo e stato. 4 CAMPI = dietro le quinte:
   un orario è "disponibile" finché ≥1 dei 4 campi è libero (qui slotStatus).
   Il giocatore vede solo gli orari, mai i campi né il packing.
   3 stati riproducibili nei WhatsApp Flows reali (doc §9): free = libero ·
   conf = su conferma segreteria (description) · busy = occupato (nascosto). */
function daySlotGroups(off,dow,durata,players){
  const cfg=dayConfig(dow); durata=durata||90; players=players||4; const groups=[];
  if(cfg.fascia){
    groups.push({ name:'Fascia diurna', kind:'fascia',
      slots:fasciaTimes(cfg.fascia,durata).map(t=>({ora:t,prezzo:fasciaPrezzo(cfg.fascia,t),kind:'fascia',status:slotStatus(off,dow,t)})) });
  }
  groups.push({ name:(cfg.fascia?'Slot serali':'Slot fissi'), kind:'fisso',
    slots:cfg.fissi.map(f=>({ora:f.ora,prezzo:f.prezzo,kind:'fisso',status:slotStatus(off,dow,f.ora)})) });
  return groups;
}
function slotMetaFor(off,dow,ora,durata,players){ const gs=daySlotGroups(off,dow,durata,players);
  for(const g of gs){ const s=g.slots.find(x=>x.ora===ora); if(s) return s; } return null; }
/* Prezzo a testa/campo. Luce sempre inclusa. Partita sempre in 4 (90'):

function slotPrezzo(meta){ if(!meta) return {testa:0,campo:0,giocatori:4};

/* --- PRENOTAZIONE (modello a RESPONSABILITÀ) ------------------------------

function courtsFor(off,dow,ora){
  const mins=toMin(ora);
  // Oggi: uno slot sparisce quando è passato O manca meno dell'anticipo minimo

  const t=txt.toLowerCase(); const base=new Date(); let target=null;
  // Fascia oraria del giorno (per l'eco + la pre-selezione del modulo): mattina/pomeriggio/sera.
  // «stasera/stanotte»=sera · «stamattina/stamane»=mattina · «(oggi/domani) pomeriggio».
  let fascia=null;
  if(/\bstaser|stanotte|\bsera\b/.test(t)) fascia='sera';
  else if(/stamattin|stamane|\bmattin/.test(t)) fascia='mattina';
  else if(/pomerigg/.test(t)) fascia='pomeriggio';
  // «stasera/stamattina/stamane/stanotte» implicano OGGI (oltre a «oggi»).
  if(/\boggi\b|staser|stamattin|stamane|stanotte/.test(t)) target=new Date(base);
  else if(/\bdomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+1); }
  else if(/\bdopodomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+2); }
  else for(let i=0;i<7;i++){ if(t.includes(GIORNI[i])){ target=new Date(base); let diff=(i-base.getDay()+7)%7; if(diff===0) diff=7; target.setDate(base.getDate()+diff); break; } }
  let ora=null; const m=t.match(/(?:alle|ore)?\s*\b([01]?\d|2[0-3])(?:[:.](\d{2}))?\b/);
  if(m){ ora=m[1].padStart(2,'0')+':'+(m[2]||'00'); }
  return { date:!!target, giorno: target?lbl(target):null, dow: target?target.getDay():null, ora, fascia };
}

/* ============================ INTENT ROUTING =============================== */
function detectIntent(t){
  t=t.toLowerCase();
  if(t[0]==='/'){
    if(/^\/aiuto/.test(t)) return 'aiuto';
    if(/^\/prenotazioni/.test(t)) return 'mie';
    if(/^\/prenota/.test(t)) return 'prenota';
    if(/^\/profilo/.test(t)) return 'profilo';
    if(/^\/amici/.test(t)) return 'amici';
    if(/^\/borsellino/.test(t)) return 'borsellino';
    if(/^\/segreteria/.test(t)) return 'segreteria';
    if(/^\/menu/.test(t)) return 'saluto';
  }
  // AIUTO prima degli intenti operativi: "come invito un amico?" è una domanda.
  if(/\b(aiuto|help|guida)\b/.test(t)) return 'aiuto';
  if(/\bcome\s+(si\s+)?(funziona|fa|faccio|posso|uso|usa|prenot|invit|entr|apr|organizz|pag|dispon|complet)/.test(t)) return 'aiuto';
  if(/\bcosa\s+(puoi|sai|posso)\b/.test(t) || /a cosa serv|spiegami|spiega come|non ho capito|come si usa/.test(t)) return 'aiuto';
  if(/quanto costa|quanto si paga|che prezz|\bprezz|listino|\btariff|come si paga|serve un anticipo|serve un acconto/.test(t)) return 'aiuto';
  // COMPLETA/INVITA = il verbo bandiera («tu pensa a giocare — il quarto lo troviamo noi»):
  // «invita Giulia», «completa la partita», «mi mancano giocatori», «chi ho invitato»,
  // «gestisci i giocatori», «togli Luca». DOPO 'aiuto' (così «come invito un amico?» resta
  // aiuto) e PRIMA di 'amici' (così «invita i miei amici» apre gli inviti, non la rubrica).
  // Include l'OPEN-MATCH «trovate voi il quarto / pensateci voi / cercatemi un
  // giocatore» (Fix #4): il verbo «trov*» è ampliato a trovate/trovateci (prima
  // matchava solo trova/trovami/trovatemi) e si aggiungono «pensateci voi / trovate
  // voi». doCompleta() smista poi a doOpenMatch. Se non c'è una partita aperta,
  // doCompleta risponde in modo onesto → nessun falso positivo.
  if(/\b(invit|complet(a|are|iamo|ala|arla)|manca(no)?\s+(un\s+|dei\s+|degli\s+|di\s+)?giocator|trov(a|ate|ami|atemi|iamo|are|armi|ateci)\w*.*(quart|giocator|gente|qualcun)|pensateci voi|trovate voi|cerca(mi|ci|te|temi|teci)\b.*(quart|giocator)|chi\s+ho\s+invitat|gestisci\s+(i\s+)?giocator|togli\s+\w)/.test(t)) return 'completa';
  if(/^altro\b|^altre\b|\baltre funzioni\b|\baltre opzioni\b|\baltro men[uù]\b|vedi il men[uù]/.test(t)) return 'altro';
  if(/profil|i miei dati|chi sono/.test(t)) return 'profilo';
  if(/amic|con cui gioc|lista giocator/.test(t)) return 'amici';
  if(/borsell|saldo|credito|monedero|portafogl/.test(t)) return 'borsellino';
  if(/\borari?\b|\borario\b|a che ora|fino a che ora|siete apert|quando (aprite|apre|chiudete|chiude|siete apert|è apert)/.test(t)) return 'orari';
  if(/\blivell|autovalut|che livello|il mio livello|quanto valgo|categoria di gioco/.test(t)) return 'livello';
  if(/disponibil|liber|che campi|quali campi|posti/.test(t)) return 'disponibilita';
  if(/cosa ho|mie prenotaz|le mie|prenotazioni/.test(t)) return 'mie';
  if(/annull|disdet|cancell/.test(t)) return 'annulla';
  if(/modific|spost|cambia orario/.test(t)) return 'modifica';
  if(/segreteria|assistenza|operatore|parlare con (qualcuno|un operatore|una persona)/.test(t)) return 'segreteria';
  // "organizzatemi la partita" cade su 'prenota' (prima ti assicuri il campo, poi lo
  // completi invitando gli amici). «trovate voi / pensateci voi» NON stanno più qui: con
  // l'anima significano «trovate voi il quarto» → intent 'completa' (open-match), gestito
  // sopra; se manca la partita, doCompleta rimanda a prenota. Una mano generica = segreteria.
  if(/prenot|campo|partita|lezione|gioc|organizz/.test(t)) return 'prenota';
  if(/ciao|salve|buongiorno|buonasera|ehi|hey|menu/.test(t)) return 'saluto';
  return 'fallback';
}
function sendUser(text,silent){
  if(!silent) addOut(text);
  const t=text.trim(); if(!t) return;
  if(convo.mode==='cancel') return botSay(()=>cancelStep(t));
  botSay(()=>route(detectIntent(t),t));
}
function route(intent,t){
  switch(intent){
    case 'saluto': showMenu('Ciao '+esc(S.player.nome.split(' ')[0])+', come possiamo aiutarti?'); break;
    case 'altro': showMenuAltro('Ecco il menu'); break;
    case 'profilo': doProfilo(); break;
    case 'amici': doAmici(); break;
    case 'borsellino': doBorsellino(); break;
    case 'orari': doOrari(); break;
    case 'livello': explainLevel(); break;
    case 'disponibilita': doDisponibilita(t); break;
    case 'mie': doMie(); break;
    case 'aiuto': doHelp(t); break;
    case 'annulla': startCancel(); break;
    case 'modifica': startModify(); break;
    case 'segreteria': doSegreteria(); break;
    case 'completa': doCompleta(t); break;
    case 'prenota': startBooking(t); break;
    default: doUnknown(t);
  }
}

/* Fix #2 — «invita X» / «completa» capiti A PAROLE (il verbo bandiera dell'anima).
   PARITÀ: l'azione a voce fa ESATTAMENTE ciò che fa il pulsante «Completa la partita».
   Trova la partita da completare (la più recente incompleta) e:
   · se cito un amico invitabile → lo invito subito (inviteFriend, con eco «Ok, invito X!»);
   · se cito un amico non invitabile (🟡/🟢/❌/🔕) → spiego lo stato (inviteInfoTap);
   · «togli/gestisci» → apro il modulo di gestione (NON un invito);
   · nessun nome → apro la lista inviti (identico al tap «Invito i miei amici»).
   Nessuna partita aperta → messaggio onesto + gancio a «prenota». */
/* Fix #4 — Marco chiede al CIRCOLO di trovare il quarto (open-match ON-DEMAND):
   «trovate voi (il quarto) / pensateci voi / trovami un giocatore / cercatemi qualcuno».
   Distinto da «invita Giulia» (nome amico) e da «mancano giocatori» (→ lista amici, che
   comunque offre l'open-match). Richiede un verbo-di-ricerca RIVOLTO A NOI + il bisogno. */
function _wantsOpenMatch(t){
  return /(trov(a|ate|ami|atemi|iamo|are|armi|ateci)\w*|cerca(mi|ci|te|temi|teci)\w*)[^.!?]*(quart|giocator|gente|qualcun)|pensateci voi|ci pensate voi|trovate voi|ci pensiate voi/.test(t);
}
function doCompleta(t){
  const rec=S.prenotazioni.slice().reverse().find(r=>r.stato==='confermato' && rosterPosti(r)>0);
  if(!rec){
    addInHtml('Non hai una partita aperta da completare 🎾'
      +'<br>Vuoi <b>prenotare un campo</b>? Al quarto poi ci pensiamo insieme.');
    addQuick([{label:'🎾 Prenota un campo', action:()=>botSay(()=>startBooking(''))}, menuBtn()]);
    return;
  }
  const low=(t||'').toLowerCase();
  // «togli / gestisci / sostituisci» = gestione roster → il Flow dedicato (togli/sostituisci),
  // NON un invito (altrimenti «togli Luca» finirebbe per INVITARE Luca).
  if(/\b(togli|rimuov|leva|gestisc|sostituisc|revoc)/.test(low)){
    addFlowLaunch('Apriamo il modulo — togli o sostituisci i giocatori.', ()=>openAddPlayersFlow(rec));
    return;
  }
  // «trovate voi il quarto» = l'anima resa vera → il CIRCOLO cerca (open-match mediato).
  // Prima del match per nome: è una richiesta rivolta a noi, non un invito a un amico.
  if(_wantsOpenMatch(low)){ doOpenMatch(rec); return; }
  // Amici citati per nome (primo nome, case-insensitive).
  const named=S.friends.filter(f=>low.includes(f.nome.split(' ')[0].toLowerCase()));
  if(!named.length){ openInviteFriendsList(rec); return; }
  if(named.length===1){
    const f=named[0];
    if(inviteStateOf(rec,f).can){
      addInHtml('Ok, invito <b>'+esc(f.nome.split(' ')[0])+'</b>! 👇');
      inviteFriend(rec.id, f.id);              // gestisce da sé «sta scrivendo…» + anteprima
    } else {
      inviteInfoTap(rec.id, f.id);             // 🟡/🟢/❌/🔕 → spiega (il ❌ offre «Invita di nuovo»)
    }
    return;
  }
  // BONUS multi-invito (avvicina il fix «manda a 2-3 in un colpo»): invito tutti gli
  // invitabili citati, senza superare i posti liberi. Riuso sendInvites (una riga
  // onesta + risposte simulate scaglionate).
  const invitabili=named.filter(f=>inviteStateOf(rec,f).can);
  if(!invitabili.length){ inviteInfoTap(rec.id, named[0].id); return; }
  const toInvite=invitabili.slice(0, rosterPosti(rec));
  const nomi=toInvite.map(f=>f.nome.split(' ')[0]);
  addInHtml('Ok, invito <b>'+esc(nomi.join(', '))+'</b>! 👇');
  toInvite.forEach(f=>{ const nm=f.nome.split(' ')[0];
    rec.declinati=(rec.declinati||[]).filter(x=>x!==nm);
    rec.invitati=(rec.invitati||[]).concat(nm); });
  save();
  botSay(()=>{ rosterActionButtons(rec); sendInvites(rec, nomi); });
}

/* ---------- Autovalutazione livello (WhatsApp Flow nativo) -----------------
   Parità con la web app staff: STESSE 8 domande a scelta chiusa e STESSO scoring
   deterministico (declared 40% + balanced 25% + media tecnica 35%, arrotondato a
   0.5, freni prudenziali, coerenza high/medium/low). Fedele WA = un Flow con un
   RadioButtonsGroup per domanda + consenso privacy (OptIn) + 1 solo Footer.
   Applicazione del livello (decisione utente): coerente → applica; incoerente →
   va in validazione staff (l'ufficiale non cambia). In Fase C il Flow scriverà in
   assessment_responses e applicherà con le stesse regole; qui è simulato. */
function emuClean(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function emuNorm(s){ return emuClean(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function emuScoreFromText(value,map){ const raw=emuClean(value); if(!raw) return null; const key=emuNorm(raw);
  for(const [needle,score] of map){ if(key.includes(emuNorm(needle))) return score; } return null; }
function emuTechnical(d){
  const rally=emuScoreFromText(d.rally,[['Faccio fatica a tenere 3-4 colpi',1.0],['Tengo lo scambio solo a ritmo lento',2.0],['Tengo scambi regolari con continuità',3.0],['Tengo scambi anche con ritmo alto',4.0],['Costruisco il punto con controllo',5.0]]);
  const glass=emuScoreFromText(d.glass,[['Evito quasi sempre il vetro',1.0],['Lo uso solo se la palla è facile',2.0],['Difendo con il vetro in modo base',2.5],['Lo uso con continuità anche sotto pressione',3.5],['Lo uso per difendere e ripartire in attacco',4.5]]);
  const net=emuScoreFromText(d.net,[['Sto poco a rete',1.5],['Vado a rete ma faccio fatica a chiudere',2.0],['Gioco volée semplici',2.5],['Tengo posizione e controllo le volée',3.5],['Costruisco e chiudo il punto a rete',4.5]]);
  const overhead=emuScoreFromText(d.overhead,[['Non li uso',1.5],['Li provo ma con poca sicurezza',2.0],['Uso almeno la bandeja in modo semplice',2.5],['Uso bandeja e smash con controllo',3.5],['Uso colpi alti in modo tattico e affidabile',4.5]]);
  const vals=[rally,glass,net,overhead].filter(v=>typeof v==='number'&&isFinite(v));
  const average=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;
  return {rally,glass,net,overhead,average};
}
function emuParseLevel(v){ const raw=emuClean(v); if(!raw) return ''; const n=raw.replace(',','.').trim(); if(/^\s*5\+/.test(n)) return '5'; const m=n.match(/\d+(?:\.\d+)?/); return m?m[0]:''; }
function emuRoundHalf(v){ const n=Number(v); if(!isFinite(n)) return ''; return String(Math.max(0.5,Math.min(7,Math.round(n*2)/2))); }
function emuCalcLevel(d){
  const declared=parseFloat(emuParseLevel(d.declaredLevel));
  const balanced=parseFloat(emuParseLevel(d.balancedLevel));
  const tech=emuTechnical(d); const parts=[];
  if(isFinite(declared)) parts.push({value:declared,weight:0.40});
  if(isFinite(balanced)) parts.push({value:balanced,weight:0.25});
  if(isFinite(tech.average)) parts.push({value:tech.average,weight:0.35});
  if(!parts.length) return {declared_level:'',calculated_level:'',coherence:'medium',staff_status:'review'};
  const wsum=parts.reduce((s,p)=>s+p.weight,0);
  const raw=parts.reduce((s,p)=>s+p.value*p.weight,0)/wsum;
  let calc=parseFloat(emuRoundHalf(raw));
  if(isFinite(declared)){ if(calc>declared+0.5) calc=declared+0.5; if(calc<declared-1.0) calc=declared-1.0; calc=Math.max(0.5,Math.min(7,Math.round(calc*2)/2)); }
  const techRef=isFinite(tech.average)?tech.average:(isFinite(balanced)?balanced:calc);
  const diff=isFinite(declared)?Math.abs(declared-techRef):0;
  const coherence=diff<=0.5?'high':(diff<=1?'medium':'low');
  return {declared_level:isFinite(declared)?String(declared):'', calculated_level:String(calc), coherence, staff_status:coherence==='low'?'review':''};
}
/* Le 8 domande (parità col form staff). Le prime 4 producono declared/balanced,
   le altre 4 sono tecniche (score fissi). Ogni domanda = un RadioButtonsGroup. */
const ASSESS_Q=[
  {name:'experience',   q:'1. Da quanto giochi a padel?',              opts:['Meno di 1 mese','1-3 mesi','3-6 mesi','6-12 mesi','Più di 1 anno','Più di 3 anni']},

  {name:'balancedLevel',q:'4. Con quali livelli fai partite equilibrate?', opts:['1.0 / 1.5','2.0','2.5','3.0','3.5','4.0','4.5','5+']},
  /* Domande TECNICHE: le risposte descrittive superano i 30 char del `title` di un
     RadioButtonsGroup reale → title corto (≤30) + `d` = testo pieno mostrato come
     description (≤300). `d` resta anche il VALORE memorizzato → scoring invariato
     (emuScoreFromText cerca la frase completa). Opzioni già ≤30 = stringhe semplici. */
  {name:'rally',        q:'5. Riesci a mantenere lo scambio?',         opts:[{t:'Faccio fatica',d:'Faccio fatica a tenere 3-4 colpi'},{t:'Solo a ritmo lento',d:'Tengo lo scambio solo a ritmo lento'},{t:'Scambi regolari',d:'Tengo scambi regolari con continuità'},{t:'Anche a ritmo alto',d:'Tengo scambi anche con ritmo alto'},{t:'Costruisco il punto',d:'Costruisco il punto con controllo'}]},
  {name:'glass',        q:'6. Come gestisci il vetro in difesa?',      opts:['Evito quasi sempre il vetro',{t:'Solo palle facili',d:'Lo uso solo se la palla è facile'},{t:'Difesa base',d:'Difendo con il vetro in modo base'},{t:'Anche sotto pressione',d:'Lo uso con continuità anche sotto pressione'},{t:'Difendo e riparto',d:'Lo uso per difendere e ripartire in attacco'}]},
  {name:'net',          q:'7. A rete come ti comporti?',               opts:['Sto poco a rete',{t:'Fatico a chiudere',d:'Vado a rete ma faccio fatica a chiudere'},'Gioco volée semplici',{t:'Controllo le volée',d:'Tengo posizione e controllo le volée'},{t:'Costruisco e chiudo',d:'Costruisco e chiudo il punto a rete'}]},
  {name:'overhead',     q:'8. Bandeja / vibora / smash',               opts:['Non li uso','Li provo ma con poca sicurezza',{t:'Bandeja semplice',d:'Uso almeno la bandeja in modo semplice'},{t:'Bandeja e smash',d:'Uso bandeja e smash con controllo'},{t:'Colpi alti tattici',d:'Uso colpi alti in modo tattico e affidabile'}]}
];

/* Livello sempre mostrato a una cifra decimale (4 → "4.0", 4.5 → "4.5"). */
function fmtLevel(v){ const n=parseFloat(v); return isFinite(n)?n.toFixed(1):String(v); }
function submitAssessment(answers){
  const res=emuCalcLevel(answers);
  const lvl=fmtLevel(res.calculated_level);
  if(res.coherence==='low'){
    // Incoerente (dichiarato vs tecnica > 1.0): l'ufficiale NON cambia → validazione staff.
    S.player.livelloVerifica=lvl; save();

      +'<br>🎾 Livello indicativo: <b>'+esc(lvl)+'</b>'
      +'<br>⚠️ C\'è una differenza tra il livello che hai indicato e le risposte tecniche.'
      +'<br>La <b>segreteria lo verifica</b> e te lo confermiamo qui. Per ora il tuo livello resta <b>'+esc(S.player.livello)+'</b>.',true);
  } else {
    // Coerente (alta/media): applichiamo subito il livello calcolato.
    S.player.livello=lvl; S.player.livelloFonte='autovalutazione'; S.player.livelloVerifica=null; save();
    addInHtml('✅ <b>Autovalutazione registrata</b>'
      +'<br>🎾 Il tuo livello ora è <b>'+esc(lvl)+'</b>'
      +'<br>Lo useremo per formarti partite equilibrate. Puoi rifarla quando vuoi.',true);
  }
  addQuick([{label:'👤 Il mio profilo',text:'Il mio profilo'},menuBtn()]);
}

/* ---------- REGISTRO DISPONIBILITÀ (Flow «Le mie disponibilità») ------------
   Sostituisce il blast dell'open-match con un push di PRECISIONE. Perché esiste:
   contattare 5 soci «giusti di livello ma occupati» costa 5 template marketing
   (€0,0658 l'uno) e soprattutto genera segnalazioni → il quality rating della WABA
   scende → limiti di invio o sospensione, cioè si perde il canale. Chi ha DICHIARATO
   giorno e fascia non segnala: per lui l'invito è atteso, non spam.

   Fedeltà WA — un solo Flow, schermata unica a sezioni (come openAssessmentFlow):
   · CheckboxGroup «giorni» = 7 voci (limite reale 20) ✓
   · CheckboxGroup «fasce»  = 3 voci ✓
   · Dropdown frequenza/preavviso/validità = 3-4 voci l'uno (limite 200) ✓
   Costo: 2 messaggi per aggiornamento (il CTA ↗ + la conferma), esattamente come le
   preferenze notifiche. La compilazione DENTRO il Flow non costa nulla.

   Vocabolario allineato alla scheda socio della web app staff (`availabilityProfile`
   = {days,time,frequency,notice,matchType,source,updatedAt}): `frequenza` e `preavviso`
   usano le stringhe ESATTE delle select staff, così il Flow scrive nel registro che la
   segreteria già vede e modifica. `matchType` (Maschile/Femminile/Mista) NON entra nel
   Flow: decisione D4 = niente filtro di genere nell'open-match. */
const DISPO_GIORNI=[{v:1,lb:'Lunedì'},{v:2,lb:'Martedì'},{v:3,lb:'Mercoledì'},{v:4,lb:'Giovedì'},{v:5,lb:'Venerdì'},{v:6,lb:'Sabato'},{v:0,lb:'Domenica'}];
const DISPO_DOW_LB=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
/* Le 3 fasce ricalcano i confini VERI del LISTINO (la fascia diurna chiude dove
   iniziano gli slot fissi: 18:00 lun–gio, 17:30 ven) — non orari inventati. Nel weekend
   i fissi finiscono alle 18:00: la «sera» di sabato/domenica non esiste e l'intersezione
   col calendario la scarta da sé, senza bisogno di regole in più qui. */
const DISPO_FASCE=[
  {id:'mattina',    lb:'☀️ Mattina e pranzo', d:'Dalle 09:00 alle 15:00'},
  {id:'pomeriggio', lb:'🌤️ Pomeriggio',       d:'Dalle 15:00 alle 17:30'},
  {id:'sera',       lb:'🌙 Sera',             d:'Dalle 17:30 in poi'}
];
/* Stringhe IDENTICHE alle select della scheda socio staff (#newDesiredFrequency e
   #newNotice): stesso vocabolario = stesso registro, nessuna traduzione da mantenere. */
const DISPO_FREQ=[
  {s:'1 volta a settimana',   max:1},
  {s:'2 volte a settimana',   max:2},
  {s:'3+ volte a settimana',  max:3},
  {s:'Quando capita',         max:99}
];
const DISPO_PREAVVISO=[
  {s:'Anche in giornata',       gg:0},
  {s:'Almeno 1 giorno prima',   gg:1},
  {s:'Almeno 2 giorni prima',   gg:2},
  {s:'Solo con largo anticipo', gg:4}
];
const DISPO_VALIDITA=[{s:'Ancora 1 mese',m:1},{s:'Ancora 3 mesi',m:3},{s:'Fino a fine stagione',m:null}];

function fasciaDiOra(ora){ const t=String(ora||''); if(t<'15:00') return 'mattina'; if(t<'17:30') return 'pomeriggio'; return 'sera'; }
function isoDa(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoOggi(){ return isoDa(new Date()); }
function isoTraMesi(m){ const d=new Date(); if(m==null) d.setMonth(11,31); else d.setMonth(d.getMonth()+m); return isoDa(d); }
function stampNow(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' · '+now(); }
function dispoLookup(list,s,def){ return list.filter(x=>x.s===s)[0]||def; }
function dispoMaxSettimana(d){ return dispoLookup(DISPO_FREQ, d&&d.frequenza, {max:2}).max; }
function dispoPreavvisoGiorni(d){ return dispoLookup(DISPO_PREAVVISO, d&&d.preavviso, {gg:0}).gg; }
function dispoVuota(d){ return !d || !(d.giorni||[]).length || !(d.fasce||[]).length; }
function dispoScaduta(d){ return !!(d && d.validoFino && isoOggi() > d.validoFino); }
/* Disponibilità dei soci demo del pool (in Fase 2 arrivano da Supabase). */
function dispoDemo(giorni,fasce,frequenza,preavviso){
  return {giorni:giorni, fasce:fasce, frequenza:frequenza, preavviso:preavviso,
          validoFino:isoTraMesi(3), source:'whatsapp', updatedAt:''};
}
/* Chiave con cui si interroga il registro a partire da UNA prenotazione. `dow` è sul
   rec per le prenotazioni nuove; per quelle salvate prima del campo si ricava dal
   giorno. `preavvisoGiorni` = a quanti giorni di distanza è la partita. */
function slotDiPrenotazione(rec){
  const off=offsetForGiorno(rec.giorno);
  return { dow:(rec.dow==null && off!=null) ? dayInfo(off).dow : rec.dow,
           fascia:fasciaDiOra(rec.ora),
           preavvisoGiorni:(off==null?0:off) };
}
/* Il match. `mode`:
   · 'esatto' → giorno E fascia dichiarati (giro 1, precisione massima)
   · 'giorno' → solo il giorno (giro 2: il GIORNO l'ha scelto lui, la fascia la
     allarghiamo noi → resta un invito atteso, non un blast). */
function dispoMatch(d, slot, mode){
  if(dispoVuota(d) || dispoScaduta(d)) return false;
  if(slot.dow==null) return false;
  if((d.giorni||[]).indexOf(slot.dow)<0) return false;
  if(slot.preavvisoGiorni < dispoPreavvisoGiorni(d)) return false;
  if(mode==='giorno') return true;
  return (d.fasce||[]).indexOf(slot.fascia)>=0;
}
/* Descrizione della riga List (≤72 char) — lo stato si legge senza aprire nulla, e un
   registro scaduto o mancante si vede a colpo d'occhio. */
function dispoSummary(){
  const p=S.player;
  if(!p.prefs || !p.prefs.openMatch) return 'Attiva «Cercami per le partite» per usarle';
  const d=p.disponibilita;
  if(dispoVuota(d)) return 'Non le hai ancora indicate';
  if(dispoScaduta(d)) return 'Scadute — aggiornale per farti ricontattare';
  const gg=(d.giorni||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(v=>DISPO_DOW_LB[v]).join(', ');
  const ff=(d.fasce||[]).join(' e ');
  const s=gg+' · '+ff;
  return s.length>72 ? s.slice(0,71)+'…' : s;
}
/* Dropdown fedele (Flow reale = Dropdown, ≤200 voci). Riusa `.flow-inp` per non
   introdurre CSS nuovo. */
function dispoSelect(opts, cur, onPick){
  const s=document.createElement('select'); s.className='flow-inp';
  opts.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; if(o===cur) op.selected=true; s.appendChild(op); });
  s.onchange=()=>onPick(s.value);
  return s;
}
function openDispoFlow(){
  const d=S.player.disponibilita||{};
  const st={ giorni:(d.giorni||[]).slice(), fasce:(d.fasce||[]).slice(),
             frequenza:d.frequenza||DISPO_FREQ[1].s,
             preavviso:d.preavviso||DISPO_PREAVVISO[0].s,
             validita:DISPO_VALIDITA[1].s };
  const body=el('flow');
  body.appendChild(el('luce-hint','Ti scriviamo <b>solo</b> quando manca un giocatore in una di queste finestre. Puoi cambiarle o toglierle quando vuoi.'));
  body.appendChild(fieldLabel('Che giorni puoi giocare'));
  const gl=el('friend-list');
  DISPO_GIORNI.forEach(g=>{
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=st.giorni.indexOf(g.v)>=0;
    cb.onchange=()=>{ const i=st.giorni.indexOf(g.v); if(cb.checked){ if(i<0) st.giorni.push(g.v); } else if(i>=0) st.giorni.splice(i,1); };
    const sp=document.createElement('span'); sp.textContent=g.lb;
    row.appendChild(cb); row.appendChild(sp); gl.appendChild(row);
  });
  body.appendChild(gl);
  body.appendChild(fieldLabel('In che fasce'));
  const fl=el('friend-list');
  DISPO_FASCE.forEach(f=>{
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=st.fasce.indexOf(f.id)>=0;
    cb.onchange=()=>{ const i=st.fasce.indexOf(f.id); if(cb.checked){ if(i<0) st.fasce.push(f.id); } else if(i>=0) st.fasce.splice(i,1); };
    const sp=document.createElement('span'); sp.innerHTML=esc(f.lb)+'<span class="opt-d">'+esc(f.d)+'</span>';
    row.appendChild(cb); row.appendChild(sp); fl.appendChild(row);
  });
  body.appendChild(fl);
  /* La frequenza è IL freno anti-spam: è il socio a dire quante volte tollera di
     essere cercato, e il matching lo rispetta (cap in poolCandidates). */
  body.appendChild(fieldLabel('Quante partite a settimana'));
  body.appendChild(dispoSelect(DISPO_FREQ.map(x=>x.s), st.frequenza, v=>{ st.frequenza=v; }));
  body.appendChild(fieldLabel('Con quanto preavviso'));
  body.appendChild(dispoSelect(DISPO_PREAVVISO.map(x=>x.s), st.preavviso, v=>{ st.preavviso=v; }));
  body.appendChild(fieldLabel('Per quanto vale'));
  body.appendChild(dispoSelect(DISPO_VALIDITA.map(x=>x.s), st.validita, v=>{ st.validita=v; }));
  body.appendChild(el('luce-hint','Passata questa data smettiamo di cercarti finché non la rinnovi: serve a non farti arrivare inviti per finestre che non valgono più.'));
  const foot=document.createElement('button'); foot.className='flow-submit'; foot.textContent='Salva disponibilità';
  foot.onclick=()=>{
    if(!st.giorni.length){ toast('Scegli almeno un giorno.'); return; }
    if(!st.fasce.length){ toast('Scegli almeno una fascia.'); return; }
    const val=dispoLookup(DISPO_VALIDITA, st.validita, DISPO_VALIDITA[1]);
    S.player.disponibilita={ giorni:st.giorni.slice(), fasce:st.fasce.slice(),
      frequenza:st.frequenza, preavviso:st.preavviso, validoFino:isoTraMesi(val.m),
      source:'whatsapp', updatedAt:stampNow() };
    // Compilare le disponibilità implica volerle usare: se l'opt-in era spento lo
    // accendiamo (il Flow stesso È il consenso esplicito) e lo DICIAMO nella conferma —
    // un consenso acceso di nascosto non sarebbe un consenso.
    const acceso=!S.player.prefs.openMatch; S.player.prefs.openMatch=true;
    save(); closeSheet();
    addOut('📅 Disponibilità aggiornate');
    botSay(()=>{
      addInHtml('✅ <b>Disponibilità salvate</b>'
        +'<br>📅 '+esc(dispoSummary())
        +'<br>🔁 '+esc(st.frequenza)+'<br>⏱️ '+esc(st.preavviso)
        +(acceso?'<br>🎾 Ho attivato «<b>Cercami per le partite</b>»':'')
        +'<br>Ti scriviamo <b>solo</b> in queste finestre. Per smettere: 🔔 Preferenze notifiche.',true);
      addQuick([{label:'👤 Il mio profilo',text:'Il mio profilo'},menuBtn()]);
    });
  };
  body.appendChild(foot);
  openSheet('Le mie disponibilità', body, 'Quando cercarti per una partita');
}

/* Aggiungi amico = il giocatore CONDIVIDE un contatto (📎 → Contatto). Su WhatsApp
   reale il business non legge la rubrica: riceve nome+numero solo se il giocatore
   condivide. Qui simuliamo il selettore contatti con RUBRICA. L'amico dev'essere un
   SOCIO (numero in anagrafica); se non lo è, gli si manda un invito a iscriversi. */
/* ctx (opzionale) = {backTo:<idPrenotazione>}: se presente, dopo l'aggiunta si TORNA
   al modulo "Completa la partita" (aggiunta amico al volo durante la prenotazione). */
function openAddFriendFlow(ctx){

function openContactPicker(ctx){
  const body=el('flow');
  body.appendChild(el('luce-hint','La tua rubrica — tocca il contatto da condividere con la segreteria.'));
  const list=el('friend-list');
  RUBRICA.forEach(c=>{ const row=el('friend-row'); row.style.justifyContent='space-between';
    row.innerHTML='<span>👤 '+esc(c.nome)+'</span><span style="color:var(--muted);font-size:12px">'+esc(c.numero)+'</span>';
    row.onclick=()=>{ closeSheet(); shareContact(c, ctx); }; list.appendChild(row); });
  body.appendChild(list);

function normNum(n){ return (n||'').replace(/\D/g,''); }
function isGiaAmico(entry){ return S.friends.some(f=>normNum(f.numero)===normNum(entry.numero)); }
/* Ritorno al modulo "Completa la partita" dopo un'aggiunta al volo (se ctx.backTo). */
function backToRoster(ctx){ if(!ctx||!ctx.backTo) return null; return ()=>{ const rr=S.prenotazioni.find(x=>x.id===ctx.backTo); if(!rr){ homeMenu(); return; }
  // Aggiunta amico durante l'invito → torna alla LISTA invito (così invita subito il nuovo);
  // altrimenti (aggiunta dal CheckboxGroup) torna al modulo togli/revoca.
  if(ctx.invite){ botSay(()=>openInviteFriendsList(rr)); return; }
  botSay(()=>addFlowLaunch('Torniamo al modulo — spunta gli amici che giocano con te.', ()=>openAddPlayersFlow(rr))); }; }
/* Il giocatore ha condiviso un contatto → 3 rami secondo l'anagrafica. */
function shareContact(entry, ctx){
  const back=backToRoster(ctx);
  addOut('📇 '+entry.nome);                                    // il giocatore "invia" il contatto
  botSay(()=>{
    if(!entry.socio){ inviteToJoin(entry, back); return; }      // non in anagrafica → invito a iscriversi
    if(isGiaAmico(entry)){ addInHtml('👍 <b>'+esc(entry.nome)+'</b> è già tra i tuoi amici.'); if(back) addQuick([{label:'🔙 Torna a completare',action:back}]); else homeMenu(); return; }
    S.friends.push({id:++S.seq, nome:entry.nome, numero:entry.numero, suWhatsApp:entry.suWhatsApp, origine:'socio'}); save();
    addInHtml('✅ Ho aggiunto <b>'+esc(entry.nome)+'</b> ai tuoi amici.'
      +(entry.suWhatsApp?'':'<br>ℹ️ Non ti ha ancora scritto sul canale, ma puoi invitarlo lo stesso: l\'invito parte dal tuo WhatsApp.'),true);
    if(back) addQuick([{label:'🔙 Torna a completare',action:back}]);
    else addQuick([{label:'🎾 Prenota',text:'Vorrei prenotare un campo'},{label:'👥 I miei amici',text:'I miei amici'}]);
  });
}
/* Ramo non-socio: NON possiamo scrivergli noi (niente opt-in → policy Meta). Diamo
   al giocatore un invito PRONTO da inoltrare lui; quando il nuovo giocatore ci scrive
   parte la sua iscrizione (definita nella sua futura chat, non qui). */
function inviteToJoin(entry, back){
  const nome1=entry.nome.split(' ')[0];
  addInHtml('🙂 <b>'+esc(entry.nome)+'</b> non è ancora iscritto a Padel Village, quindi non possiamo aggiungerlo tra gli amici.<br>Puoi invitarlo tu: gli inoltri l’invito e, appena ci scrive, lo iscriviamo.');
  // reply-button ≤20: con nomi lunghi "✉️ Invita <nome>" sfora → in quel caso solo "✉️ Invita".
  const invLbl=('✉️ Invita '+nome1).length>20 ? '✉️ Invita' : '✉️ Invita '+nome1;
  const btns=[{label:invLbl, action:()=>{ addOut('Invita '+nome1); botSay(()=>showJoinInvite(entry, back)); }}];
  btns.push(back ? {label:'🔙 Torna a completare',action:back} : {label:'Lascia stare', action:()=>botSay(()=>{ addInHtml('Ok, nessun problema.'); homeMenu(); })});
  addQuick(btns);
}
function showJoinInvite(entry, back){
  const nome1=entry.nome.split(' ')[0];
  addSys('Inoltra questo messaggio a '+nome1);
  addInHtml('🎾 <b>Padel Village</b>'

  if(back) addQuick([{label:'🔙 Torna a completare',action:back}]); else homeMenu();
}

/* ---------- Le mie prenotazioni -------------------------------------------- */
function statoPren(p){
  // Stato interno: 'confermato' (incompleto, campo tuo) vs 'completo' (al completo).
  // All'utente: sempre "Prenotato"; se incompleto ricordiamo che è da completare e
  // che il campo è sotto la sua responsabilità.
  if(p.stato==='completo') return '✅ Prenotato · partita al completo';
  return '✅ Prenotato · da completare '+rosterFilled(p)+'/'+rosterTarget(p)+(rosterPending(p)?(' · 🟡 in attesa: '+p.invitati.join(', ')):'')+' · sei responsabile del campo';
}
/* Descrizione della riga "Giocatori" nel dettaglio (≤72 char): riflette lo stato
   del roster e cosa puoi farci (invita/aggiungi/togli, o togli/sostituisci se completa). */
function playersDesc(p){
  const filled=rosterFilled(p), tgt=rosterTarget(p), pend=rosterPending(p);
  if(p.stato==='completo') return 'Al completo '+filled+'/'+tgt+' · togli o sostituisci';
  return filled+'/'+tgt+(pend?(' · '+pend+' in attesa'):'')+' · invita, aggiungi o togli';
}
/* Le mie prenotazioni: LISTA (List Message ≤10) → tocca → DETTAGLIO = List
   "Gestisci la prenotazione". Pattern fedele a WhatsApp (niente valanga di reply-buttons). */
function doMie(){
  const list=S.prenotazioni;
  if(!list.length){ addInHtml('Al momento non hai prenotazioni future. Vuoi prenotare un campo?'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}, menuBtn()]); return; }

}
function showBookingDetail(id){
