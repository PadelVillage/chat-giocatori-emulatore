<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Anti-cache: chiediamo al browser di non tenere in cache questa pagina (evita di
     mostrare una versione vecchia col telefono, es. promemoria già rimossi). Difesa
     debole (i meta non ripuliscono una copia GIÀ in cache) → vedi freshnessGuard nel JS. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Emulatore chat giocatori — Padel Village</title>
<style>
  :root{--ink:#111b21;--muted:#667781;--wa-green:#128C7E;--wa-bg:#ECE5DD}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0b141a;color:var(--ink);display:flex;justify-content:center}
  .app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;background:var(--wa-bg);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:520px){
    body{align-items:center;background:#111b21}
    .app{height:92vh;max-height:900px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  }
  /* Header */
  .head{background:var(--wa-green);display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;flex:0 0 auto;z-index:5}
  .head .back{font-size:20px;line-height:1;opacity:.9}
  .av{width:36px;height:36px;border-radius:50%;background:#0c5f57;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .hname{font-size:15px;font-weight:600;line-height:1.15}
  .hstatus{font-size:11px;opacity:.85}
  .head .spacer{flex:1}
  .head .reset{font-size:12px;background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 9px;border-radius:14px;cursor:pointer}
  /* Identity band */
  .band{background:#d6e7d2;color:#3a5a40;font-size:12px;text-align:center;padding:6px 12px;flex:0 0 auto}
  /* Chat */
  .chat{flex:1 1 auto;overflow-y:auto;padding:12px 10px 14px;display:flex;flex-direction:column;gap:8px}
  .sys{align-self:center;background:#d6e7d2;color:#3a5a40;font-size:11px;padding:4px 12px;border-radius:10px;text-align:center;max-width:92%}
  .in,.out{max-width:82%;padding:7px 10px 5px;border-radius:9px;font-size:14px;line-height:1.44;position:relative;white-space:pre-wrap;word-wrap:break-word}
  .in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
  .out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
  .meta{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:3px}
  .tick{color:#34b7f1}
  .card{background:#fff;align-self:flex-start;max-width:86%;border-radius:9px;border-top-left-radius:2px;padding:9px 11px;
    font-size:13.5px;line-height:1.6;border-left:3px solid var(--wa-green)}
  /* Reply buttons (stile WhatsApp) */
  .qr{align-self:flex-start;width:min(86%,320px);background:#fff;border-radius:9px;overflow:hidden;margin-top:-2px;
    box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;flex-direction:column;flex:0 0 auto}
  .qbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:14px;color:#027eb5;
    border-top:1px solid #eff2f3;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:inherit}
  .qr .qbtn:first-child{border-top:0}
  .qbtn.danger{color:#c0392b}
  .qbtn:active{background:#f2f5f6}
  /* Menu a lista (list message) */
  .menu{align-self:flex-start;width:min(92%,340px);background:#fff;border-radius:9px;border-top-left-radius:2px;overflow:hidden;
    box-shadow:0 1px 1px rgba(0,0,0,.06);flex:0 0 auto}
  .menu-head{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px 3px;font-weight:600}
  .menu-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #f0f3f4;cursor:pointer}
  .menu-row:active{background:#f4f7f8}
  .menu-ic{width:24px;text-align:center;font-size:16px}
  .menu-lb{flex:1;font-size:14px;color:var(--ink);min-width:0}
  .menu-lb-t{display:block}
  .menu-lb-d{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
  .menu-ch{color:#c3cbcf;font-size:18px}
  /* Typing */
  .typing{align-self:flex-start;background:#fff;border-radius:9px;border-top-left-radius:2px;padding:10px 12px;display:inline-flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b5c0c4;display:inline-block;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  /* Nota demo */
  .demo-note{flex:0 0 auto;background:#fff4d6;color:#8a6d00;font-size:11.5px;text-align:center;padding:6px 12px;border-top:1px solid #f0e3b0}
  /* Input */
  .bar{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--wa-bg);flex:0 0 auto}
  .ic-btn{background:none;border:0;font-size:20px;cursor:pointer;color:#54656f;flex:0 0 auto;padding:4px}
  .field{flex:1;background:#fff;border-radius:20px;padding:10px 14px;font-size:15px;border:0;outline:0;font-family:inherit;color:var(--ink)}
  .send{width:42px;height:42px;border-radius:50%;background:var(--wa-green);border:0;color:#fff;font-size:19px;cursor:pointer;flex:0 0 auto}
  .send:active{background:#0c5f57}
  /* Bottom sheet (simulazione WhatsApp Flow / schermate) */
  .sheet-ov{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;z-index:20}
  .sheet-ov.show{opacity:1}
  .sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .25s;padding-bottom:16px}
  .sheet.show{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #eef1f2;display:flex;align-items:flex-start;z-index:2}
  .sheet-handle{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#d5dbdd}
  .sheet-title{font-size:16px;font-weight:600;color:var(--ink);flex:1}
  .sheet-sub{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
  .sheet-x{background:none;border:0;font-size:16px;color:var(--muted);cursor:pointer}
  .flow-lb{font-size:12.5px;font-weight:600;color:var(--wa-green);padding:13px 14px 3px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:3px 14px 4px}
  .chip{border:1px solid #cdd6d9;background:#fff;color:var(--ink);border-radius:16px;padding:8px 13px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .chip.sel{background:var(--wa-green);border-color:var(--wa-green);color:#fff}
  .chip.opt:not(.sel){background:#fff4d6;border-color:#f0e3b0;color:#8a6d00}
  .flow-inp{width:calc(100% - 28px);margin:3px 14px 4px;background:#f3f6f7;border:1px solid #e2e8ea;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:0}
  .friend-list{padding:2px 14px}
  .friend-row{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:14px;border-bottom:1px solid #f2f5f6;cursor:pointer}
  .friend-row input{width:19px;height:19px;flex:0 0 auto}
  /* Disponibilità nel Flow: striscia giorni + orari a 3 stati */
  .days{display:flex;gap:8px;overflow-x:auto;padding:3px 14px 4px}
  .day{flex:0 0 auto;min-width:62px;border:1px solid #cdd6d9;background:#fff;border-radius:10px;padding:7px 8px;text-align:center;cursor:pointer;font-family:inherit;line-height:1.25}
  .day b{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
  .day span{display:block;font-size:11px;color:var(--muted)}
  .day small{display:block;font-size:10px;margin-top:2px;font-weight:600}
  .day small.ok{color:#0f8a6d}
  .day small.no{color:#b5c0c4}
  .day.sel{border-color:var(--wa-green);background:#d9f2ee}
  .slot-fascia{font-size:11px;font-weight:600;color:var(--muted);padding:7px 14px 3px;text-transform:uppercase;letter-spacing:.4px}
  .slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
  .slot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 3px;border-radius:9px;font-family:inherit;cursor:pointer;border:1px solid transparent;line-height:1.1}
  .slot b{font-size:13.5px;font-weight:600}
  .slot small{font-size:10.5px;font-weight:600;opacity:.9}
  .slot.free{background:#eaf7e6;color:#0c5f57;border-color:#bfe6c8}
  .slot.conf{background:#fff4d6;color:#8a6d00;border-color:#f0e3b0}
  .slot.busy{background:#f4f6f7;color:#b9c2c6;border-color:#eef1f2;text-decoration:line-through;cursor:default}
  .slot.sel{background:var(--wa-green);color:#fff;border-color:var(--wa-green)}
  .slot-empty{font-size:13px;color:var(--muted);padding:12px 16px;text-align:center}
  .luce-hint{font-size:11.5px;color:var(--muted);padding:3px 2px 0}
  .flow-legend{display:flex;gap:13px;padding:8px 14px 0;font-size:11px;color:var(--muted)}
  .flow-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .dot.free{background:#2ea36b}.dot.conf,.dot.opt{background:#e0a52e}.dot.busy{background:#c3cbcf}
  .flow-sum{margin:12px 14px 0;padding:10px 12px;background:#f3f6f7;border-radius:10px;font-size:13px;color:var(--muted)}
  .flow-sum.on{background:#eaf7e6;color:#0c5f57}
  .flow-sum .warn{color:#8a6d00;font-weight:600}
  .flow-submit{margin:16px 14px 4px;width:calc(100% - 28px);background:var(--wa-green);color:#fff;border:0;border-radius:22px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .toast{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;font-size:13px;padding:9px 15px;border-radius:20px;z-index:30;max-width:80%;text-align:center}
  /* Ice Breakers (bottoni primo contatto — Meta: niente emoji, max 4) */
  .ice{align-self:center;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:2px 8px 4px;max-width:96%}
  .ice-b{background:#fff;border:1px solid #cfe0dc;color:#0c5f57;border-radius:17px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .ice-b:active{background:#eef6f4}
  /* Menu comandi "/" (Commands — sempre richiamabile digitando /) */
  .cmd-pop{display:none;flex-direction:column;background:#fff;border-top:1px solid #e2e8ea;max-height:230px;overflow-y:auto;flex:0 0 auto}
  .cmd-pop.show{display:flex}
  .cmd-head{font-size:11px;color:var(--muted);padding:9px 14px 3px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .cmd-row{display:flex;align-items:baseline;gap:10px;padding:10px 14px;cursor:pointer;border-top:1px solid #f2f5f6}
  .cmd-row:active{background:#f4f7f8}
  .cmd-c{font-size:14px;color:#027eb5;font-weight:600}
  .cmd-d{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <span class="back">‹</span>
    <div class="av">PV</div>
    <div><div class="hname">Padel Village</div><div class="hstatus" id="hstatus">online</div></div>
    <div class="spacer"></div>
    <button class="reset" id="resetBtn" title="Ricomincia da capo">↺ Ricomincia</button>
  </div>
  <div class="band" id="band">✓ Numero riconosciuto: …</div>
  <div class="chat" id="chat"></div>
  <div class="demo-note">🔒 Modalità demo — nessuna prenotazione reale · <span id="buildTag"></span></div>
  <div class="cmd-pop" id="cmdPop"></div>
  <form class="bar" id="bar" autocomplete="off">
    <button type="button" class="ic-btn" id="emojiBtn">😊</button>
    <input class="field" id="field" placeholder="Messaggio" autocomplete="off">
    <button type="button" class="ic-btn" id="clipBtn">📎</button>
    <button class="send" id="send" type="submit">↑</button>
  </form>
</div>

<script>
/* ============================================================================
   EMULATORE CHAT GIOCATORI — Padel Village · Fase B (mockup-first)
   100% self-contained: nessuna chiamata reale, nessuna scrittura in Matchpoint.
   Simula i tipi di messaggio WhatsApp (bolle, pulsanti di risposta, menu a
   lista) e i "WhatsApp Flows" (moduli a scomparsa dal basso). Backend FINTO
   in localStorage. Vedi 01-analisi-operativita-chat-giocatori.md
   🔒 REGOLA FERMA (doc §9): qui si realizza SOLO ciò che è riproducibile
   fedelmente su WhatsApp reale (componenti/limiti Flows + policy Meta).
   Verificare sui doc Meta PRIMA di aggiungere grafica/layout/interazioni.
   ========================================================================== */
const LS_KEY='pmo_emu_state_v6';
/* Versione visibile nel footer: serve a capire SUBITO se il browser sta
   mostrando una versione vecchia in cache (Cmd+Shift+R per forzare il reload). */
const APP_BUILD='v0.16 · 03/07';

/* ─── freshnessGuard: auto-guarigione da cache vecchia ──────────────────────
   GitHub Pages / il browser del telefono possono servire un index.html VECCHIO
   dalla cache (è così che riapparivano "Promemoria"/"Ultima chiamata" già rimossi
   dal codice: il JS vecchio in memoria li ri-programmava). I meta anti-cache non
   bastano perché non ripuliscono una copia già memorizzata. Qui, all'avvio,
   scarichiamo il file dal server SENZA cache e confrontiamo APP_BUILD: se il server
   ha un build diverso da quello in esecuzione, la pagina si ricarica DA SOLA su una
   URL con build stampato (nuova chiave di cache = fetch garantito fresco). Nessun
   hard reload manuale; si auto-corregge a ogni visita. Loop-safe: non re-indirizza
   se la URL contiene già ?b=. */
(function freshnessGuard(){
  try{
    if(location.search.indexOf('b=')!==-1) return;      // già arrivati da un redirect: stop
    fetch(location.pathname+'?_fresh='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m=html.match(/APP_BUILD='([^']+)'/);
        if(m && m[1]!==APP_BUILD){
          location.replace(location.pathname+'?b='+encodeURIComponent(m[1]));
        }
      })
      .catch(function(){});
  }catch(e){}
})();

/* --- Dati demo ------------------------------------------------------------- */
function demoState(){
  return {
    player:{ nome:'Marco Aprea', numero:'+39 333 123 4567', socio:true, livello:'4.0', inRegola:true,
             genere:'M',   // dal dato anagrafica: serve alla domanda concierge "mista o omogenea" (F = donna)
             borselloCent:2400, ultimoMov:'ricarica € 20 il 28/06' },
    /* Amici = SOCI del circolo (numero in anagrafica). Niente livello: dopo la
       rimozione delle partite aperte non filtra più nulla. suWhatsApp = ha scritto
       al canale (opt-in) → invitabile; chi non ce l'ha (Giulia) è mostrato come
       voce disabilitata (enabled:false del CheckboxGroup Flow): non possiamo scrivergli. */
    friends:[
      {id:11,nome:'Luca Bianchi', numero:'+39 333 555 0102', suWhatsApp:true},
      {id:12,nome:'Sara Rossi',   numero:'+39 333 555 0103', suWhatsApp:true},
      {id:13,nome:'Giulia Verdi', numero:'+39 333 555 0104', suWhatsApp:false},
      {id:14,nome:'Paolo Neri',   numero:'+39 333 555 0105', suWhatsApp:true}
    ],
    /* Demo pulita: una prenotazione confermata come esempio, NESSUNA opzione
       attiva (altrimenti la guardia "1 opzione per volta" bloccherebbe subito
       una nuova prenotazione). Lo stato 🟠 Opzionato lo si vede prenotando. */
    prenotazioni:[
      { id:1, giorno:dayInfo(2).giorno, ora:'19:00', campo:3, tipo:'Partita', durata:90, stato:'prenotato', target:4, amici:['Luca','Sara','Paolo'] }
    ],
    seq:100
  };
}
let S=load();
function load(){ try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):demoState();}catch(e){return demoState();} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
function resetDemo(){ S=demoState(); save(); }

let convo={mode:'idle',step:null,draft:{}};
function resetConvo(){ convo={mode:'idle',step:null,draft:{}}; }

/* --- DOM utility ----------------------------------------------------------- */
const chat=document.getElementById('chat');
const field=document.getElementById('field');
const appEl=document.querySelector('.app');
function now(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function scrollDown(){ chat.scrollTop=chat.scrollHeight; }
function el(cls,html){ const e=document.createElement('div'); e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addSys(t){ chat.appendChild(el('sys',t)); scrollDown(); }
function addOut(t){ chat.appendChild(el('out', esc(t)+'<span class="meta">'+now()+'</span>')); scrollDown(); }
function addInHtml(html,ticks){ const e=el('in', html+'<span class="meta">'+now()+(ticks?' <span class="tick">✓✓</span>':'')+'</span>'); chat.appendChild(e); scrollDown(); return e; }
function addCard(html){ chat.appendChild(el('card',html)); scrollDown(); }
function addQuick(btns){
  const wrap=el('qr');
  btns.forEach(b=>{ const btn=document.createElement('button'); btn.className='qbtn'+(b.danger?' danger':''); btn.textContent=b.label;
    btn.onclick=()=>{ wrap.remove(); if(b.action) b.action(); else sendUser(b.text!=null?b.text:b.label,b.silent); };
    wrap.appendChild(btn); });
  chat.appendChild(wrap); scrollDown();
}
function addMenu(rows){
  const m=el('menu'); let cur=null;
  rows.forEach(r=>{
    if(r.section && r.section!==cur){ cur=r.section; const h=el('menu-head'); h.textContent=r.section; m.appendChild(h); }
    const row=el('menu-row','<span class="menu-ic">'+(r.ic||'•')+'</span><span class="menu-lb"><span class="menu-lb-t">'+esc(r.label)+'</span>'+(r.desc?'<span class="menu-lb-d">'+esc(r.desc)+'</span>':'')+'</span><span class="menu-ch">›</span>');
    row.onclick=()=>{ if(r.action) r.action(); else sendUser(r.text!=null?r.text:r.label); };
    m.appendChild(row);
  });
  chat.appendChild(m); scrollDown();
}
function botSay(fn,delay){
  const t=el('typing','<i></i><i></i><i></i>'); chat.appendChild(t); scrollDown();
  const st=document.getElementById('hstatus'); st.textContent='sta scrivendo…';
  setTimeout(()=>{ t.remove(); st.textContent='online'; fn(); }, delay||620);
}
function toast(msg){ const t=el('toast',esc(msg)); appEl.appendChild(t); setTimeout(()=>t.remove(),1700); }

/* --- Bottom sheet (simula WhatsApp Flow / schermate) ----------------------- */
function openSheet(title,bodyNode,subtitle){
  closeSheet();
  const ov=el('sheet-ov'); ov.id='sheetOv';
  const sh=el('sheet');
  const head=el('sheet-head','<div class="sheet-handle"></div><div class="sheet-title">'+esc(title)+(subtitle?'<div class="sheet-sub">'+esc(subtitle)+'</div>':'')+'</div><button class="sheet-x" id="sheetX">✕</button>');
  sh.appendChild(head); sh.appendChild(bodyNode); ov.appendChild(sh); appEl.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) closeSheet(); };
  setTimeout(()=>{ ov.classList.add('show'); sh.classList.add('show'); },10); /* no rAF: inaffidabile in anteprima headless */
  document.getElementById('sheetX').onclick=closeSheet;
}
function closeSheet(){ const ov=document.getElementById('sheetOv'); if(ov) ov.remove(); }
function fieldLabel(t){ const d=el('flow-lb'); d.textContent=t; return d; }
function chipRow(items,onPick){
  const row=el('chips');
  items.forEach(it=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=it.label; b.dataset.val=it.val;
    b.onclick=()=>onPick(it.val,b,row); row.appendChild(b); });
  return row;
}
function selectOne(row,btn){ Array.from(row.children).forEach(c=>c.classList.remove('sel')); btn.classList.add('sel'); }
function preselectChip(row,val){ Array.from(row.children).forEach(c=>{ if(String(c.dataset.val)===String(val)) c.classList.add('sel'); }); }

/* --- Dominio --------------------------------------------------------------- */
function euro(cent){ return '€ '+(cent/100).toFixed(2).replace('.',','); }
function durataDefault(tipo){ return tipo==='Lezione'?60:90; }
function lbl(d){ return ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function dateFromOffset(off){ const d=new Date(); d.setDate(d.getDate()+off); return {giorno:lbl(d),dow:d.getDay()}; }
function addMin(hhmm,min){ const [h,m]=hhmm.split(':').map(Number); const tot=h*60+m+min; return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0'); }
/* --- LISTINO ESTIVO (prezzi a testa; campo = ×4) --------------------------
   Modello IBRIDO per tipo di giorno (vedi listino.html). LUCE SEMPRE INCLUSA
   (nessun supplemento). Prezzi:
   · Lun–Gio: fascia diurna 09:00–18:00 = 8€, MA 12:00–15:00 = 10€ (fascia
     centrale), avvii ogni 30' · fissi serali 18:00=12, 19:30=13, 21:00=12.
   · Ven: fascia 09:00–17:30 = 8€, 12:00–15:00 = 10€ · fissi 17:30/19:00/20:30=12.
   · Sab–Dom: solo fissi ogni 90' (09:00→18:00) = 8€.
   La fascia diurna chiude dove iniziano i fissi; la partita (durata) deve
   rientrare nella fascia → l'ultimo avvio dipende dalla durata. */
/* Partita SEMPRE 90' in 4 (niente tariffa "in due" / slot da 60'). */
const LISTINO={
  weekday:{ fascia:{start:'09:00',end:'18:00',prezzo:8},
            fissi:[{ora:'18:00',prezzo:12},{ora:'19:30',prezzo:13},{ora:'21:00',prezzo:12}] },
  friday :{ fascia:{start:'09:00',end:'17:30',prezzo:8},
            fissi:[{ora:'17:30',prezzo:12},{ora:'19:00',prezzo:12},{ora:'20:30',prezzo:12}] },
  weekend:{ fascia:null,
            fissi:[{ora:'09:00',prezzo:8},{ora:'10:30',prezzo:8},{ora:'12:00',prezzo:8},{ora:'13:30',prezzo:8},{ora:'15:00',prezzo:8},{ora:'16:30',prezzo:8},{ora:'18:00',prezzo:8}] }
};
/* Fascia centrale (solo lun–ven, dove esiste la fascia diurna): l'avvio tra le
   12:00 e le 15:00 costa 10€/testa invece di 8. Determinato dall'ORARIO DI AVVIO. */
const MIDDAY={start:12*60,end:15*60,prezzo:10};
function dayConfig(dow){ if(dow===0||dow===6) return LISTINO.weekend; if(dow===5) return LISTINO.friday; return LISTINO.weekday; }
function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
/* Prezzo a testa di uno slot di FASCIA diurna: 8€, oppure 10€ se l'avvio è
   nella fascia centrale 12–15 (partita sempre 90' in 4). */
function fasciaPrezzo(fascia,ora){
  const t=toMin(ora);
  if(t>=MIDDAY.start && t<MIDDAY.end) return MIDDAY.prezzo;
  return fascia.prezzo;
}
function fromMin(x){ return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); }
/* Avvii della fascia diurna: ogni 30' finché la partita (durata) rientra nella fascia. */
function fasciaTimes(fascia,durata){ const res=[]; const end=toMin(fascia.end); let t=toMin(fascia.start);
  while(t+durata<=end){ res.push(fromMin(t)); t+=30; if(res.length>60) break; } return res; }
/* Gruppi di slot del giorno, con prezzo e stato. 4 CAMPI = dietro le quinte:
   un orario è "disponibile" finché ≥1 dei 4 campi è libero (qui slotStatus).
   Il giocatore vede solo gli orari, mai i campi né il packing.
   3 stati riproducibili nei WhatsApp Flows reali (doc §9): free = libero ·
   conf = su conferma segreteria (description) · busy = occupato (nascosto). */
function daySlotGroups(off,dow,durata,players){
  const cfg=dayConfig(dow); durata=durata||90; players=players||4; const groups=[];
  if(cfg.fascia){
    groups.push({ name:'Fascia diurna', kind:'fascia',
      slots:fasciaTimes(cfg.fascia,durata).map(t=>({ora:t,prezzo:fasciaPrezzo(cfg.fascia,t),kind:'fascia',status:slotStatus(off,dow,t)})) });
  }
  groups.push({ name:(cfg.fascia?'Slot serali':'Slot fissi'), kind:'fisso',
    slots:cfg.fissi.map(f=>({ora:f.ora,prezzo:f.prezzo,kind:'fisso',status:slotStatus(off,dow,f.ora)})) });
  return groups;
}
function slotMetaFor(off,dow,ora,durata,players){ const gs=daySlotGroups(off,dow,durata,players);
  for(const g of gs){ const s=g.slots.find(x=>x.ora===ora); if(s) return s; } return null; }
/* Prezzo a testa/campo. Luce sempre inclusa. Partita sempre in 4 (90'):
   campo = testa × 4. */
function slotPrezzo(meta){ if(!meta) return {testa:0,campo:0,giocatori:4};
  const testa=meta.prezzo;
  return {testa,campo:testa*4,giocatori:4}; }
/* Momenti (passo 2 del selettore): raggruppano gli orari per parte del giorno,
   così si mostrano pochi slot per volta (fedele a un Flow multi-schermata). */
const MOMENTI=[{key:'mattina',label:'Mattina'},{key:'pomeriggio',label:'Pomeriggio'},{key:'sera',label:'Sera'}];
function momentoKey(ora){ const h=toMin(ora)/60; if(h<13) return 'mattina'; if(h<17.5) return 'pomeriggio'; return 'sera'; }
function daySlotsFlat(off,dow,durata,players){ const out=[]; daySlotGroups(off,dow,durata,players).forEach(g=>g.slots.forEach(s=>out.push(s))); return out; }
function dayInfo(off){ const d=new Date(); d.setDate(d.getDate()+off);
  return { off, giorno:lbl(d), dow:d.getDay(),
    w: off===0?'oggi':(off===1?'domani':['dom','lun','mar','mer','gio','ven','sab'][d.getDay()]),
    n: String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0') }; }
function offsetForGiorno(g){ for(let o=0;o<=MAX_GIORNI;o++){ if(dayInfo(o).giorno===g) return o; } return null; }
/* --- OPZIONE → PRENOTAZIONE (modello a opzione gratuita) ------------------
   Prenotare = OPZIONARE il campo (a tuo nome, GRATIS, senza anticipi). Hai una
   finestra legata alla distanza per COMPLETARE LA PARTITA (gli altri giocatori):
     5–10 gg → 24h · 1–4 gg → 12h · oggi → 1h (mai oltre l'inizio partita).
   · partita al completo (4 giocatori) → ✅ PRENOTATO (auto).
   · finestra scaduta e partita incompleta → il campo si LIBERA.
   La partita è sempre PRIVATA (la riempie l'organizzatore invitando amici SOCI o
   la delega alla segreteria); niente "partite aperte" ad altri soci, niente ospiti.
   4 CAMPI dietro le quinte: ogni orario ha 4 campi. Vista giocatore (uno stato
   per orario, campi nascosti):
     ≥1 libero → 'free' (verde) · tutti pieni → 'busy' (occupato, nascosto).
   Disdetta = campo liberato, nulla perso (nessun anticipo). Tutto SIMULATO. */
const MAX_GIORNI=10;             // non si prenota oltre 10 giorni in avanti
const CONCIERGE_FEE=5;           // € servizio "organizza la partita": addebitato SOLO sulla quota di chi ha prenotato per primo (l'organizzatore), in segreteria
/* Nota supplemento — riga unica, riusata ovunque (DRY + copy coerente). WhatsApp:
   testo semplice, enfasi solo con emoji/grassetto. Niente più parentesi "(di chi
   ha prenotato per primo)": ridondante e prolissa (l'utente l'ha chiesto). */
const FEE_LINE='💶 +'+CONCIERGE_FEE+' € solo sulla tua quota, in segreteria.';

   legge la rubrica: è il giocatore a condividere un contatto e noi riceviamo nome+numero.
   Copre i 3 rami: socio-non-amico (si aggiunge) · già-amico · non-socio (→ invito a iscriversi). */
const RUBRICA=[

  {nome:'Marco Esterno', numero:'+39 333 555 0199', socio:false, suWhatsApp:false}   // non socio → ramo iscrizione
];
const LEAD_MIN=30;               // anticipo minimo: non prenotabile se manca <30' all'avvio
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function courtsFor(off,dow,ora){
  const mins=toMin(ora);
  // Oggi: uno slot sparisce quando è passato O manca meno dell'anticipo minimo
  // (30') al suo avvio → si può prenotare al massimo fino a 30' prima.
  if(off===0 && mins<=nowMin()+LEAD_MIN) return {free:0,paid:4};
  const k=(off*31+mins)%13;
  if(k===2||k===7||k===9) return {free:0,paid:4};  // tutto pieno → occupato (nascosto)
  return {free:4,paid:0};                           // libero → verde
}
function slotStatus(off,dow,ora){ const c=courtsFor(off,dow,ora);
  return c.free>0 ? 'free' : 'busy'; }
/* Finestra per completare la partita, per distanza (giorni) dall'inizio. */
function rosterWindow(off){
  if(off===0) return {tier:'last minute', h:1,  lbl:'1 ora'};
  if(off<=4)  return {tier:'via di mezzo', h:12, lbl:'12 ore'};
  return {tier:'programmata', h:24, lbl:'24 ore'};
}
function matchStartMs(off,ora){ const d=new Date(); d.setDate(d.getDate()+off); const [h,m]=ora.split(':').map(Number); d.setHours(h,m,0,0); return d.getTime(); }
/* Scadenza assoluta dell'opzione (ms): adesso + finestra, mai oltre l'inizio partita. */
function optDeadlineMs(off,ora){ const win=rosterWindow(off); let dl=Date.now()+win.h*3600*1000;
  if(off===0) dl=Math.min(dl,matchStartMs(off,ora)); return dl; }
function fmtRemaining(ms){ if(ms<=0) return 'scaduta'; const m=Math.floor(ms/60000); if(m<60) return m+' min'; return Math.floor(m/60)+'h '+(m%60)+'m'; }
/* Roster: l'organizzatore conta come 1; amici[] = gli altri giocatori. */
function rosterTarget(rec){ return rec.target||4; }
function rosterFilled(rec){ return 1+((rec.amici&&rec.amici.length)||0); }   // confermati (organizzatore + amici che hanno confermato)
function rosterPosti(rec){ return Math.max(0, rosterTarget(rec)-rosterFilled(rec)); }
function rosterPending(rec){ return (rec.invitati&&rec.invitati.length)||0; } // inviti in attesa di risposta
/* Anti-abuso: 1 sola opzione attiva (non confermata, non scaduta) per volta. */
function activeOption(){ return S.prenotazioni.find(p=>p.stato==='opzionato' && (p.deadline||0)>Date.now()); }

  addQuick([{label:'📅 Vedi la mia opzione',action:()=>botSay(doMie)}]); return true; }
/* Conteggio orari DISPONIBILI (liberi) del giorno, per l'indicatore. */
function availSlots(off,dow){ let c=0; daySlotGroups(off,dow,90).forEach(g=>g.slots.forEach(s=>{ if(s.status!=='busy') c++; })); return c; }
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
function parseWhen(txt){
  const t=txt.toLowerCase(); const base=new Date(); let target=null;
  if(/\boggi\b/.test(t)) target=new Date(base);
  else if(/\bdomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+1); }
  else if(/\bdopodomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+2); }
  else for(let i=0;i<7;i++){ if(t.includes(GIORNI[i])){ target=new Date(base); let diff=(i-base.getDay()+7)%7; if(diff===0) diff=7; target.setDate(base.getDate()+diff); break; } }
  let ora=null; const m=t.match(/(?:alle|ore)?\s*\b([01]?\d|2[0-3])(?:[:.](\d{2}))?\b/);
  if(m){ ora=m[1].padStart(2,'0')+':'+(m[2]||'00'); }
  return { date:!!target, giorno: target?lbl(target):null, dow: target?target.getDay():null, ora };
}

/* ============================ INTENT ROUTING =============================== */
function detectIntent(t){
  t=t.toLowerCase();
  if(t[0]==='/'){
    if(/^\/aiuto/.test(t)) return 'aiuto';
    if(/^\/organizza/.test(t)) return 'concierge';
    if(/^\/prenotazioni/.test(t)) return 'mie';
    if(/^\/prenota/.test(t)) return 'prenota';
    if(/^\/profilo/.test(t)) return 'profilo';
    if(/^\/amici/.test(t)) return 'amici';
    if(/^\/borsellino/.test(t)) return 'borsellino';
    if(/^\/menu/.test(t)) return 'saluto';
  }
  // AIUTO prima degli intenti operativi: "come invito un amico?" è una domanda.
  if(/\b(aiuto|help|guida)\b/.test(t)) return 'aiuto';
  if(/\bcome\s+(si\s+)?(funziona|fa|faccio|posso|uso|usa|prenot|invit|entr|apr|organizz|pag|dispon|complet)/.test(t)) return 'aiuto';
  if(/\bcosa\s+(puoi|sai|posso)\b/.test(t) || /a cosa serv|spiegami|spiega come|non ho capito|come si usa/.test(t)) return 'aiuto';
  if(/quanto costa|quanto si paga|che prezz|come si paga|serve un anticipo|serve un acconto/.test(t)) return 'aiuto';
  if(/^altro\b|^altre\b|\baltre funzioni\b|\baltre opzioni\b|\baltro men[uù]\b/.test(t)) return 'altro';
  if(/profil|i miei dati|chi sono/.test(t)) return 'profilo';
  if(/amic|con cui gioc|lista giocator/.test(t)) return 'amici';
  if(/borsell|saldo|credito|monedero|portafogl/.test(t)) return 'borsellino';
  if(/disponibil|liber|che campi|quali campi|posti/.test(t)) return 'disponibilita';
  if(/cosa ho|mie prenotaz|le mie|prenotazioni/.test(t)) return 'mie';
  if(/annull|disdet|cancell/.test(t)) return 'annulla';
  if(/modific|spost|cambia orario/.test(t)) return 'modifica';
  if(/organizz|fatemi la (squadra|partita)|trovate voi|pensateci voi|concierge/.test(t)) return 'concierge';
  if(/prenot|campo|partita|lezione|gioc/.test(t)) return 'prenota';
  if(/ciao|salve|buongiorno|buonasera|ehi|hey|menu/.test(t)) return 'saluto';
  return 'fallback';
}
function sendUser(text,silent){
  if(!silent) addOut(text);
  const t=text.trim(); if(!t) return;
  if(convo.mode==='cancel') return botSay(()=>cancelStep(t));
  if(convo.mode==='modify') return botSay(()=>modifyStep(t));
  botSay(()=>route(detectIntent(t),t));
}
function route(intent,t){
  switch(intent){
    case 'saluto': addInHtml('Ciao '+esc(S.player.nome.split(' ')[0])+', come possiamo aiutarti? Ecco cosa possiamo fare:'); showMenu(); break;
    case 'altro': addInHtml('Certo, ecco cos\'altro possiamo fare per te:'); showMenuAltro(); break;
    case 'profilo': doProfilo(); break;
    case 'amici': doAmici(); break;
    case 'borsellino': doBorsellino(); break;
    case 'disponibilita': doDisponibilita(t); break;
    case 'mie': doMie(); break;
    case 'aiuto': doHelp(t); break;
    case 'concierge': doConcierge(); break;
    case 'annulla': startCancel(); break;
    case 'modifica': startModify(); break;
    case 'prenota': startBooking(t); break;
    default: addInHtml('Scusa, non abbiamo capito bene. Ecco cosa possiamo fare:'); showMenu();
  }
}

function isGiaAmico(entry){ return S.friends.some(f=>normNum(f.numero)===normNum(entry.numero)); }
/* Ritorno al modulo "Completa la partita" dopo un'aggiunta al volo (se ctx.backTo). */
function backToRoster(ctx){ if(!ctx||!ctx.backTo) return null; return ()=>{ const rr=S.prenotazioni.find(x=>x.id===ctx.backTo); if(rr) openAddPlayersFlow(rr); else addQuick([homeBtn()]); }; }
/* Il giocatore ha condiviso un contatto → 3 rami secondo l'anagrafica. */
function shareContact(entry, ctx){
  const back=backToRoster(ctx);
  addOut('📇 '+entry.nome);                                    // il giocatore "invia" il contatto
  botSay(()=>{
    if(!entry.socio){ inviteToJoin(entry, back); return; }      // non in anagrafica → invito a iscriversi
    if(isGiaAmico(entry)){ addInHtml('👍 <b>'+esc(entry.nome)+'</b> è già tra i tuoi amici.'); if(back) addQuick([{label:'↩︎ Torna a completare',action:back},homeBtn()]); else addQuick([{label:'👥 I miei amici',text:'I miei amici'},homeBtn()]); return; }
    S.friends.push({id:++S.seq, nome:entry.nome, numero:entry.numero, suWhatsApp:entry.suWhatsApp}); save();
    addInHtml('✅ Ho aggiunto <b>'+esc(entry.nome)+'</b> ai tuoi amici.'
      +(entry.suWhatsApp?'':'<br>ℹ️ Non è ancora sul nostro canale: sarà invitabile a giocare appena ci avrà scritto.'),true);
    if(back) addQuick([{label:'↩︎ Torna a completare',action:back}]);
    else addQuick([{label:'🎾 Prenota',text:'Vorrei prenotare un campo'},{label:'👥 I miei amici',text:'I miei amici'},homeBtn()]);
  });
}
/* Ramo non-socio: NON possiamo scrivergli noi (niente opt-in → policy Meta). Diamo
   al giocatore un invito PRONTO da inoltrare lui; quando il nuovo giocatore ci scrive
   parte la sua iscrizione (definita nella sua futura chat, non qui). */
function inviteToJoin(entry, back){
  const nome1=entry.nome.split(' ')[0];
  addInHtml('🙂 <b>'+esc(entry.nome)+'</b> non è ancora iscritto a Padel Village, quindi non possiamo aggiungerlo tra gli amici.<br>Puoi invitarlo tu: gli inoltri l’invito e, appena ci scrive, lo iscriviamo.');
  const btns=[{label:'✉️ Invita '+nome1, action:()=>{ addOut('Invita '+nome1); botSay(()=>showJoinInvite(entry, back)); }}];
  btns.push(back ? {label:'↩︎ Torna a completare',action:back} : {label:'Lascia stare', action:()=>botSay(()=>addInHtml('Ok, nessun problema.'))});
  addQuick(btns);
}
function showJoinInvite(entry, back){
  const nome1=entry.nome.split(' ')[0];
  addSys('Inoltra questo messaggio a '+nome1+' 👇');
  addInHtml('🎾 <b>Padel Village</b>'
    +'<br>Un amico ti ha invitato a giocare una partita con lui!'
    +'<br>Per partecipare, iscriviti: scrivici su WhatsApp e ti inseriamo nella partita 👇'
    +'<br>https://wa.me/'+CLUB_WA+'?text=Ciao!%20Un%20amico%20mi%20ha%20invitato%20a%20giocare%2C%20vorrei%20iscrivermi');
  addQuick(back ? [{label:'↩︎ Torna a completare',action:back}] : [homeBtn()]);
}

/* ---------- Borsellino ----------------------------------------------------- */

/* ---------- Aiuto / come si usa (contestuale + guida) ---------------------- */
function doHelp(t){
  t=(t||'').toLowerCase();
  if(/invit|amic/.test(t)){
    addInHtml('<b>Invitare gli amici</b> 👥<br>Da “Completa la partita” selezioni i tuoi amici (soci): ricevono un messaggio con <b>✅ Confermo / ❌ Non posso</b> e, <b>appena confermano, entrano in partita</b>. Chi non è ancora sul nostro canale non è invitabile (prima deve scriverci). In partita solo giocatori iscritti — niente ospiti.');
    addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  if(/opzion|complet|scad/.test(t)){
    addInHtml('<b>Opzionato → prenotato</b> 🟠→✅<br>Quando prenoti, il campo è <b>opzionato</b> a tuo nome (gratis): hai un po’ di tempo per completare la partita. Appena siete al completo diventa <b>prenotato</b>. Se non completi in tempo, il campo torna automaticamente disponibile per altri giocatori.'); addQuick([homeBtn()]); return; }
  if(/cost|prezz|tariff|paga|anticip|accont|depos/.test(t)){
    addInHtml('<b>Prezzi</b> 💶<br>Ti diamo sempre il prezzo prima di confermare (a testa e a campo). In questa versione <b>non si paga in chat</b>: prenoti senza versare nulla in anticipo e saldi in circolo.');
    addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  if(/organizz|concierge/.test(t)){
    addInHtml('🧑‍💼 <b>Organizza la partita</b><br>Scegli quando giocare, ai giocatori pensiamo noi.<br>Ti chiediamo se la vuoi <b>mista</b> o <b>omogenea</b>.<br>'+FEE_LINE);
    addQuick([{label:'🧑‍💼 Organizzate voi',action:()=>botSay(doConcierge)}]); return; }
  if(/prenot|campo|dispon|gioc/.test(t)){
    addInHtml('<b>Prenotare</b> 🎾<br>Scegli giorno, momento e orario; opzioni il campo a tuo nome e completi la partita. Ti mostriamo sempre il prezzo.');
    addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  // guida generale (List Message)
  addInHtml('Ecco cosa posso fare per te — scrivimi con parole tue oppure tocca una voce 👇');
  showMenu();
}

/* ---------- Disponibilità (= vista giorni/orari nel modulo) ---------------- */

/* ---------- Le mie prenotazioni -------------------------------------------- */
function statoPren(p){
  if(p.stato==='prenotato') return '✅ Prenotato · partita al completo';
  if(p.concierge) return '🧑‍💼 In organizzazione dalla segreteria (+'+CONCIERGE_FEE+' €)'+(p.mix?(' · partita '+mixPhrase(p.mix)):'');   // esente da rilascio automatico
  const rem=(p.deadline||0)-Date.now();
  if(rem<=0) return '⚪️ Opzione scaduta · campo liberato';
  const win=p.win||rosterWindow(offsetForGiorno(p.giorno)||0).lbl;
  return '🟠 Opzionato · '+rosterFilled(p)+'/'+rosterTarget(p)+' confermati'+(rosterPending(p)?(' · in attesa: '+p.invitati.join(', ')):'')+' · completa entro '+win;
}
/* Le mie prenotazioni: LISTA (List Message ≤10) → tocca → DETTAGLIO con ≤3
   azioni. Pattern fedele a WhatsApp (niente valanga di reply-buttons). */
function doMie(){
  const list=S.prenotazioni;
  if(!list.length){ addInHtml('Al momento non hai prenotazioni future. Vuoi prenotare un campo?'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  addInHtml('Le tue prossime prenotazioni — tocca per i dettagli:');
  addMenu(list.slice(0,10).map(p=>({section:'Prenotazioni', ic:(p.stato==='prenotato'?'✅':'🟠'), label:p.giorno+' · '+p.ora+' — Campo '+p.campo, action:()=>botSay(()=>showBookingDetail(p.id))})));
}
function showBookingDetail(id){
  const p=S.prenotazioni.find(x=>x.id===id); if(!p){ addInHtml('Quella prenotazione non è più disponibile.'); return; }
  addCard('<b>'+esc(p.giorno)+' · '+p.ora+'</b> — Campo '+p.campo+' · '+p.tipo+(p.concierge?' · 🧑‍💼 concierge':'')
    +(p.amici&&p.amici.length?('<br>Con: '+p.amici.join(', ')):'')
    +(rosterPending(p)?('<br>✉️ In attesa: '+p.invitati.join(', ')):'')
    +'<br>'+statoPren(p));
  const btns=[];
  if(p.stato==='opzionato' && (p.deadline||0)-Date.now()>0){
    btns.push({label:'👥 Invito gli amici',action:()=>openAddPlayersFlow(p)});
    if(!p.concierge) btns.push({label:'🧑‍💼 Ci pensa la segreteria',action:()=>{ addOut('Ci pensa la segreteria'); botSay(()=>delegateConcierge(p)); }});
    btns.push({label:'🗑️ Annulla',action:()=>startCancelOne(p),danger:true});
  } else {
    btns.push({label:'✏️ Modifica orario',action:()=>startModifyOne(p)});
    btns.push({label:'🗑️ Annulla',action:()=>startCancelOne(p),danger:true});
  }
  addQuick(btns.slice(0,3));
}
/* Supplemento concierge in caso di disdetta: dovuto SOLO se la segreteria ha
   già organizzato la partita (stato 'prenotato' = completata). Finché è ancora
   'in organizzazione' (opzionato) non è dovuto nulla. Fedeltà WA: niente colore
   del testo → enfasi con emoji 💶 + grassetto. */
function conciergeCancelNote(p){
  if(p && p.concierge && p.stato==='prenotato')
    return '<br>💶 La segreteria ha <b>già completato</b> la partita: il supplemento di <b>'+CONCIERGE_FEE+' €</b> resta dovuto, in segreteria.';
  return '';
}
/* Annulla/Modifica su una prenotazione specifica (riusa cancelStep/modifyStep). */
function startCancelOne(p){
  convo={mode:'cancel',step:'confirm',draft:{target:p}};
  const warn = conciergeCancelNote(p);
  addInHtml('Vuoi annullare: '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+'? L’azione è definitiva: non perdi nulla, il campo torna disponibile per altri.'+warn);
  addQuick([{label:'Sì, annulla',text:'sì',danger:true},{label:'No',text:'no'}]);
}
function startModifyOne(p){
  convo={mode:'modify',step:'newtime',draft:{target:p}};
  addInHtml('A che nuovo orario sposto '+esc(p.giorno)+' · '+p.ora+'? (es. “alle 20:30”)');
}

/* ---------- Prenotazione: WhatsApp Flow (modulo) --------------------------- */
function startBooking(text){
  const w=parseWhen(text);
  if(w.date && w.ora){ return decideAndPresent({giorno:w.giorno,dow:w.dow,ora:w.ora,tipo:'Partita',durata:90,amici:[]}); }
  addInHtml('Ti apriamo il modulo — scegli un giorno e tocca un orario libero. 👇');
  openBookingFlow({giorno:w.giorno,ora:w.ora});
}
/* Concierge: la segreteria organizza la partita per te (+5 € sulla quota di chi prenota per primo, in segreteria). */
function doConcierge(){
  if(blockIfActiveOption()) return;
  addInHtml('Ci pensiamo noi 🧑‍💼<br>Scegli quando vuoi giocare, ai giocatori pensiamo noi.<br>'+FEE_LINE+' 👇');
  openBookingFlow({concierge:true});
}
function openBookingFlow(prefill){
  prefill=prefill||{};
  if(blockIfActiveOption()) return;                        // 1 sola opzione attiva per volta
  const concierge=!!prefill.concierge;
  const days=[]; for(let o=0;o<=MAX_GIORNI;o++) days.push(dayInfo(o));
  const st={ off:0, ora:null, momento:null, tipo:'Partita', players:4, durata:90, amici:(prefill.amici||[]).slice(), concierge:concierge };
  if(prefill.giorno){ const m=days.filter(d=>d.giorno===prefill.giorno)[0]; if(m) st.off=m.off; }
  else{ for(let i=0;i<days.length;i++){ if(availSlots(days[i].off,days[i].dow)>0){ st.off=days[i].off; break; } } }
  const body=el('flow');
  if(concierge){ body.appendChild(el('luce-hint','🧑‍💼 <b>Organizza la partita</b><br>Scegli quando vuoi giocare, ai giocatori pensiamo noi.<br>'+FEE_LINE)); }
  // Passo 1: quando (prossimi 7 giorni con conteggio slot disponibili)
  body.appendChild(fieldLabel('Quando'));
  const dayRow=el('days'); body.appendChild(dayRow);
  // Passo 2: momento (Mattina/Pomeriggio/Sera) → mostra pochi orari per volta
  const momLabel=fieldLabel('Momento'); body.appendChild(momLabel);
  const momBox=el('chips'); body.appendChild(momBox);
  // Passo 3: gli orari del momento scelto (chips = ChipsSelector nativo)
  const slotBox=el('slotbox'); body.appendChild(slotBox);
  body.appendChild(el('flow-legend','<span><i class="dot free"></i>Libero</span>'));
  // Partita sempre 90' in 4 (niente selettore "in quanti giocate").
  // FASE 1 = SOLO giorno/momento/orario (una scelta per volta). Invita amici e
  // "ci pensate voi" sono la FASE 2, DOPO l'opzione: prima ti assicuri il campo,
  // poi decidi come completare la partita (vedi rosterActionButtons).
  const sum=el('flow-sum');   // riepilogo selezione
  body.appendChild(sum);
  const foot=document.createElement('button'); foot.className='flow-submit'; foot.textContent=concierge?'Richiedi organizzazione':'Continua';
  foot.onclick=()=>{
    if(!st.ora){ toast('Tocca prima un orario libero.'); return; }
    const d=days[st.off];
    const meta=slotMetaFor(d.off,d.dow,st.ora,st.durata,st.players);
    const dur=90, players=4;   // partita sempre 90' in 4
    closeSheet();
    const names=st.amici.map(friendName).filter(Boolean);
    const pr=slotPrezzo(meta,players);
    if(concierge){ addOut('🧑‍💼 Organizzate voi · '+d.giorno+' · '+st.ora+" ("+dur+"')");
      botSay(()=>decideConcierge({giorno:d.giorno,dow:d.dow,ora:st.ora,tipo:st.tipo,durata:dur,players:players})); return; }
    addOut('📋 '+d.giorno+' · '+st.ora+' · in '+players+" ("+dur+"') · "+pr.testa+'€/testa'+(names.length?(' · con '+names.join(', ')):''));
    botSay(()=>decideAndPresent({giorno:d.giorno,dow:d.dow,ora:st.ora,tipo:st.tipo,durata:dur,amici:st.amici.slice(),players:players}));
  };
  body.appendChild(foot);

  function renderDays(){
    dayRow.innerHTML='';
    days.forEach(d=>{
      const c=availSlots(d.off,d.dow);
      const b=document.createElement('button'); b.type='button'; b.className='day'+(d.off===st.off?' sel':'');
      b.innerHTML='<b>'+d.w+'</b><span>'+d.n+'</span><small class="'+(c?'ok':'no')+'">'+(c?c+' liberi':'pieno')+'</small>';
      b.onclick=()=>{ st.off=d.off; st.ora=null; st.momento=null; renderDays(); renderMomenti(); renderSlots(); updSum(); };
      dayRow.appendChild(b);
    });
  }
  function renderMomenti(){
    momBox.innerHTML='';
    const flat=daySlotsFlat(days[st.off].off,days[st.off].dow,st.durata,st.players).filter(s=>s.status!=='busy');
    const avail=MOMENTI.filter(mm=>flat.some(s=>momentoKey(s.ora)===mm.key));
    if(!avail.some(m=>m.key===st.momento)) st.momento=avail.length?avail[0].key:null;
    momLabel.style.display=avail.length?'':'none';
    avail.forEach(mm=>{
      const n=flat.filter(s=>momentoKey(s.ora)===mm.key).length;
      const b=document.createElement('button'); b.type='button';
      b.className='chip'+(st.momento===mm.key?' sel':'');
      b.textContent=mm.label+' ('+n+')';
      b.onclick=()=>{ st.momento=mm.key; st.ora=null; renderMomenti(); renderSlots(); updSum(); };
      momBox.appendChild(b);
    });
  }
  function renderSlots(){
    slotBox.innerHTML='';
    const d=days[st.off];
    if(!st.momento){ slotBox.appendChild(el('slot-empty','Nessun orario disponibile in questo giorno.')); return; }
    const flat=daySlotsFlat(d.off,d.dow,st.durata,st.players).filter(s=>s.status!=='busy'&&momentoKey(s.ora)===st.momento);
    if(!flat.length){ slotBox.appendChild(el('slot-empty','Nessun orario in questa fascia.')); return; }
    const uniform=flat.length && flat.every(s=>s.prezzo===flat[0].prezzo), first=flat[0];
    if(uniform){ const hdr=el('slot-fascia'); hdr.textContent=first.prezzo+'€ a testa'; slotBox.appendChild(hdr); }
    const row=el('chips');
    flat.forEach(s=>{
      const b=document.createElement('button'); b.type='button';
      b.className='chip'+(st.ora===s.ora?' sel':'');
      b.textContent=uniform?s.ora:(s.ora+' · '+s.prezzo+'€');
      b.onclick=()=>{ st.ora=s.ora; renderSlots(); updSum(); };
      row.appendChild(b);
    });
    slotBox.appendChild(row);
  }
  function updSum(){
    const d=days[st.off];
    if(!st.ora){ sum.className='flow-sum'; sum.textContent='Nessun orario selezionato'; return; }
    const meta=slotMetaFor(d.off,d.dow,st.ora,st.durata,st.players);
    const dur=meta ? (meta.kind==='fisso'?90:st.durata) : st.durata;
    const players=meta&&meta.kind==='fisso'?4:st.players;
    const pr=slotPrezzo(meta,players);
    const win=rosterWindow(d.off);
    const target=pr.giocatori, inviti=st.amici.length;
    sum.className='flow-sum on';
    sum.innerHTML='📅 <b>'+esc(d.giorno)+' · '+st.ora+'–'+addMin(st.ora,dur)+'</b>'
      +(st.concierge
        ? ('<br>💶 <b>'+pr.testa+' € a testa</b> · '+pr.campo+' € a campo'
          +'<br>🧑‍💼 '+FEE_LINE)
        : ('<br>💶 <b>'+pr.testa+' € a testa</b> · '+pr.campo+' € a campo'
          +'<br>👥 1/'+target+' (tu)'+(inviti?(' · ✉️ '+inviti+' invit'+(inviti>1?'i':'o')):'')
          +'<br>⚠️ Completa entro <b>'+win.lbl.toUpperCase()+'</b>, poi torna libero per altri'));
  }
  openSheet('Prenota un campo', body, 'Scegli giorno, momento e orario');
  renderDays(); renderMomenti(); renderSlots();
  if(prefill.ora){
    const d=days[st.off]; const meta=slotMetaFor(d.off,d.dow,prefill.ora,st.durata,st.players);
    if(meta && meta.status!=='busy'){ st.momento=momentoKey(prefill.ora); st.ora=prefill.ora; renderMomenti(); renderSlots(); }
  }
  updSum();
}

function decideAndPresent(draft){
  if(blockIfActiveOption()) return;
  // Coerenza con la vista disponibilità: se l'orario chiesto a parole è
  // OCCUPATO, apri il modulo con gli orari disponibili.
  const off=offsetForGiorno(draft.giorno);
  const draftMeta = off!=null ? slotMetaFor(off,draft.dow,draft.ora,draft.durata,draft.players) : null;
  if(draftMeta && draftMeta.status==='busy'){
    addInHtml('A quell\'ora è tutto occupato. Ti apriamo il modulo con gli orari disponibili. 👇');
    openBookingFlow({giorno:draft.giorno,durata:draft.durata,amici:draft.amici});
    return;
  }
  const campo=campoLibero(draft.dow,draft.ora); const fine=addMin(draft.ora,draft.durata);
  const pr=slotPrezzo(draftMeta,draft.players);
  const target=pr.giocatori;
  const names=(draft.amici||[]).map(friendName).filter(Boolean);   // amici scelti = da INVITARE
  const win=rosterWindow(off||0);
  draft.campo=campo; draft.fine=fine; draft.target=target; draft.names=names;
  addInHtml('Campo disponibile ✅<br>Te lo <b>opzioniamo</b> a tuo nome'+(names.length?(', invito a '+names.join(', ')):'')+'.');
  addCard('<b>RIEPILOGO</b>'
    +'<br>📅 '+esc(draft.giorno)+' · '+draft.ora+'–'+fine
    +'<br>📍 Campo '+campo+' · '+draft.tipo+' ('+draft.durata+"')"
    +'<br>💶 <b>'+pr.testa+' € a testa</b> · '+pr.campo+' € a campo'
    +'<br>👥 1/'+target+' (tu)'+(names.length?(' · ✉️ invito a '+names.join(', ')):'')
    +'<br>⚠️ Completa entro <b>'+win.lbl.toUpperCase()+'</b>, poi il campo torna libero per altri');
  addQuick([
    {label:'Procedi',action:()=>{ addOut('Procedi'); botSay(()=>commitOpzione(draft)); }},   // ≤20 char (limite titolo reply-button WhatsApp); poi le 3 scelte per completare
    {label:'Cambia',action:()=>botSay(()=>{ addInHtml('Riapriamo il modulo.'); openBookingFlow(draft); })}
  ]);
}
/* Crea l'OPZIONE (gratis) col solo organizzatore confermato; gli amici scelti
   ricevono un INVITO (il posto si riempie solo quando accettano). */
function commitOpzione(draft){
  const off=offsetForGiorno(draft.giorno);
  const target=draft.target||4;
  const invited=(draft.names||(draft.amici||[]).map(friendName).filter(Boolean)).slice(0,target-1);
  const rec={id:++S.seq,giorno:draft.giorno,ora:draft.ora,campo:draft.campo,tipo:draft.tipo,durata:draft.durata,
    target:target, amici:[], invitati:invited.slice(), stato:'opzionato',
    deadline:optDeadlineMs(off||0,draft.ora), win:rosterWindow(off||0).lbl};
  S.prenotazioni.push(rec); save();
  const posti=target-1;
  addInHtml('🟠 <b>Campo opzionato</b> a tuo nome'
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora+'–'+draft.fine+' · Campo '+rec.campo
    +'<br>👥 Sei <b>1/'+target+'</b> · '+(posti>1?'mancano '+posti:'manca 1')+' · hai <b>'+rec.win+'</b> per completare'
    +'<br><b>Come vuoi completarla?</b> 👇',true);
  rosterActionButtons(rec);
  if(invited.length) sendInvites(rec, invited);
  scheduleRosterReminders(rec, off||0);
}
/* FASE 2 — come completare la partita (dopo l'opzione). LIST MESSAGE WhatsApp:
   ogni riga = titolo (≤24 char) + descrizione (≤72 char), così ogni scelta si
   spiega da sola (i reply-button non hanno descrizione). Se è delegata alla
   segreteria non servono azioni sui posti.
   Annulla/aspetta = da "Le mie prenotazioni". */
function rosterActionButtons(rec){
  if(rec.concierge){ addQuick([{label:'📅 Le mie prenotazioni',action:()=>botSay(doMie)}]); return; }
  const rows=[{section:'Completa la partita', ic:'👥', label:'Invito i miei amici', desc:'Scegli tu con chi giocare', action:()=>openAddPlayersFlow(rec)}];
  rows.push({ic:'🧑‍💼', label:'Ci pensa la segreteria', desc:'Troviamo noi i giocatori · +'+CONCIERGE_FEE+' € solo sulla tua quota', action:()=>{ addOut('Ci pensa la segreteria'); botSay(()=>delegateConcierge(rec)); }});
  addMenu(rows.slice(0,10));
}
/* Ramo "Ci pensate voi": delega alla segreteria un'opzione già presa (+5 € sulla quota di chi prenota per primo). */
/* ---------- Preferenza partita: MISTA o OMOGENEA (solo concierge) -----------
   Quando organizza la SEGRETERIA le chiediamo se vuole una partita mista
   (uomini e donne) o omogenea (stesso genere di chi prenota). La domanda si
   adatta al genere del richiedente (dato reale = anagrafica socio). */
function isDonna(){ return String(S.player.genere||'M').toUpperCase()==='F'; }
function omogeneaLbl(){ return isDonna() ? 'Solo donne' : 'Solo uomini'; }               // ≤20 char (titolo reply-button)
function mixPhrase(mix){ return mix==='mista' ? 'mista' : (isDonna() ? 'tra sole donne' : 'tra soli uomini'); }
function fillerNames(mix, n){
  const uomini=['Andrea T.','Giulio S.','Marco V.','Luca P.'];
  const donne =['Marta P.','Elena R.','Sara L.','Chiara B.'];
  const misti =['Andrea T.','Marta P.','Giulio S.','Elena R.'];
  const pool = mix==='omogenea' ? (isDonna()?donne:uomini) : misti;
  return pool.slice(0, n);
}
/* Chiede mista/omogenea, poi chiama done(mix). 2 reply-button (fedele WA). */
function askMatchMix(done){
  addInHtml('Perfetto. Un\'ultima cosa: preferisci una partita <b>mista</b> (uomini e donne) o <b>omogenea</b> ('+(isDonna()?'sole donne':'soli uomini')+')?');
  addQuick([
    {label:'👫 Mista',action:()=>{ addOut('Mista'); botSay(()=>done('mista')); }},
    {label:(isDonna()?'👩 ':'👨 ')+omogeneaLbl(),action:()=>{ addOut(omogeneaLbl()); botSay(()=>done('omogenea')); }}
  ]);
}
function delegateConcierge(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  if(r.stato==='prenotato'){ addInHtml('Questa partita è già al completo 🎾 — non serve la segreteria.'); return; }
  if(r.concierge){ addInHtml('Ci stiamo già pensando noi 🧑‍💼 — ti avvisiamo qui appena la partita è al completo.'); return; }
  addInHtml('Ci pensiamo noi 🧑‍💼<br>Completiamo la partita di <b>'+esc(r.giorno)+' · '+r.ora+'</b> cercando altri giocatori.<br>'+FEE_LINE+'<br><b>Confermi?</b>');
  addQuick([
    {label:'✅ Sì, ci pensate voi',action:()=>{ addOut('Sì, ci pensate voi'); botSay(()=>askMatchMix(mix=>commitDelegate(r,mix))); }},
    {label:'Torna indietro',action:()=>botSay(()=>rosterActionButtons(r))}
  ]);
}
function commitDelegate(r,mix){
  let rr=S.prenotazioni.find(x=>x.id===r.id);
  if(rr && rr.stato==='prenotato'){ addInHtml('Questa partita è già al completo 🎾 — non serve la segreteria.'); return; }
  // Se nel frattempo l'opzione è scaduta (nella demo il timer di rilascio è
  // accelerato), la RI-OPZIONIAMO: delegare = garanzia della segreteria, il
  // campo va ri-tenuto. Nel prodotto reale la finestra è di ore → non capita.
  if(!rr){
    const off=offsetForGiorno(r.giorno);
    rr={id:++S.seq,giorno:r.giorno,ora:r.ora,campo:r.campo,tipo:r.tipo||'Partita',durata:r.durata||90,
      target:r.target||4, amici:[], stato:'opzionato', deadline:optDeadlineMs(off||0,r.ora), win:rosterWindow(off||0).lbl};
    S.prenotazioni.push(rr);
  }
  rr.concierge=true; rr.mix=mix; save();
  addInHtml('🧑‍💼 <b>Ci pensiamo noi!</b>'
    +'<br>📅 '+esc(rr.giorno)+' · '+rr.ora+' · partita '+mixPhrase(mix)
    +'<br>Cerchiamo i giocatori e <b>ti avvisiamo appena è al completo</b>.'
    +'<br>'+FEE_LINE,true);
  setTimeout(()=>{ const x=S.prenotazioni.find(p=>p.id===rr.id); if(!x||x.stato!=='opzionato') return;
    botSay(()=>{ const nomi=fillerNames(x.mix, rosterPosti(x)); x.amici=(x.amici||[]).concat(nomi); save();
      confirmBooking(x,'🧑‍💼 Partita completata dalla segreteria · +'+CONCIERGE_FEE+' € in segreteria'); }); }, 6000);
}
/* Partita al completo → prenotazione confermata. */
function confirmBooking(rec,extra){
  rec.stato='prenotato'; delete rec.deadline; save();
  addInHtml('✅ <b>Prenotazione confermata!</b>'
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora
    +'<br>📍 Campo '+rec.campo+' · in '+rosterTarget(rec)
    +(rec.amici&&rec.amici.length?('<br>👥 '+rec.amici.join(', ')):'')
    +(extra?('<br>'+extra):''),true);
  maybeHint(); addQuick([homeBtn()]);
}
/* DISATTIVATO nella demo (vedi scheduleRosterReminders): niente auto-rilascio
   né messaggio "Tempo scaduto" durante il walkthrough. No-op a prova di tutto. */
function expireOption(rec){ /* disattivato in demo */ }
/* Modulo "completa la partita": INVITA amici SOCI (modello B — il posto si riempie
   SOLO quando l'amico CONFERMA). Su WhatsApp reale ogni invito è un TEMPLATE utility
   con 2 bottoni ✅ Confermo / ❌ Non posso (l'amico è fuori dalla finestra 24h). Amici
   non sul canale (no opt-in) = voce disabilitata: non possiamo scrivergli (→ iscrizione).
   NIENTE "Ospite": in partita solo giocatori veri e identificati (tutela del circolo).
   "➕ Aggiungi un amico" = condividi un contatto al volo, poi torni qui a invitarlo. */
function openAddPlayersFlow(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  const posti=rosterPosti(r);
  if(posti===0){ addInHtml('La partita è già al completo.'); return; }
  const taken=(r.amici||[]).concat(r.invitati||[]);
  const avail=S.friends.filter(f=>taken.indexOf(f.nome.split(' ')[0])<0);
  const body=el('flow');
  body.appendChild(el('luce-hint','Manca'+(posti>1?'no':'')+' <b>'+posti+'</b> giocator'+(posti>1?'i':'e')+' per '+esc(r.giorno)+' alle '+r.ora+'. Invita i tuoi amici: ricevono <b>✅ Confermo / ❌ Non posso</b> e il posto si riempie quando confermano.'));
  body.appendChild(fieldLabel('Invita amici'));
  const picked=[];
  const fl=el('friend-list');
  if(!avail.length){ fl.appendChild(el('luce-hint','Nessun amico da invitare al momento — aggiungine uno qui sotto.')); }
  avail.forEach(f=>{ const nm=f.nome.split(' ')[0]; const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox';
    if(!f.suWhatsApp){ cb.disabled=true; row.style.opacity='.5'; }
    cb.onchange=()=>{ if(cb.checked) picked.push(nm); else { const i=picked.indexOf(nm); if(i>=0) picked.splice(i,1);} };
    const sp=document.createElement('span'); sp.innerHTML=esc(f.nome)+(f.suWhatsApp?'':' · <i>non ancora sul canale</i>'); row.appendChild(cb); row.appendChild(sp); fl.appendChild(row); });
  body.appendChild(fl);
  const addF=document.createElement('button'); addF.textContent='➕ Aggiungi un amico';
  addF.style.cssText='display:block;width:100%;margin:8px 0 2px;padding:10px;background:transparent;border:1px dashed #bcd;border-radius:10px;color:#128c4b;font-size:14px;font-weight:600;cursor:pointer';
  addF.onclick=()=>{ closeSheet(); openAddFriendFlow({backTo:r.id}); };
  body.appendChild(addF);
  const b=document.createElement('button'); b.className='flow-submit'; b.textContent='Invita';
  b.onclick=()=>{
    const invites=picked.slice();
    if(!invites.length){ toast('Seleziona almeno un amico da invitare.'); return; }
    const iUse=invites.slice(0,posti);
    closeSheet();
    botSay(()=>{ const rr=S.prenotazioni.find(x=>x.id===r.id); if(!rr){ addInHtml('Prenotazione non più disponibile.'); return; }
      rr.invitati=(rr.invitati||[]).concat(iUse); save();
      addInHtml('📨 Invito inviato a <b>'+iUse.join(', ')+'</b>.<br>👥 Sei a <b>'+rosterFilled(rr)+'/'+rosterTarget(rr)+'</b> · in attesa: '+rr.invitati.join(', '),true);
      rosterActionButtons(rr);
      sendInvites(rr, iUse); });
  };
  body.appendChild(b);
  openSheet('Completa la partita', body, r.giorno+' · '+r.ora);
}
/* Promemoria "completa la partita" — bilanciato: metà + ultima chiamata
   (nella finestra 1h solo l'ultima). Demo: tempi scalati a pochi secondi.
   Su WhatsApp vero sono GRATIS perché dentro la finestra 24h. */
function scheduleRosterReminders(rec, off){
  /* DISATTIVATO nella demo: la raffica di promemoria + "tempo scaduto"
     interrompeva il walkthrough (l'opzione scadeva mentre navighi). Il concetto
     "se non completi la partita il campo torna disponibile" resta nella copy del
     RIEPILOGO e in statoPren; l'auto-rilascio è una regola del prodotto (finestra
     di ore reali), qui NON simulata a tempo. expireOption/rosterReminderMsg
     restano definite ma non più chiamate automaticamente. */
}
/* DISATTIVATO nella demo (vedi scheduleRosterReminders): niente "Ultima chiamata"
   / "Promemoria" che interrompono il giro. No-op a prova di tutto. */
function rosterReminderMsg(r,kind){ /* disattivato in demo */ }
/* Invito amici — WhatsApp reale: a ciascun amico un TEMPLATE utility con 2 bottoni
   ✅ Confermo / ❌ Non posso (l'amico è fuori dalla finestra 24h → serve il template;
   al tap del bottone si apre la SUA finestra 24h). Qui simulato. Modello B: il posto
   si riempie SOLO quando l'amico CONFERMA. */
function sendInvites(rec, names){
  addSys('📨 Inviato l’invito a '+names.join(', ')+' (messaggio con ✅ Confermo / ❌ Non posso) — ti avviso appena rispondono.');
  names.forEach((nm,i)=>{
    setTimeout(()=>{ const r=S.prenotazioni.find(x=>x.id===rec.id); if(!r||r.stato!=='opzionato') return;
      if((r.invitati||[]).indexOf(nm)<0) return;   // invito già risolto/annullato
      botSay(()=>inviteResponse(r,nm)); }, 4000+i*3000);
  });
}
function inviteResponse(r,nm){
  const declina=/Paolo/.test(nm);                  // demo: Paolo rifiuta, per mostrare il ramo
  r.invitati=(r.invitati||[]).filter(x=>x!==nm);
  if(declina){ save(); addInHtml('❌ <b>'+esc(nm)+'</b> non può per '+esc(r.giorno)+' alle '+r.ora+'. Invita qualcun altro.'); rosterActionButtons(r); return; }
  r.amici=(r.amici||[]).concat(nm); save();
  if(rosterPosti(r)===0){ confirmBooking(r); return; }
  addInHtml('✅ <b>'+esc(nm)+'</b> ha confermato! Ora siete <b>'+rosterFilled(r)+'/'+rosterTarget(r)+'</b>'+(rosterPending(r)?(' · in attesa: '+r.invitati.join(', ')):' · manca'+(rosterPosti(r)>1?'no':'')+' '+rosterPosti(r))+'.',true);
  rosterActionButtons(r);
}
/* Concierge: la segreteria organizza la partita (+5 € sulla quota di chi prenota per primo, in segreteria). */
function decideConcierge(draft){
  if(blockIfActiveOption()) return;
  const off=offsetForGiorno(draft.giorno); const fine=addMin(draft.ora,draft.durata);
  const meta=off!=null?slotMetaFor(off,draft.dow,draft.ora,draft.durata,draft.players):null;
  if(meta && meta.status==='busy'){ addInHtml('A quell\'ora è tutto occupato. Scegli un altro orario. 👇'); openBookingFlow({concierge:true,giorno:draft.giorno}); return; }
  const pr=slotPrezzo(meta,draft.players); const campo=campoLibero(draft.dow,draft.ora);
  draft.campo=campo; draft.fine=fine; draft.target=pr.giocatori;
  addInHtml('Ci pensiamo noi 💪 Ecco il riepilogo:');
  addCard('🧑‍💼 <b>Organizza la partita</b>'
    +'<br>📅 '+esc(draft.giorno)+' · '+draft.ora+'–'+fine
    +'<br>📍 Campo '+campo+' · Partita ('+draft.durata+"')"
    +'<br>💶 <b>'+pr.testa+' € a testa</b> · '+pr.campo+' € a campo'
    +'<br>👥 Ai giocatori pensiamo noi'
    +'<br>'+FEE_LINE);
  addQuick([
    {label:'✅ Sì, organizzate voi',action:()=>{ addOut('Sì, organizzate voi'); botSay(()=>askMatchMix(mix=>commitConcierge(draft,mix))); }},
    {label:'Annulla',action:()=>botSay(()=>addInHtml('Nessun problema, richiesta annullata.'))}
  ]);
}
function commitConcierge(draft,mix){
  const off=offsetForGiorno(draft.giorno);
  const rec={id:++S.seq,giorno:draft.giorno,ora:draft.ora,campo:draft.campo,tipo:draft.tipo,durata:draft.durata,
    target:draft.target||4, amici:[], concierge:true, mix:mix, stato:'opzionato', deadline:optDeadlineMs(off||0,draft.ora), win:rosterWindow(off||0).lbl};
  S.prenotazioni.push(rec); save();
  addInHtml('🧑‍💼 <b>Richiesta ricevuta!</b>'
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora+' · partita '+mixPhrase(mix)
    +'<br>Campo opzionato a tuo nome. Cerchiamo i giocatori e <b>ti avvisiamo appena è al completo</b>.'
    +'<br>'+FEE_LINE,true);
  setTimeout(()=>{ const r=S.prenotazioni.find(x=>x.id===rec.id); if(!r||r.stato!=='opzionato') return;
    botSay(()=>{ const nomi=fillerNames(r.mix, rosterPosti(r)); r.amici=(r.amici||[]).concat(nomi); save();
      confirmBooking(r,'🧑‍💼 Partita completata dalla segreteria · +'+CONCIERGE_FEE+' € in segreteria'); });
  }, 6000);
}

/* ---------- Annulla / Modifica --------------------------------------------- */
function startCancel(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da annullare.'); return; }
  convo={mode:'cancel',step:'pick',draft:{}};
  addInHtml('Quale vuoi annullare?');
  addQuick(S.prenotazioni.map(p=>({label:p.giorno+' · '+p.ora+' — Campo '+p.campo, text:'annulla '+p.id})));
}
function cancelStep(t){
  const d=convo.draft;
  if(convo.step==='pick'){ const p=matchPren(t); if(!p){ addInHtml('Non ho individuato la prenotazione. Riprova indicando il giorno.'); return; }
    d.target=p; convo.step='confirm';
    const warn = conciergeCancelNote(p);
    addInHtml('Vuoi annullare: '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+' · '+p.tipo+'? L’azione è definitiva: non perdi nulla, il campo torna disponibile per altri.'+warn);
    addQuick([{label:'Sì, annulla',text:'sì',danger:true},{label:'No',text:'no'}]); return; }
  if(convo.step==='confirm'){
    if(/^s[iì]|conferm|annulla/.test(t.toLowerCase())){ const p=d.target; S.prenotazioni=S.prenotazioni.filter(x=>x.id!==p.id); save();
      addInHtml('Fatto. Campo '+p.campo+' di '+esc(p.giorno)+' alle '+p.ora+' liberato. Non hai perso nulla.',true); maybeHint(); addQuick([homeBtn()]); }
    else addInHtml('Ok, non annullo nulla.');
    resetConvo();
  }
}
function startModify(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da modificare.'); return; }
  convo={mode:'modify',step:'pick',draft:{}};
  addInHtml('Quale prenotazione vuoi modificare?');
  addQuick(S.prenotazioni.map(p=>({label:p.giorno+' · '+p.ora+' — Campo '+p.campo, text:'modifica '+p.id})));
}
function modifyStep(t){
  const d=convo.draft;
  if(convo.step==='pick'){ const p=matchPren(t); if(!p){ addInHtml('Non ho individuato la prenotazione.'); return; }
    d.target=p; convo.step='newtime'; addInHtml('A che nuovo orario la sposto? (es. “alle 20:30”)'); return; }
  if(convo.step==='newtime'){ const w=parseWhen(t); if(!w.ora){ addInHtml('Dimmi il nuovo orario, es. “alle 20:30”.'); return; }
    const idx=S.prenotazioni.findIndex(x=>x.id===d.target.id); const rec=S.prenotazioni[idx]; const old=rec.ora;
    if(w.giorno) rec.giorno=w.giorno; rec.ora=w.ora;
    // Se ancora OPZIONATA (non delegata), la finestra di rilascio dipende dalla
    // distanza dal giorno → va ricalcolata e i timer riarmati; gen++ rende inerti i vecchi.
    let extra='';
    if(rec.stato==='opzionato' && !rec.concierge){
      const noff=offsetForGiorno(rec.giorno)||0;
      rec.gen=(rec.gen||0)+1; rec.deadline=optDeadlineMs(noff,rec.ora); rec.win=rosterWindow(noff).lbl;
      save(); scheduleRosterReminders(rec, noff);
      extra=' Hai <b>'+rec.win+'</b> per completare la partita, altrimenti il campo torna disponibile per altri.';
    } else save();
    addInHtml('Aggiornata. '+esc(rec.giorno)+' — Campo '+rec.campo+' ora alle '+w.ora+' (prima '+old+').'+extra,true);
    maybeHint(); addQuick([homeBtn()]);
    resetConvo();
  }
}
function matchPren(t){
  t=t.toLowerCase(); const byId=t.match(/\b(\d{1,4})\b/); if(byId){ const p=S.prenotazioni.find(x=>x.id===parseInt(byId[1],10)); if(p) return p; }
  if(/sabato|sab/.test(t)) return S.prenotazioni.find(p=>/sab/i.test(p.giorno));
  if(/marted|mar/.test(t)) return S.prenotazioni.find(p=>/mar/i.test(p.giorno));
  return S.prenotazioni[0];
}

/* ============================ BOOTSTRAP =================================== */
function boot(){
  chat.innerHTML=''; closeSheet(); resetConvo();
  document.getElementById('band').textContent='✓ Numero riconosciuto: '+S.player.nome+' · '+(S.player.socio?'socio':'non socio');
  { const bt=document.getElementById('buildTag'); if(bt) bt.textContent=APP_BUILD; }
  try{ console.log('Emulatore Padel Village — build', APP_BUILD); }catch(e){}
  hideCmdPop(); _hintN=0;
  addSys('Suggerimento: digita "/" per i comandi rapidi in ogni momento');
  botSay(()=>{ addInHtml('Ciao '+esc(S.player.nome.split(' ')[0])+', hai contattato la segreteria di Padel Village. Come possiamo aiutarti? Tocca un\'opzione qui sotto o scrivici pure.'); showIceBreakers(); },500);
}
document.getElementById('bar').addEventListener('submit',e=>{ e.preventDefault(); const f=document.getElementById('field'); const v=f.value.trim(); hideCmdPop(); if(!v) return; f.value=''; sendUser(v); });
field.addEventListener('input',()=>{ const v=field.value; if(v.charAt(0)==='/') showCmdPop(v.trim()); else hideCmdPop(); });
document.getElementById('resetBtn').addEventListener('click',()=>{ resetDemo(); boot(); });
document.getElementById('emojiBtn').addEventListener('click',()=>toast('Solo demo 🙂'));
document.getElementById('clipBtn').addEventListener('click',()=>toast('Allegati: solo demo'));
boot();
</script>
