<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Anti-cache: chiediamo al browser di non tenere in cache questa pagina (evita di
     mostrare una versione vecchia col telefono, es. promemoria già rimossi). Difesa
     debole (i meta non ripuliscono una copia GIÀ in cache) → vedi freshnessGuard nel JS. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Emulatore chat giocatori — Padel Village</title>
<style>
  :root{--ink:#111b21;--muted:#667781;--wa-green:#128C7E;--wa-bg:#ECE5DD}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0b141a;color:var(--ink);display:flex;justify-content:center}
  .app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;background:var(--wa-bg);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:520px){
    body{align-items:center;background:#111b21}
    .app{height:92vh;max-height:900px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  }
  /* Header */
  .head{background:var(--wa-green);display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;flex:0 0 auto;z-index:5}
  .head .back{font-size:20px;line-height:1;opacity:.9}
  .av{width:36px;height:36px;border-radius:50%;background:#0c5f57;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .hname{font-size:15px;font-weight:600;line-height:1.15}
  .hstatus{font-size:11px;opacity:.85}
  .head .spacer{flex:1}
  .head .reset{font-size:12px;background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 9px;border-radius:14px;cursor:pointer}
  /* (Banda identità rimossa: un business NON può ancorare una barra fissa in cima
     alla chat su WhatsApp. Il riconoscimento è implicito nel saluto per nome; lo
     stato "prenotazioni sospese" viene comunicato come MESSAGGIO — vedi boot.) */
  /* Chat */
  .chat{flex:1 1 auto;overflow-y:auto;padding:12px 10px 14px;display:flex;flex-direction:column;gap:8px}
  .sys{align-self:center;background:#d6e7d2;color:#3a5a40;font-size:11px;padding:4px 12px;border-radius:10px;text-align:center;max-width:92%}
  .in,.out{max-width:82%;padding:7px 10px 5px;border-radius:9px;font-size:14px;line-height:1.44;position:relative;white-space:pre-wrap;word-wrap:break-word}
  .in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
  .out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
  .meta{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:3px}
  .tick{color:#34b7f1}
  /* Bolla "card" = come un normale messaggio in entrata (nessun bordo colorato:
     le bolle WhatsApp non hanno bordi/accenti di colore — fedeltà). */
  .card{background:#fff;align-self:flex-start;max-width:86%;border-radius:9px;border-top-left-radius:2px;padding:9px 11px;
    font-size:13.5px;line-height:1.6}
  /* Reply buttons (stile WhatsApp) */
  .qr{align-self:flex-start;width:min(86%,320px);background:#fff;border-radius:9px;overflow:hidden;margin-top:-2px;
    box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;flex-direction:column;flex:0 0 auto}
  .qbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:14px;color:#027eb5;
    border-top:1px solid #eff2f3;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:inherit;
    outline:none;-webkit-tap-highlight-color:transparent;text-transform:uppercase}   /* MAIUSCOLO = enfasi ammessa WA (etichetta inviata in maiuscolo, len invariata) */
  .qbtn:focus,.qbtn:focus-visible{outline:none}
  .qr .qbtn:first-child{border-top:0}
  .qbtn.danger{color:#c0392b}
  .qbtn:active{background:#f2f5f6}
  /* Reply-button "spesi": dopo il tap restano in cronologia ma inerti (fedele WA) */
  .qr.spent .qbtn{color:#8696a0;cursor:default;pointer-events:none}
  .qr.spent .qbtn.danger{color:#b09a9a}
  /* Menu a lista (list message) */
  .menu{align-self:flex-start;width:min(92%,340px);background:#fff;border-radius:9px;border-top-left-radius:2px;overflow:hidden;
    box-shadow:0 1px 1px rgba(0,0,0,.06);flex:0 0 auto}
  .menu-head{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px 3px;font-weight:600}
  .menu-body{font-size:13.5px;color:var(--ink);padding:11px 12px 9px;line-height:1.4}   /* corpo del List Message (testo sopra le voci) */
  .menu-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #f0f3f4;cursor:pointer}
  .menu-row:active{background:#f4f7f8}
  .menu-ic{width:24px;text-align:center;font-size:16px}
  .menu-lb{flex:1;font-size:14px;color:var(--ink);min-width:0}
  .menu-lb-t{display:block}
  .menu-lb-d{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
  .menu-ch{color:#c3cbcf;font-size:18px}
  /* Pulsante del List Message (WA reale: 1 solo pulsante che apre le voci in una schermata) */
  .lm-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;font-size:14px;font-weight:500;
    color:#027eb5;background:none;border:0;border-top:1px solid #eff2f3;cursor:pointer;font-family:inherit;text-transform:uppercase}   /* MAIUSCOLO = enfasi ammessa WA */
  .lm-btn:active{background:#f2f5f6}
  .lm-ic{font-size:15px}
  /* Typing */
  .typing{align-self:flex-start;background:#fff;border-radius:9px;border-top-left-radius:2px;padding:10px 12px;display:inline-flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b5c0c4;display:inline-block;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  /* Nota demo */
  .demo-note{flex:0 0 auto;background:#fff4d6;color:#8a6d00;font-size:11.5px;text-align:center;padding:6px 12px;border-top:1px solid #f0e3b0}
  /* Controlli DEMO (🎭) — chrome dell'emulatore, distinti dalle bolle WhatsApp */
  .demorow{display:flex;justify-content:center;margin:5px 0}
  .demobtn{background:#fff4d6;color:#8a6d00;border:1px dashed #d9c37a;border-radius:14px;font-size:11.5px;padding:5px 12px;cursor:pointer}
  /* Input */
  .bar{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--wa-bg);flex:0 0 auto}
  .ic-btn{background:none;border:0;font-size:20px;cursor:pointer;color:#54656f;flex:0 0 auto;padding:4px}
  .field{flex:1;background:#fff;border-radius:20px;padding:10px 14px;font-size:15px;border:0;outline:0;font-family:inherit;color:var(--ink)}
  .send{width:42px;height:42px;border-radius:50%;background:var(--wa-green);border:0;color:#fff;font-size:19px;cursor:pointer;flex:0 0 auto}
  .send:active{background:#0c5f57}
  /* 🎤 mic dettatura = COMODITÀ EMULATORE (stile web app staff), NON un componente WhatsApp. Temporaneo: da togliere prima della review fedeltà. */
  .mic-btn{width:38px;height:38px;border-radius:50%;border:1px solid #e5e9ee;background:#fff;color:#2f6df6;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
  .mic-btn:hover{background:#f4f6f9}
  .mic-btn.recording{background:#fee2e2;border-color:#ef4444;color:#ef4444;animation:svcMicPulse 1.3s ease-in-out infinite}
  @keyframes svcMicPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 5px rgba(239,68,68,0)}}
  /* Bottom sheet (simulazione WhatsApp Flow / schermate) */
  .sheet-ov{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;z-index:20}
  .sheet-ov.show{opacity:1}
  .sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .25s;padding-bottom:16px}
  .sheet.show{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #eef1f2;display:flex;align-items:flex-start;z-index:2}
  .sheet-handle{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#d5dbdd}
  .sheet-title{font-size:16px;font-weight:600;color:var(--ink);flex:1}
  .sheet-sub{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
  .sheet-x{background:none;border:0;font-size:16px;color:var(--muted);cursor:pointer}
  /* Sottotitoli del Flow: colore di DEFAULT (dark), non brand — i componenti testo
     dei Flow WhatsApp non colorano il testo (come in chat). */
  .flow-lb{font-size:12.5px;font-weight:600;color:var(--ink);padding:13px 14px 3px}
  /* EmbeddedLink nativo del Flow (link accent, non un bottone custom) */
  .flow-link{display:inline-block;margin:8px 14px 2px;font-size:14px;font-weight:600;color:#027eb5;cursor:pointer;text-decoration:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:3px 14px 4px}
  .chip{border:1px solid #cdd6d9;background:#fff;color:var(--ink);border-radius:16px;padding:8px 13px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .chip.sel{background:var(--wa-green);border-color:var(--wa-green);color:#fff}
  .chip.opt:not(.sel){background:#fff4d6;border-color:#f0e3b0;color:#8a6d00}
  .flow-inp{width:calc(100% - 28px);margin:3px 14px 4px;background:#f3f6f7;border:1px solid #e2e8ea;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:0}
  .friend-list{padding:2px 14px}
  .friend-row{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:14px;border-bottom:1px solid #f2f5f6;cursor:pointer}
  .friend-row input{width:19px;height:19px;flex:0 0 auto}
  /* Questionario autovalutazione = WhatsApp Flow: un RadioButtonsGroup per domanda
     (opzioni native, niente testo colorato). Riga = radio + etichetta. */
  .assess-opts{padding:1px 14px 8px}
  .assess-opt{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;font-size:14px;border-bottom:1px solid #f2f5f6;cursor:pointer;line-height:1.35}
  .assess-opt input{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
  /* OptIn privacy del Flow: checkbox + pannello espandibile (EmbeddedLink per aprirlo). */
  .assess-policy{margin:4px 14px 6px;padding:10px 12px;background:#f3f6f7;border-radius:10px;font-size:12px;color:var(--muted);line-height:1.5}
  /* Disponibilità nel Flow: striscia giorni + orari a 3 stati */
  .days{display:flex;gap:8px;overflow-x:auto;padding:3px 14px 4px}
  .day{flex:0 0 auto;min-width:62px;border:1px solid #cdd6d9;background:#fff;border-radius:10px;padding:7px 8px;text-align:center;cursor:pointer;font-family:inherit;line-height:1.25}
  .day b{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
  .day span{display:block;font-size:11px;color:var(--muted)}
  .day small{display:block;font-size:10px;margin-top:2px;font-weight:600}
  .day small.ok{color:#0f8a6d}
  .day small.no{color:#b5c0c4}
  .day.sel{border-color:var(--wa-green);background:#d9f2ee}
  .slot-fascia{font-size:11px;font-weight:600;color:var(--muted);padding:7px 14px 3px;text-transform:uppercase;letter-spacing:.4px}
  .slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
  .slot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 3px;border-radius:9px;font-family:inherit;cursor:pointer;border:1px solid transparent;line-height:1.1}
  .slot b{font-size:13.5px;font-weight:600}
  .slot small{font-size:10.5px;font-weight:600;opacity:.9}
  .slot.free{background:#eaf7e6;color:#0c5f57;border-color:#bfe6c8}
  .slot.conf{background:#fff4d6;color:#8a6d00;border-color:#f0e3b0}
  .slot.busy{background:#f4f6f7;color:#b9c2c6;border-color:#eef1f2;text-decoration:line-through;cursor:default}
  .slot.sel{background:var(--wa-green);color:#fff;border-color:var(--wa-green)}
  .slot-empty{font-size:13px;color:var(--muted);padding:12px 16px;text-align:center}
  .luce-hint{font-size:11.5px;color:var(--muted);padding:3px 2px 0}
  .flow-legend{display:flex;gap:13px;padding:8px 14px 0;font-size:11px;color:var(--muted)}
  .flow-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .dot.free{background:#2ea36b}.dot.conf,.dot.opt{background:#e0a52e}.dot.busy{background:#c3cbcf}
  /* Riepilogo del Flow = testo semplice (TextBody nativo): niente testo colorato
     né sfondo "verde di stato" — il colore lo decide il tema (fedeltà WhatsApp).
     Placeholder muted; selezione valida = testo scuro leggibile, sfondo neutro. */
  .flow-sum{margin:12px 14px 0;padding:10px 12px;background:#f3f6f7;border-radius:10px;font-size:13px;color:var(--muted)}
  .flow-sum.on{background:#f3f6f7;color:var(--ink)}
  .flow-sum .warn{font-weight:600}
  .flow-submit{margin:16px 14px 4px;width:calc(100% - 28px);background:var(--wa-green);color:#fff;border:0;border-radius:22px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase}   /* MAIUSCOLO = enfasi ammessa WA (footer Flow ≤35 char, len invariata) */
  .toast{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;font-size:13px;padding:9px 15px;border-radius:20px;z-index:30;max-width:80%;text-align:center}
  /* Ice Breakers (bottoni primo contatto — Meta: niente emoji, max 4) */
  .ice{align-self:center;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:2px 8px 4px;max-width:96%}
  .ice-b{background:#fff;border:1px solid #cfe0dc;color:#0c5f57;border-radius:17px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .ice-b:active{background:#eef6f4}
  /* Menu comandi "/" (Commands — sempre richiamabile digitando /) */
  .cmd-pop{display:none;flex-direction:column;background:#fff;border-top:1px solid #e2e8ea;max-height:230px;overflow-y:auto;flex:0 0 auto}
  .cmd-pop.show{display:flex}
  .cmd-head{font-size:11px;color:var(--muted);padding:9px 14px 3px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .cmd-row{display:flex;align-items:baseline;gap:10px;padding:10px 14px;cursor:pointer;border-top:1px solid #f2f5f6}
  .cmd-row:active{background:#f4f7f8}
  .cmd-c{font-size:14px;color:#027eb5;font-weight:600}
  .cmd-d{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <span class="back">‹</span>
    <div class="av">PV</div>
    <div><div class="hname">Padel Village</div><div class="hstatus" id="hstatus">online</div></div>
    <div class="spacer"></div>
    <button class="reset" id="resetBtn" title="Ricomincia da capo">↺ Ricomincia</button>
  </div>
  <div class="chat" id="chat"></div>
  <div class="demo-note">🔒 Modalità demo — nessuna prenotazione reale · <span id="buildTag"></span></div>
  <div class="cmd-pop" id="cmdPop"></div>
  <form class="bar" id="bar" autocomplete="off">
    <button type="button" class="ic-btn" id="emojiBtn">😊</button>
    <input class="field" id="field" placeholder="💬 Scrivi o detta…" autocomplete="off">
    <button type="button" class="ic-btn" id="clipBtn">📎</button>
    <button type="button" class="mic-btn" id="micBtn" aria-label="Detta un messaggio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
    <button class="send" id="send" type="submit">↑</button>
  </form>
</div>

<script>
/* ============================================================================
   EMULATORE CHAT GIOCATORI — Padel Village · Fase B (mockup-first)
   100% self-contained: nessuna chiamata reale, nessuna scrittura in Matchpoint.
   Simula i tipi di messaggio WhatsApp (bolle, pulsanti di risposta, menu a
   lista) e i "WhatsApp Flows" (moduli a scomparsa dal basso). Backend FINTO
   in localStorage. Vedi 01-analisi-operativita-chat-giocatori.md
   🔒 REGOLA FERMA (doc §9): qui si realizza SOLO ciò che è riproducibile
   fedelmente su WhatsApp reale (componenti/limiti Flows + policy Meta).
   Verificare sui doc Meta PRIMA di aggiungere grafica/layout/interazioni.
   ========================================================================== */
const LS_KEY='pmo_emu_state_v10';
/* Versione visibile nel footer: serve a capire SUBITO se il browser sta
   mostrando una versione vecchia in cache (Cmd+Shift+R per forzare il reload). */
const APP_BUILD='v0.63 · 04/07';

/* ─── freshnessGuard: auto-guarigione da cache vecchia ──────────────────────
   GitHub Pages / il browser del telefono possono servire un index.html VECCHIO
   dalla cache (è così che riapparivano "Promemoria"/"Ultima chiamata" già rimossi
   dal codice: il JS vecchio in memoria li ri-programmava). I meta anti-cache non
   bastano perché non ripuliscono una copia già memorizzata. Qui, all'avvio,
   scarichiamo il file dal server SENZA cache e confrontiamo APP_BUILD: se il server
   ha un build diverso da quello in esecuzione, la pagina si ricarica DA SOLA su una
   URL con build stampato (nuova chiave di cache = fetch garantito fresco). Nessun
   hard reload manuale; si auto-corregge a ogni visita. Loop-safe: non re-indirizza
   se la URL contiene già ?b=. */
(function freshnessGuard(){
  try{
    if(location.search.indexOf('b=')!==-1) return;      // già arrivati da un redirect: stop
    fetch(location.pathname+'?_fresh='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m=html.match(/APP_BUILD='([^']+)'/);
        if(m && m[1]!==APP_BUILD){
          location.replace(location.pathname+'?b='+encodeURIComponent(m[1]));
        }
      })
      .catch(function(){});
  }catch(e){}
})();

/* --- Dati demo ------------------------------------------------------------- */
function demoState(){
  return {
    player:{ nome:'Marco Aprea', numero:'+39 333 123 4567', socio:true, livello:'4.0', inRegola:true,
             livelloFonte:'segreteria',   // come è stato determinato il livello: 'segreteria' (anagrafica MP) | 'autovalutazione'
             livelloVerifica:null,        // se l'autovalutazione è incoerente: livello indicativo in coda validazione staff (l'ufficiale NON cambia)
             email:'',                    // contatto FACOLTATIVO, self-editable dal giocatore (nome/telefono restano gestiti dalla segreteria)
             prefs:{ promemoria:true, novita:false },   // preferenze notifiche proattive (opt-out marketing = igiene Meta)
             genere:'M',   // dal dato anagrafica: serve alla domanda concierge "mista o omogenea" (F = donna)
             borselloCent:2400, ultimoMov:'ricarica € 20 il 28/06' },
    /* Amici = SOCI del circolo (numero in anagrafica). Niente livello: dopo la
       rimozione delle partite aperte non filtra più nulla. suWhatsApp = ha scritto
       al canale (opt-in) → invitabile; chi non ce l'ha (Giulia) è mostrato come
       voce disabilitata (enabled:false del CheckboxGroup Flow): non possiamo scrivergli.
       optOut = ha risposto "🔕 Non invitarmi più" a un invito → non-invitabile (igiene
       Meta: rispettare l'opt-out evita di finire flaggati come spam). Demo: Paolo RIFIUTA,
       Davide fa OPT-OUT (per mostrare i due rami oltre alla conferma). */
    friends:[
      {id:11,nome:'Luca Bianchi',  numero:'+39 333 555 0102', suWhatsApp:true},
      {id:12,nome:'Sara Rossi',    numero:'+39 333 555 0103', suWhatsApp:true},
      {id:13,nome:'Giulia Verdi',  numero:'+39 333 555 0104', suWhatsApp:false},
      {id:14,nome:'Paolo Neri',    numero:'+39 333 555 0105', suWhatsApp:true},
      {id:15,nome:'Davide Gallo',  numero:'+39 333 555 0107', suWhatsApp:true}
    ],
    /* Demo pulita: una prenotazione già al completo come esempio. Lo stato
       "da completare" (confermato) lo si vede prenotando un nuovo campo. */
    prenotazioni:(function(){ var dd=dayInfo(2); var gs=daySlotGroups(dd.off,dd.dow,90);
      var fissi=(gs.filter(function(g){return g.kind==='fisso';})[0]||{slots:[]}).slots;
      var pick=fissi[Math.min(1,fissi.length-1)]||{ora:'19:30',prezzo:12};   // slot REALE del listino (mai orfano) → l'edit lo può pre-selezionare
      return [{ id:1, giorno:dd.giorno, ora:pick.ora, campo:3, tipo:'Partita', durata:90, stato:'completo', target:4, amici:['Luca','Sara','Paolo'], prezzoTesta:pick.prezzo }]; })(),
    seq:100
  };
}

/* --- LISTINO ESTIVO (prezzi a testa; campo = ×4) --------------------------
   Modello IBRIDO per tipo di giorno (vedi listino.html). LUCE SEMPRE INCLUSA
   (nessun supplemento). Prezzi:
   · Lun–Gio: fascia diurna 09:00–18:00 = 8€, MA 12:00–15:00 = 10€ (fascia
     centrale), avvii ogni 30' · fissi serali 18:00=12, 19:30=13, 21:00=12.
   · Ven: fascia 09:00–17:30 = 8€, 12:00–15:00 = 10€ · fissi 17:30/19:00/20:30=12.
   · Sab–Dom: solo fissi ogni 90' (09:00→18:00) = 8€.
   La fascia diurna chiude dove iniziano i fissi; la partita (durata) deve
   rientrare nella fascia → l'ultimo avvio dipende dalla durata. */
/* Partita SEMPRE 90' in 4 (niente tariffa "in due" / slot da 60'). */
const LISTINO={
  weekday:{ fascia:{start:'09:00',end:'18:00',prezzo:8},
            fissi:[{ora:'18:00',prezzo:12},{ora:'19:30',prezzo:13},{ora:'21:00',prezzo:12}] },
  friday :{ fascia:{start:'09:00',end:'17:30',prezzo:8},
            fissi:[{ora:'17:30',prezzo:12},{ora:'19:00',prezzo:12},{ora:'20:30',prezzo:12}] },
  weekend:{ fascia:null,
            fissi:[{ora:'09:00',prezzo:8},{ora:'10:30',prezzo:8},{ora:'12:00',prezzo:8},{ora:'13:30',prezzo:8},{ora:'15:00',prezzo:8},{ora:'16:30',prezzo:8},{ora:'18:00',prezzo:8}] }
};
/* Fascia centrale (solo lun–ven, dove esiste la fascia diurna): l'avvio tra le
   12:00 e le 15:00 costa 10€/testa invece di 8. Determinato dall'ORARIO DI AVVIO. */
const MIDDAY={start:12*60,end:15*60,prezzo:10};
function dayConfig(dow){ if(dow===0||dow===6) return LISTINO.weekend; if(dow===5) return LISTINO.friday; return LISTINO.weekday; }
function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
/* Prezzo a testa di uno slot di FASCIA diurna: 8€, oppure 10€ se l'avvio è
   nella fascia centrale 12–15 (partita sempre 90' in 4). */
function fasciaPrezzo(fascia,ora){
  const t=toMin(ora);
  if(t>=MIDDAY.start && t<MIDDAY.end) return MIDDAY.prezzo;
  return fascia.prezzo;
}
function fromMin(x){ return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); }
/* Avvii della fascia diurna: ogni 30' finché la partita (durata) rientra nella fascia. */
function fasciaTimes(fascia,durata){ const res=[]; const end=toMin(fascia.end); let t=toMin(fascia.start);
  while(t+durata<=end){ res.push(fromMin(t)); t+=30; if(res.length>60) break; } return res; }
/* Gruppi di slot del giorno, con prezzo e stato. 4 CAMPI = dietro le quinte:
   un orario è "disponibile" finché ≥1 dei 4 campi è libero (qui slotStatus).
   Il giocatore vede solo gli orari, mai i campi né il packing.
   3 stati riproducibili nei WhatsApp Flows reali (doc §9): free = libero ·
   conf = su conferma segreteria (description) · busy = occupato (nascosto). */
function daySlotGroups(off,dow,durata,players){
  const cfg=dayConfig(dow); durata=durata||90; players=players||4; const groups=[];
  if(cfg.fascia){
    groups.push({ name:'Fascia diurna', kind:'fascia',
      slots:fasciaTimes(cfg.fascia,durata).map(t=>({ora:t,prezzo:fasciaPrezzo(cfg.fascia,t),kind:'fascia',status:slotStatus(off,dow,t)})) });
  }
  groups.push({ name:(cfg.fascia?'Slot serali':'Slot fissi'), kind:'fisso',
    slots:cfg.fissi.map(f=>({ora:f.ora,prezzo:f.prezzo,kind:'fisso',status:slotStatus(off,dow,f.ora)})) });
  return groups;
}

function parseWhen(txt){
  const t=txt.toLowerCase(); const base=new Date(); let target=null;
  if(/\boggi\b/.test(t)) target=new Date(base);
  else if(/\bdomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+1); }
  else if(/\bdopodomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+2); }
  else for(let i=0;i<7;i++){ if(t.includes(GIORNI[i])){ target=new Date(base); let diff=(i-base.getDay()+7)%7; if(diff===0) diff=7; target.setDate(base.getDate()+diff); break; } }
  let ora=null; const m=t.match(/(?:alle|ore)?\s*\b([01]?\d|2[0-3])(?:[:.](\d{2}))?\b/);

  return { date:!!target, giorno: target?lbl(target):null, dow: target?target.getDay():null, ora };

  t=t.toLowerCase();
  if(t[0]==='/'){
    if(/^\/aiuto/.test(t)) return 'aiuto';
    if(/^\/prenotazioni/.test(t)) return 'mie';
    if(/^\/prenota/.test(t)) return 'prenota';
    if(/^\/profilo/.test(t)) return 'profilo';
    if(/^\/amici/.test(t)) return 'amici';
    if(/^\/borsellino/.test(t)) return 'borsellino';
    if(/^\/menu/.test(t)) return 'saluto';
  }
  // AIUTO prima degli intenti operativi: "come invito un amico?" è una domanda.
  if(/\b(aiuto|help|guida)\b/.test(t)) return 'aiuto';
  if(/\bcome\s+(si\s+)?(funziona|fa|faccio|posso|uso|usa|prenot|invit|entr|apr|organizz|pag|dispon|complet)/.test(t)) return 'aiuto';
  if(/\bcosa\s+(puoi|sai|posso)\b/.test(t) || /a cosa serv|spiegami|spiega come|non ho capito|come si usa/.test(t)) return 'aiuto';
  if(/quanto costa|quanto si paga|che prezz|come si paga|serve un anticipo|serve un acconto/.test(t)) return 'aiuto';
  if(/^altro\b|^altre\b|\baltre funzioni\b|\baltre opzioni\b|\baltro men[uù]\b|vedi il men[uù]/.test(t)) return 'altro';
  if(/profil|i miei dati|chi sono/.test(t)) return 'profilo';
  if(/amic|con cui gioc|lista giocator/.test(t)) return 'amici';
  if(/borsell|saldo|credito|monedero|portafogl/.test(t)) return 'borsellino';
  if(/disponibil|liber|che campi|quali campi|posti/.test(t)) return 'disponibilita';
  if(/cosa ho|mie prenotaz|le mie|prenotazioni/.test(t)) return 'mie';
  if(/annull|disdet|cancell/.test(t)) return 'annulla';
  if(/modific|spost|cambia orario/.test(t)) return 'modifica';
  // "organizza/concierge" NON è più un ingresso standalone (opzione A): il concierge
  // esiste solo DOPO aver preso il campo (schermata "Completa la partita"). Le frasi
  // tipo "organizzatemi la partita" cadono su 'prenota' → prima prendi lo slot.
  if(/prenot|campo|partita|lezione|gioc|organizz|trovate voi|pensateci voi/.test(t)) return 'prenota';
  if(/ciao|salve|buongiorno|buonasera|ehi|hey|menu/.test(t)) return 'saluto';
  return 'fallback';
}
function sendUser(text,silent){
  if(!silent) addOut(text);
  const t=text.trim(); if(!t) return;
  if(convo.mode==='cancel') return botSay(()=>cancelStep(t));
  botSay(()=>route(detectIntent(t),t));
}
function route(intent,t){
  switch(intent){
    case 'saluto': showMenu('Ciao '+esc(S.player.nome.split(' ')[0])+', come possiamo aiutarti? 👇'); break;
    case 'altro': showMenuAltro('Ecco il menu 👇'); break;
    case 'profilo': doProfilo(); break;
    case 'amici': doAmici(); break;
    case 'borsellino': doBorsellino(); break;
    case 'disponibilita': doDisponibilita(t); break;
    case 'mie': doMie(); break;
    case 'aiuto': doHelp(t); break;
    case 'annulla': startCancel(); break;
    case 'modifica': startModify(); break;
    case 'prenota': startBooking(t); break;
    default: showMenu('Scusa, non abbiamo capito bene 🤔 Ecco cosa possiamo fare 👇');
  }
}

/* ---------- Autovalutazione livello (WhatsApp Flow nativo) -----------------
   Parità con la web app staff: STESSE 8 domande a scelta chiusa e STESSO scoring
   deterministico (declared 40% + balanced 25% + media tecnica 35%, arrotondato a
   0.5, freni prudenziali, coerenza high/medium/low). Fedele WA = un Flow con un
   RadioButtonsGroup per domanda + consenso privacy (OptIn) + 1 solo Footer.
   Applicazione del livello (decisione utente): coerente → applica; incoerente →
   va in validazione staff (l'ufficiale non cambia). In Fase C il Flow scriverà in
   assessment_responses e applicherà con le stesse regole; qui è simulato. */
function emuClean(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function emuNorm(s){ return emuClean(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function emuScoreFromText(value,map){ const raw=emuClean(value); if(!raw) return null; const key=emuNorm(raw);
  for(const [needle,score] of map){ if(key.includes(emuNorm(needle))) return score; } return null; }
function emuTechnical(d){
  const rally=emuScoreFromText(d.rally,[['Faccio fatica a tenere 3-4 colpi',1.0],['Tengo lo scambio solo a ritmo lento',2.0],['Tengo scambi regolari con continuità',3.0],['Tengo scambi anche con ritmo alto',4.0],['Costruisco il punto con controllo',5.0]]);
  const glass=emuScoreFromText(d.glass,[['Evito quasi sempre il vetro',1.0],['Lo uso solo se la palla è facile',2.0],['Difendo con il vetro in modo base',2.5],['Lo uso con continuità anche sotto pressione',3.5],['Lo uso per difendere e ripartire in attacco',4.5]]);
  const net=emuScoreFromText(d.net,[['Sto poco a rete',1.5],['Vado a rete ma faccio fatica a chiudere',2.0],['Gioco volée semplici',2.5],['Tengo posizione e controllo le volée',3.5],['Costruisco e chiudo il punto a rete',4.5]]);
  const overhead=emuScoreFromText(d.overhead,[['Non li uso',1.5],['Li provo ma con poca sicurezza',2.0],['Uso almeno la bandeja in modo semplice',2.5],['Uso bandeja e smash con controllo',3.5],['Uso colpi alti in modo tattico e affidabile',4.5]]);
  const vals=[rally,glass,net,overhead].filter(v=>typeof v==='number'&&isFinite(v));
  const average=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;
  return {rally,glass,net,overhead,average};
}
function emuParseLevel(v){ const raw=emuClean(v); if(!raw) return ''; const n=raw.replace(',','.').trim(); if(/^\s*5\+/.test(n)) return '5'; const m=n.match(/\d+(?:\.\d+)?/); return m?m[0]:''; }
function emuRoundHalf(v){ const n=Number(v); if(!isFinite(n)) return ''; return String(Math.max(0.5,Math.min(7,Math.round(n*2)/2))); }
function emuCalcLevel(d){
  const declared=parseFloat(emuParseLevel(d.declaredLevel));
  const balanced=parseFloat(emuParseLevel(d.balancedLevel));
  const tech=emuTechnical(d); const parts=[];
  if(isFinite(declared)) parts.push({value:declared,weight:0.40});
  if(isFinite(balanced)) parts.push({value:balanced,weight:0.25});
  if(isFinite(tech.average)) parts.push({value:tech.average,weight:0.35});
  if(!parts.length) return {declared_level:'',calculated_level:'',coherence:'medium',staff_status:'review'};
  const wsum=parts.reduce((s,p)=>s+p.weight,0);
  const raw=parts.reduce((s,p)=>s+p.value*p.weight,0)/wsum;
  let calc=parseFloat(emuRoundHalf(raw));
  if(isFinite(declared)){ if(calc>declared+0.5) calc=declared+0.5; if(calc<declared-1.0) calc=declared-1.0; calc=Math.max(0.5,Math.min(7,Math.round(calc*2)/2)); }
  const techRef=isFinite(tech.average)?tech.average:(isFinite(balanced)?balanced:calc);
  const diff=isFinite(declared)?Math.abs(declared-techRef):0;
  const coherence=diff<=0.5?'high':(diff<=1?'medium':'low');
  return {declared_level:isFinite(declared)?String(declared):'', calculated_level:String(calc), coherence, staff_status:coherence==='low'?'review':''};
}
/* Le 8 domande (parità col form staff). Le prime 4 producono declared/balanced,
   le altre 4 sono tecniche (score fissi). Ogni domanda = un RadioButtonsGroup. */
const ASSESS_Q=[
  {name:'experience',   q:'1. Da quanto giochi a padel?',              opts:['Meno di 1 mese','1-3 mesi','3-6 mesi','6-12 mesi','Più di 1 anno','Più di 3 anni']},

  {name:'balancedLevel',q:'4. Con quali livelli fai partite equilibrate?', opts:['1.0 / 1.5','2.0','2.5','3.0','3.5','4.0','4.5','5+']},
  {name:'rally',        q:'5. Riesci a mantenere lo scambio?',         opts:['Faccio fatica a tenere 3-4 colpi','Tengo lo scambio solo a ritmo lento','Tengo scambi regolari con continuità','Tengo scambi anche con ritmo alto','Costruisco il punto con controllo']},
  {name:'glass',        q:'6. Come gestisci il vetro in difesa?',      opts:['Evito quasi sempre il vetro','Lo uso solo se la palla è facile','Difendo con il vetro in modo base','Lo uso con continuità anche sotto pressione','Lo uso per difendere e ripartire in attacco']},
  {name:'net',          q:'7. A rete come ti comporti?',               opts:['Sto poco a rete','Vado a rete ma faccio fatica a chiudere','Gioco volée semplici','Tengo posizione e controllo le volée','Costruisco e chiudo il punto a rete']},
  {name:'overhead',     q:'8. Bandeja / vibora / smash',               opts:['Non li uso','Li provo ma con poca sicurezza','Uso almeno la bandeja in modo semplice','Uso bandeja e smash con controllo','Uso colpi alti in modo tattico e affidabile']}
];

/* Livello sempre mostrato a una cifra decimale (4 → "4.0", 4.5 → "4.5"). */
function fmtLevel(v){ const n=parseFloat(v); return isFinite(n)?n.toFixed(1):String(v); }
function submitAssessment(answers){
  const res=emuCalcLevel(answers);
  const lvl=fmtLevel(res.calculated_level);
  if(res.coherence==='low'){
    // Incoerente (dichiarato vs tecnica > 1.0): l'ufficiale NON cambia → validazione staff.
    S.player.livelloVerifica=lvl; save();
    addInHtml('📊 <b>Autovalutazione registrata</b>'
      +'<br>🎾 Livello indicativo: <b>'+esc(lvl)+'</b>'
      +'<br>⚠️ C\'è una differenza tra il livello che hai indicato e le risposte tecniche.'
      +'<br>La <b>segreteria lo verifica</b> e te lo confermiamo qui. Per ora il tuo livello resta <b>'+esc(S.player.livello)+'</b>.',true);
  } else {
    // Coerente (alta/media): applichiamo subito il livello calcolato.
    S.player.livello=lvl; S.player.livelloFonte='autovalutazione'; S.player.livelloVerifica=null; save();
    addInHtml('✅ <b>Autovalutazione registrata</b>'
      +'<br>🎾 Il tuo livello ora è <b>'+esc(lvl)+'</b>'
      +'<br>Lo useremo per formarti partite equilibrate. Puoi rifarla quando vuoi.',true);
  }
  addQuick([{label:'👤 Il mio profilo',text:'Il mio profilo'},menuBtn()]);
}

/* ---------- Le mie prenotazioni -------------------------------------------- */
function statoPren(p){
  // Stato interno: 'confermato' (incompleto, campo tuo) vs 'completo' (al completo).
  // All'utente: sempre "Prenotato"; se incompleto ricordiamo che è da completare e
  // che il campo è sotto la sua responsabilità.
  if(p.stato==='completo') return '✅ Prenotato · partita al completo';
  if(p.concierge) return '🧑‍💼 In organizzazione dalla segreteria (+'+CONCIERGE_FEE+' €)'+(p.mix?(' · partita '+mixPhrase(p.mix)):'');
  return '✅ Prenotato · da completare '+rosterFilled(p)+'/'+rosterTarget(p)+(rosterPending(p)?(' · in attesa: '+p.invitati.join(', ')):'')+' · sei responsabile del campo';
}
/* Descrizione della riga "Giocatori" nel dettaglio (≤72 char): riflette lo stato
   del roster e cosa puoi farci (invita/aggiungi/togli, o togli/sostituisci se completa). */
function playersDesc(p){
  const filled=rosterFilled(p), tgt=rosterTarget(p), pend=rosterPending(p);
  if(p.stato==='completo') return 'Al completo '+filled+'/'+tgt+' · togli o sostituisci';
  return filled+'/'+tgt+(pend?(' · '+pend+' in attesa'):'')+' · invita, aggiungi o togli';
}
/* Le mie prenotazioni: LISTA (List Message ≤10) → tocca → DETTAGLIO = List
   "Gestisci la prenotazione". Pattern fedele a WhatsApp (niente valanga di reply-buttons). */
function doMie(){

    rows:list.slice(0,9).map(p=>({section:'Prenotazioni', ic:'✅', label:p.giorno+' · '+p.ora, desc:'Campo '+p.campo+' · '+p.tipo, action:()=>botSay(()=>showBookingDetail(p.id))})).concat([menuBackRow()]) });

    +(p.amici&&p.amici.length?('<br>Con: '+p.amici.join(', ')):'')
    +(rosterPending(p)?('<br>✉️ In attesa: '+p.invitati.join(', ')):'')
    +'<br>'+statoPren(p));
  // GESTISCI la prenotazione = List Message (le 3 azioni non stanno in 3 reply-button:

    action:()=>botSay(()=>startCancelOne(p))});

function startBooking(text){

/* ⚠️ CONCIERGE STANDALONE — NON più cablato (opzione A, scelta utente 03/07): nessun
   comando/intent/menu lo raggiunge. Il concierge esiste SOLO come completamento
   DOPO la prenotazione (delegateConcierge, schermata "Completa la partita"). Funzione
   e ramo `openBookingFlow({concierge:true})` tenuti per riferimento, non invocati. */
function doConcierge(){
  addInHtml('Ci pensiamo noi 🧑‍💼<br>Scegli quando vuoi giocare, ai giocatori pensiamo noi.<br>'+FEE_LINE+' 👇');
  openBookingFlow({concierge:true});
}
function openBookingFlow(prefill){
  prefill=prefill||{};
  const editId=prefill.editId||null;                       // MODIFICA: rifai il giro sul modulo e AGGIORNA la prenotazione esistente
  const concierge=!!prefill.concierge;
  const days=[]; for(let o=0;o<=MAX_GIORNI;o++) days.push(dayInfo(o));
  const st={ off:0, ora:null, momento:null, tipo:'Partita', players:4, durata:90, amici:(prefill.amici||[]).slice(), concierge:concierge };
  if(prefill.giorno){ const m=days.filter(d=>d.giorno===prefill.giorno)[0]; if(m) st.off=m.off; }
  else{ for(let i=0;i<days.length;i++){ if(availSlots(days[i].off,days[i].dow)>0){ st.off=days[i].off; break; } } }
  // MODIFICA: la prenotazione che stai cambiando "possiede" già il suo slot →
  // in edit-mode lo mostriamo SEMPRE come libero e pre-selezionato (anche se la
  // disponibilità pseudo-casuale lo darebbe occupato: quel campo è il tuo).
  const ownOff = editId ? st.off : null;
  const ownOra = editId ? (prefill.ora||null) : null;
  function flatDay(off,dow){ const arr=daySlotsFlat(off,dow,st.durata,st.players);
    if(editId && off===ownOff && ownOra){ const s=arr.filter(function(x){return x.ora===ownOra;})[0]; if(s) s.status='free'; }
    return arr; }
  const body=el('flow');
  if(concierge){ body.appendChild(el('luce-hint','🧑‍💼 <b>Organizza la partita</b><br>Scegli quando vuoi giocare, ai giocatori pensiamo noi.<br>'+FEE_LINE)); }
  // Passo 1: quando (prossimi 7 giorni con conteggio slot disponibili)
  body.appendChild(fieldLabel('Quando'));
  const dayRow=el('days'); body.appendChild(dayRow);
  // Passo 2: momento (Mattina/Pomeriggio/Sera) → mostra pochi orari per volta
  const momLabel=fieldLabel('Momento'); body.appendChild(momLabel);
  const momBox=el('chips'); body.appendChild(momBox);
  // Passo 3: gli orari del momento scelto (chips = ChipsSelector nativo)
  const slotBox=el('slotbox'); body.appendChild(slotBox);
  body.appendChild(el('flow-legend','<span><i class="dot free"></i>Libero</span>'));
  // Partita sempre 90' in 4 (niente selettore "in quanti giocate").
  // FASE 1 = SOLO giorno/momento/orario (una scelta per volta). Invita amici e
  // "ci pensate voi" sono la FASE 2, DOPO l'opzione: prima ti assicuri il campo,
  // poi decidi come completare la partita (vedi rosterActionButtons).
  const sum=el('flow-sum');   // riepilogo selezione
  body.appendChild(sum);
  const foot=document.createElement('button'); foot.className='flow-submit'; foot.textContent=editId?'Salva':(concierge?'Richiedi organizzazione':'Continua');
  foot.onclick=()=>{
    if(!st.ora){ toast('Tocca prima un orario libero.'); return; }
    const d=days[st.off];
    const meta=slotMetaFor(d.off,d.dow,st.ora,st.durata,st.players);
    const dur=90, players=4;   // partita sempre 90' in 4
    closeSheet();
    const names=st.amici.map(friendName).filter(Boolean);
    const pr=slotPrezzo(meta,players);
    if(editId){ addOut('✏️ '+d.giorno+' · '+st.ora);
      botSay(()=>applyEdit(editId,d,st.ora,meta)); return; }
    if(concierge){ addOut('🧑‍💼 Organizzate voi · '+d.giorno+' · '+st.ora+" ("+dur+"')");
      botSay(()=>decideConcierge({giorno:d.giorno,dow:d.dow,ora:st.ora,tipo:st.tipo,durata:dur,players:players})); return; }
    addOut('📋 '+d.giorno+' · '+st.ora+' · in '+players+" ("+dur+"') · "+pr.testa+'€/testa'+(names.length?(' · con '+names.join(', ')):''));
    botSay(()=>decideAndPresent({giorno:d.giorno,dow:d.dow,ora:st.ora,tipo:st.tipo,durata:dur,amici:st.amici.slice(),players:players}));
  };
  body.appendChild(foot);

  function renderDays(){
    dayRow.innerHTML='';
    days.forEach(d=>{
      const c=availSlots(d.off,d.dow);
      const b=document.createElement('button'); b.type='button'; b.className='day'+(d.off===st.off?' sel':'');
      b.innerHTML='<b>'+d.w+'</b><span>'+d.n+'</span><small class="'+(c?'ok':'no')+'">'+(c?c+' liberi':'pieno')+'</small>';
      b.onclick=()=>{ st.off=d.off; st.ora=null; st.momento=null; renderDays(); renderMomenti(); renderSlots(); updSum(); };
      dayRow.appendChild(b);
    });
  }
  function renderMomenti(){
    momBox.innerHTML='';
    const flat=flatDay(days[st.off].off,days[st.off].dow).filter(s=>s.status!=='busy');
    const avail=MOMENTI.filter(mm=>flat.some(s=>momentoKey(s.ora)===mm.key));
    if(!avail.some(m=>m.key===st.momento)) st.momento=null;   // niente pre-selezione del momento all'apertura: l'utente sceglie (edit/prefill imposta st.momento esplicito → resta)
    momLabel.style.display=avail.length?'':'none';
    avail.forEach(mm=>{
      const n=flat.filter(s=>momentoKey(s.ora)===mm.key).length;
      const b=document.createElement('button'); b.type='button';
      b.className='chip'+(st.momento===mm.key?' sel':'');
      b.textContent=mm.label+' ('+n+')';
      b.onclick=()=>{ st.momento=mm.key; st.ora=null; renderMomenti(); renderSlots(); updSum(); };
      momBox.appendChild(b);
    });
  }
  function renderSlots(){
    slotBox.innerHTML='';
    const d=days[st.off];
    if(!st.momento){ slotBox.appendChild(el('slot-empty','👇 Scegli un momento, poi l\'orario.')); return; }
    const flat=flatDay(d.off,d.dow).filter(s=>s.status!=='busy'&&momentoKey(s.ora)===st.momento);
    if(!flat.length){ slotBox.appendChild(el('slot-empty','Nessun orario in questa fascia.')); return; }
    const uniform=flat.length && flat.every(s=>s.prezzo===flat[0].prezzo), first=flat[0];
    if(uniform){ const hdr=el('slot-fascia'); hdr.textContent=first.prezzo+'€ a testa'; slotBox.appendChild(hdr); }
    const row=el('chips');
    flat.forEach(s=>{
      const b=document.createElement('button'); b.type='button';
      b.className='chip'+(st.ora===s.ora?' sel':'');
      b.textContent=uniform?s.ora:(s.ora+' · '+s.prezzo+'€');
      b.onclick=()=>{ st.ora=s.ora; renderSlots(); updSum(); };
      row.appendChild(b);
    });
    slotBox.appendChild(row);
  }
  function updSum(){
    const d=days[st.off];
    if(!st.ora){ sum.className='flow-sum'; sum.textContent='Nessun orario selezionato'; return; }
    const meta=slotMetaFor(d.off,d.dow,st.ora,st.durata,st.players);
    const dur=meta ? (meta.kind==='fisso'?90:st.durata) : st.durata;
    const players=meta&&meta.kind==='fisso'?4:st.players;
    const pr=slotPrezzo(meta,players);
    sum.className='flow-sum on';
    // Modifica di una prenotazione GIÀ completa (o delegata alla segreteria): il
    // roster non cambia spostando l'orario → niente riga "1/4 · completa entro"
    // (sarebbe fuorviante), solo data + prezzo (+ nota concierge se delegata).
    const editRec=editId?S.prenotazioni.find(x=>x.id===editId):null;
    if(editRec && (editRec.stato==='completo' || editRec.concierge)){
      sum.innerHTML='📅 <b>'+esc(d.giorno)+' · '+st.ora+'–'+addMin(st.ora,dur)+'</b>'
        +'<br>💶 <b>'+pr.testa+' € a testa</b>'
        +(editRec.concierge?('<br>🧑‍💼 '+FEE_LINE):'');
      return;
    }
    const target=pr.giocatori, inviti=st.amici.length;
    sum.innerHTML='📅 <b>'+esc(d.giorno)+' · '+st.ora+'–'+addMin(st.ora,dur)+'</b>'
      +(st.concierge
        ? ('<br>💶 <b>'+pr.testa+' € a testa</b>'
          +'<br>🧑‍💼 '+FEE_LINE)
        : ('<br>💶 <b>'+pr.testa+' € a testa</b>'
          +'<br>👥 1/'+target+' (tu)'+(inviti?(' · ✉️ '+inviti+' invit'+(inviti>1?'i':'o')):'')
          +'<br>🙋 La partita è <b>tua</b> — se resta incompleta, l\'intero campo (<b>'+pr.campo+'€</b>) è a tuo carico'));
  }
  openSheet(editId?'Modifica la prenotazione':'Prenota un campo', body, 'Scegli giorno, momento e orario');
  renderDays(); renderMomenti(); renderSlots();
  if(prefill.ora){
    const d=days[st.off]; const meta=slotMetaFor(d.off,d.dow,prefill.ora,st.durata,st.players);
    if(meta && (editId || meta.status!=='busy')){ st.momento=momentoKey(prefill.ora); st.ora=prefill.ora; renderMomenti(); renderSlots(); }
  }
  updSum();
}
/* MODIFICA: applica al record esistente la nuova scelta fatta nel modulo (giorno/
   orario), ricalcola la finestra di completamento e ripropone le scelte. NON crea
   una nuova prenotazione (a differenza di decideAndPresent). */
function applyEdit(editId,d,ora,meta){
  const rec=S.prenotazioni.find(x=>x.id===editId);
  if(!rec){ addInHtml('Quella prenotazione non è più disponibile.'); homeMenu(); return; }
  rec.giorno=d.giorno; rec.ora=ora; rec.campo=campoLibero(d.dow,ora); rec.durata=90;
  rec.prezzoTesta=slotPrezzo(meta,4).testa;
  if(!rec.concierge){
    rec._nudgeStop=false;                 // spostando la data riparte la catena promemoria
    recomputeCompletion(rec);             // ricalcola solo completo vs confermato (niente scadenza)
    if(rec.stato==='confermato') scheduleNudge(rec.id, nudgeChainLen(offsetForGiorno(rec.giorno)||0));
  }
  save();
  // Card UNICA aggiornata: da-completare → ripropone le scelte; già completa/concierge → conferma secca.
  if(!rec.concierge && rec.stato==='confermato') rosterActionButtons(rec, {receipt:true, header:'📌 <b>Prenotazione aggiornata</b>'});
  else {
    // Prenotazione GIÀ completa (o delegata alla segreteria): nessuna fase di
    // completamento da riproporre → conferma segmentata + ritorno al menu.
    addInHtml('✅ <b>Prenotazione aggiornata</b><br>📅 '+esc(rec.giorno)+' · '+rec.ora+'<br>📍 Campo '+rec.campo);
    homeMenu();
  }
}

function decideAndPresent(draft){
  // Coerenza con la vista disponibilità: se l'orario chiesto a parole è
  // OCCUPATO, apri il modulo con gli orari disponibili.
  const off=offsetForGiorno(draft.giorno);
  const draftMeta = off!=null ? slotMetaFor(off,draft.dow,draft.ora,draft.durata,draft.players) : null;
  if(draftMeta && draftMeta.status==='busy'){
    addFlowLaunch('A quell\'ora è tutto occupato. Ti apriamo il modulo con gli orari disponibili. 👇', ()=>openBookingFlow({giorno:draft.giorno,durata:draft.durata,amici:draft.amici}));
    return;
  }
  const campo=campoLibero(draft.dow,draft.ora); const fine=addMin(draft.ora,draft.durata);
  const pr=slotPrezzo(draftMeta,draft.players);
  const target=pr.giocatori;
  const names=(draft.amici||[]).map(friendName).filter(Boolean);   // amici scelti = da INVITARE
  draft.campo=campo; draft.fine=fine; draft.target=target; draft.names=names;
  draft.prezzoTesta=pr.testa;
  // Niente più bottone "Procedi": scegliere giorno/orario nel modulo (o la frase
  // scritta) È GIÀ la conferma → opzioniamo SUBITO e sotto mostriamo "come
  // completare la partita". Un passaggio in meno (richiesta utente) e via la copy
  // contraddittoria ("opzioniamo" al futuro mentre il campo non era ancora preso).
  commitOpzione(draft);
}
/* Crea l'OPZIONE (gratis) col solo organizzatore confermato; gli amici scelti
   ricevono un INVITO (il posto si riempie solo quando accettano). */
/* Ricalcola SOLO lo stato squadra (niente scadenza): al completo = 'completo',
   altrimenti 'confermato' (campo tuo, da completare, sotto la tua responsabilità).
   Nessun 'sameDay'/deadline/win: il modello a responsabilità vale per tutte. */
function recomputeCompletion(rec){
  if(rec.concierge) return;
  rec.stato = rosterPosti(rec)<=0 ? 'completo' : 'confermato';
}
function commitOpzione(draft){
  const off=offsetForGiorno(draft.giorno);
  const target=draft.target||4;
  const invited=(draft.names||(draft.amici||[]).map(friendName).filter(Boolean)).slice(0,target-1);
  const rec={id:++S.seq,giorno:draft.giorno,ora:draft.ora,campo:draft.campo,tipo:draft.tipo,durata:draft.durata,
    target:target, amici:[], invitati:invited.slice(),
    prezzoTesta:(draft.prezzoTesta!=null?draft.prezzoTesta:null)};
  recomputeCompletion(rec);                 // completo (4/4) oppure confermato (da completare)
  S.prenotazioni.push(rec); save();
  rosterActionButtons(rec, {receipt:true}); // MSG 1 ricevuta ✅ + MSG 2 (card azione con disclaimer responsabilità)
  if(invited.length) sendInvites(rec, invited);
  if(rec.stato==='confermato') scheduleNudge(rec.id, nudgeChainLen(off||0));   // catena promemoria "check-in aereo"
}
/* FASE 2 — come completare la partita (dopo l'opzione). LIST MESSAGE WhatsApp:
   il CORPO della lista porta lo stato roster + la domanda (così la ricevuta — card
   1 — resta pulita e non si ripete "completa"); ogni riga = titolo (≤24 char) +
   descrizione (≤72 char), così ogni scelta si spiega da sola (i reply-button non
   hanno descrizione). Se è delegata alla segreteria non servono azioni sui posti.
   Annulla/aspetta = da "Le mie prenotazioni". */
/* MSG 1 = RICEVUTA: bolla di conferma "Campo prenotato", SEPARATA dalla card d'azione.
   Motivo (test utente): un'unica card con ✅ + dettagli + azione veniva letta come
   "ho finito" → nessuno completava la partita. Emessa SOLO alla conferma iniziale e
   dopo una modifica (opts.receipt), MAI sui re-show del roster (falsa ricevuta). */
function bookingReceipt(rec, header){
  const fine=addMin(rec.ora,rec.durata||90);
  const priceLine=(rec.prezzoTesta!=null)?('<br>💶 <b>'+rec.prezzoTesta+' € a testa</b>'):'';   // solo a testa
  addInHtml((header||'📌 <b>Campo prenotato</b> a tuo nome')
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora+'–'+fine+' · Campo '+rec.campo
    +priceLine);
}
function rosterActionButtons(rec, opts){
  if(rec.concierge){ addQuick([{label:'📅 Le prenotazioni',action:()=>botSay(doMie)}]); return; }
  const posti=rosterPosti(rec);
  if(opts && opts.receipt) bookingReceipt(rec, opts.header);   // MSG 1 (ricevuta) prima della card d'azione
  // MSG 2 = card d'AZIONE (List) UNICA per ogni prenotazione da completare (oggi o
  // futura: stesso modello a responsabilità). Corpo SEGMENTATO (una riga = un fatto,
  // emoji-àncora, amo in MAIUSCOLO): amo "MANCANO N GIOCATORI" + roster + DISCLAIMER
  // con la cifra dell'intero campo. Data NON ripetuta (è nella ricevuta). Il pulsante
  // DICE l'azione ("Completa la partita") — eccezione voluta a "☰ Apri".
  const amo = posti>1 ? ('MANCANO <b>'+posti+'</b> GIOCATORI') : (posti===1 ? 'MANCA <b>1</b> GIOCATORE' : 'PARTITA AL COMPLETO');
  const body='🎾 '+amo
    +'<br>🕒 Si gioca '+esc(rec.giorno)+' alle '+rec.ora
    +'<br>👥 Sei in <b>'+rosterFilled(rec)+'/'+rosterTarget(rec)+'</b>'
    +(rosterPending(rec)?('<br>✉️ In attesa: '+rec.invitati.join(', ')):'')
    +(posti>0 ? '<br>'+disclaimerLines(rec) : '');
  // Le voci (con descrizione) vivono NELLA SCHERMATA che apre il pulsante (fedele a WA).
  const rows=[
    {section:'Completa la partita', ic:'👥', label:'Invito i miei amici', desc:rosterPending(rec)?('Invita o revoca · '+rosterPending(rec)+' in attesa'):'Scegli tu con chi giocare', action:()=>botSay(()=>addFlowLaunch('Apriamo il modulo — spunta gli amici che giocano con te. 👇', ()=>openAddPlayersFlow(rec)))},
    {ic:'🧑‍💼', label:'Ci pensa la segreteria', desc:'Troviamo noi i giocatori · +'+CONCIERGE_FEE+' € sul totale', action:()=>botSay(()=>delegateConcierge(rec))},
    {section:'Oppure', ic:'✏️', label:'Modifica la prenotazione', desc:'Cambia giorno o orario', action:()=>botSay(()=>{ addFlowLaunch('Riapriamo il modulo — scegli di nuovo giorno e orario. 👇', ()=>openBookingFlow({editId:rec.id, giorno:rec.giorno, ora:rec.ora})); })},
    menuBackRow('Oppure')
  ];
  addListMessage({body:body, button:'Completa la partita', title:'Completa la partita', rows:rows.slice(0,10)});   /* pulsante = CTA (eccezione voluta a "Apri") */
}
/* Ramo "Ci pensate voi": delega alla segreteria un'opzione già presa (+5 € sulla quota di chi prenota per primo). */
/* ---------- Preferenza partita: MISTA o OMOGENEA (solo concierge) -----------
   Quando organizza la SEGRETERIA le chiediamo se vuole una partita mista
   (uomini e donne) o omogenea (stesso genere di chi prenota). La domanda si
   adatta al genere del richiedente (dato reale = anagrafica socio). */
function isDonna(){ return String(S.player.genere||'M').toUpperCase()==='F'; }
function omogeneaLbl(){ return isDonna() ? 'Solo donne' : 'Solo uomini'; }               // ≤20 char (titolo reply-button)
function mixPhrase(mix){ return mix==='mista' ? 'mista' : (isDonna() ? 'tra sole donne' : 'tra soli uomini'); }
function fillerNames(mix, n){
  const uomini=['Andrea T.','Giulio S.','Marco V.','Luca P.'];
  const donne =['Marta P.','Elena R.','Sara L.','Chiara B.'];
  const misti =['Andrea T.','Marta P.','Giulio S.','Elena R.'];
  const pool = mix==='omogenea' ? (isDonna()?donne:uomini) : misti;
  return pool.slice(0, n);
}
/* Chiede mista/omogenea, poi chiama done(mix). 2 reply-button (fedele WA). */
function askMatchMix(done){
  addInHtml('Perfetto. Un\'ultima cosa: preferisci una partita <b>mista</b> (uomini e donne) o <b>omogenea</b> ('+(isDonna()?'sole donne':'soli uomini')+')?');
  addQuick([
    {label:'👫 Mista',action:()=>{ addOut('Mista'); botSay(()=>done('mista')); }},
    {label:(isDonna()?'👩 ':'👨 ')+omogeneaLbl(),action:()=>{ addOut(omogeneaLbl()); botSay(()=>done('omogenea')); }}
  ]);
}
function delegateConcierge(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  if(r.stato==='completo'){ addInHtml('Questa partita è già al completo 🎾 — non serve la segreteria.'); homeMenu(); return; }
  if(r.concierge){ addInHtml('Ci stiamo già pensando noi 🧑‍💼 — ti avvisiamo qui appena la partita è al completo.'); homeMenu(); return; }
  addInHtml('Ci pensiamo noi 🧑‍💼<br>Completiamo la partita di <b>'+esc(r.giorno)+' · '+r.ora+'</b> cercando altri giocatori.<br>'+FEE_LINE+'<br><b>Confermi?</b>');
  addQuick([
    {label:'✅ Sì, ci pensate voi',action:()=>{ addOut('Sì, ci pensate voi'); botSay(()=>askMatchMix(mix=>commitDelegate(r,mix))); }},
    {label:'Torna indietro',action:()=>botSay(()=>rosterActionButtons(r))}
  ]);
}
function commitDelegate(r,mix){
  let rr=S.prenotazioni.find(x=>x.id===r.id);
  if(rr && rr.stato==='completo'){ addInHtml('Questa partita è già al completo 🎾 — non serve la segreteria.'); return; }
  // Difensivo: il campo non si auto-rilascia più → rr esiste sempre. Se per qualche
  // motivo mancasse, lo ricreiamo confermato (senza scadenza).
  if(!rr){
    rr={id:++S.seq,giorno:r.giorno,ora:r.ora,campo:r.campo,tipo:r.tipo||'Partita',durata:r.durata||90,
      target:r.target||4, amici:[], stato:'confermato'};
    S.prenotazioni.push(rr);
  }
  rr.concierge=true; rr.mix=mix; save();
  addInHtml('🧑‍💼 <b>Ci pensiamo noi!</b>'
    +'<br>📅 '+esc(rr.giorno)+' · '+rr.ora+' · partita '+mixPhrase(mix)
    +'<br>Cerchiamo i giocatori e <b>ti avvisiamo appena è al completo</b>.'
    +'<br>'+FEE_LINE,true);
  setTimeout(()=>{ const x=S.prenotazioni.find(p=>p.id===rr.id); if(!x||x.stato==='completo') return;
    botSay(()=>{ const nomi=fillerNames(x.mix, rosterPosti(x)); x.amici=(x.amici||[]).concat(nomi); save();
      confirmBooking(x,'🧑‍💼 Partita completata dalla segreteria · +'+CONCIERGE_FEE+' € da pagare in segreteria'); }); }, 6000);
}
/* Partita al completo → prenotazione confermata. */
function confirmBooking(rec,extra){
  rec.stato='completo'; save();
  addInHtml('✅ <b>Prenotazione confermata!</b>'
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora
    +'<br>📍 Campo '+rec.campo+' · in '+rosterTarget(rec)
    +(rec.amici&&rec.amici.length?('<br>👥 '+rec.amici.join(', ')):'')
    +(extra?('<br>'+extra):''),true);
  maybeHint(); homeMenu();
}
/* ---------- Promemoria "check-in aereo" (catena a costo Meta zero) ---------
   Dopo la prenotazione, dentro la finestra 24h di servizio (GRATIS), mandiamo un
   promemoria che ricorda la RESPONSABILITÀ e chiede una decisione con 2 reply-button:
   · 🔔 "Ricordamelo ancora" → il tap è un messaggio in entrata che RIAPRE la finestra
     24h → il prossimo nudge resta gratis (catena). Riprogramma il nudge successivo.
   · 🙅 "Me ne occupo io" → stop promemoria + presa di responsabilità piena.
   Cadenza scalata sulla distanza (nudgeChainLen): più la partita è lontana, più
   anelli; in giornata uno solo. Nell'emulatore i delay sono brevi (~8s); nel prodotto
   reale sono ore. La catena si ferma se la partita diventa completa/delegata o se
   l'utente sceglie "me ne occupo io" (rec._nudgeStop). */
function nudgeChainLen(off){ if(off===0) return 1; if(off<=2) return 2; return 3; }
function scheduleNudge(recId, n){
  if(n<=0) return;
  setTimeout(()=>{
    const r=S.prenotazioni.find(x=>x.id===recId);
    if(!r || r.stato==='completo' || r.concierge || r._nudgeStop || rosterPosti(r)<=0) return;
    botSay(()=>rosterNudge(r, n));
  }, 8000);
}
function rosterNudge(r, n){
  addInHtml('🔔 <b>Promemoria partita</b>'
    +'<br>📅 '+esc(r.giorno)+' · '+r.ora
    +'<br>'+disclaimerLines(r));
  addQuick([
    {label:'🔔 Ricordamelo ancora', action:()=>{ addOut('Ricordamelo ancora');
      botSay(()=>{ addInHtml('👍 Ti ricorderò ancora di completare la partita.'); scheduleNudge(r.id, n-1); }); }},
    {label:'🙅 Me ne occupo io', action:()=>{ addOut('Me ne occupo io');
      const rr=S.prenotazioni.find(x=>x.id===r.id); if(rr){ rr._nudgeStop=true; save(); }
      botSay(()=>addInHtml('👍 <b>Ci pensi tu</b>'
        +'<br>Non ti mando altri promemoria.'
        +'<br>'+disclaimerLines(r))); }}
  ]);
}
/* Modulo "gestisci i giocatori" = WhatsApp FLOW nativo: UN solo CheckboxGroup + UN
   footer. Tre tipi di riga, tutte nello stesso gruppo (max-selected = target−1 = 3 altri):
   · CONFERMATI ✅ (pre-spuntati) → deseleziona = TOGLI dal roster (se la partita era
     completa torna "da completare");
   · IN ATTESA ✉️ (pre-spuntati) → deseleziona = REVOCA l'invito;
   · AMICI invitabili (non spuntati) → spunta = INVITA (modello B: il posto si riempie
     SOLO quando confermano; template Meta ✅ Confermo / ❌ Non posso / 🔕 Non invitarmi più).
   Voci non invitabili = disabilitate: non sul canale (no opt-in) o opt-out 🔕. NIENTE
   "Ospite" (solo giocatori veri). "Aggiungi un amico" = EmbeddedLink (esce dal Flow per
   condividere un contatto, poi torni qui). Footer unico "Aggiorna partita" applica tutto. */
function openAddPlayersFlow(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  const target=rosterTarget(r);
  const maxOthers=target-1;                              // caselle = gli ALTRI giocatori (tu conti sempre come 1)
  const confirmed=(r.amici||[]).slice();                 // giocatori CONFERMATI (deseleziona = TOGLI)
  const pending=(r.invitati||[]).slice();                // inviti in ATTESA (deseleziona = REVOCA)
  const preChecked=confirmed.concat(pending);
  const avail=S.friends.filter(f=>preChecked.indexOf(f.nome.split(' ')[0])<0);   // invitabili (spunta = INVITA)
  const posti=rosterPosti(r);
  const cap=maxOthers;                                   // max-selected NATIVO = posti totali "altri" (3 su 4)
  const picked=new Set(preChecked);
  const body=el('flow');
  body.appendChild(el('luce-hint', posti>0
    ? ('Manca'+(posti>1?'no':'')+' <b>'+posti+'</b> giocator'+(posti>1?'i':'e')+' per '+esc(r.giorno)+' alle '+r.ora+'. Spunta un amico per <b>invitarlo</b> (messaggio con <b>✅ Confermo / ❌ Non posso</b>); deseleziona un giocatore per <b>toglierlo</b>.')
    : ('Partita <b>al completo</b> per '+esc(r.giorno)+' alle '+r.ora+'. Deseleziona un giocatore per <b>toglierlo</b> o sostituirlo (la partita tornerà da completare).')));
  body.appendChild(fieldLabel('Chi gioca con te'));
  const counter=el('luce-hint','');
  function refresh(){ counter.innerHTML='Selezionati: <b>'+picked.size+'</b> / '+cap+(preChecked.length?' · deseleziona per togliere o revocare':''); }
  function toggle(cb){
    if(cb.checked){
      if(picked.size>=cap){ cb.checked=false; toast(cap===1?'C\'è posto per 1 solo giocatore.':'Puoi arrivare al massimo a '+cap+' giocatori (oltre a te). Togline uno prima.'); return; }
      picked.add(cb.dataset.nm);
    } else picked.delete(cb.dataset.nm);
    refresh();
  }
  const fl=el('friend-list');
  // 1) giocatori CONFERMATI = pre-spuntati (deseleziona = togli dal roster)
  confirmed.forEach(nm=>{
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.dataset.nm=nm; cb.onchange=()=>toggle(cb);
    const sp=document.createElement('span'); sp.innerHTML='✅ '+esc(nm)+' · <i>in partita</i>';
    row.appendChild(cb); row.appendChild(sp); fl.appendChild(row);
  });
  // 2) inviti in sospeso = pre-spuntati (deseleziona = revoca)
  pending.forEach(nm=>{
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.dataset.nm=nm; cb.onchange=()=>toggle(cb);
    const sp=document.createElement('span'); sp.innerHTML='✉️ '+esc(nm)+' · <i>in attesa</i>';
    row.appendChild(cb); row.appendChild(sp); fl.appendChild(row);
  });
  // 3) amici invitabili (+ disabilitati con motivo: non sul canale / opt-out 🔕)
  if(!avail.length && !preChecked.length){ fl.appendChild(el('luce-hint','Nessun amico ancora: aggiungine uno qui sotto 👇 — oppure lascia che sia la <b>segreteria</b> a trovare i giocatori.')); }
  avail.forEach(f=>{ const nm=f.nome.split(' ')[0];
    const enabled = f.suWhatsApp && !f.optOut;
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.nm=nm;
    if(!enabled){ cb.disabled=true; row.style.opacity='.5'; } else cb.onchange=()=>toggle(cb);
    const note = !f.suWhatsApp ? ' · <i>non ancora sul canale</i>' : (f.optOut ? ' · <i>🔕 non riceve inviti</i>' : '');
    const sp=document.createElement('span'); sp.innerHTML=esc(f.nome)+note; row.appendChild(cb); row.appendChild(sp); fl.appendChild(row); });
  body.appendChild(fl);
  refresh(); body.appendChild(counter);
  // EmbeddedLink nativo (non un bottone): esce dal Flow per condividere un contatto
  const addF=document.createElement('a'); addF.href='#'; addF.className='flow-link'; addF.textContent='➕ Aggiungi un amico';
  addF.onclick=(e)=>{ e.preventDefault(); closeSheet(); openAddFriendFlow({backTo:r.id}); };
  body.appendChild(addF);
  // Footer UNICO: applica togli (confermati deselez.) + revoche (pending deselez.) + inviti nuovi
  const b=document.createElement('button'); b.className='flow-submit'; b.textContent='Aggiorna partita';
  b.onclick=()=>{
    const removed=confirmed.filter(nm=>!picked.has(nm));                 // confermati tolti
    const revoked=pending.filter(nm=>!picked.has(nm));                   // inviti revocati
    const newInv=[...picked].filter(nm=>preChecked.indexOf(nm)<0);       // nuovi inviti
    if(!removed.length && !revoked.length && !newInv.length){ closeSheet(); toast('Nessuna modifica.'); return; }
    closeSheet();
    botSay(()=>{ const rr=S.prenotazioni.find(x=>x.id===r.id); if(!rr){ addInHtml('Prenotazione non più disponibile.'); return; }
      rr.amici=(rr.amici||[]).filter(nm=>removed.indexOf(nm)<0);
      rr.invitati=(rr.invitati||[]).filter(nm=>revoked.indexOf(nm)<0).concat(newInv);
      // Ho tolto un giocatore da una partita GIÀ completa → torna "da completare"
      // (confermata, campo tuo, responsabilità riattivata) e riparte la catena promemoria.
      if(rr.stato==='completo' && rosterPosti(rr)>0){ rr.stato='confermato'; rr._nudgeStop=false;
        scheduleNudge(rr.id, nudgeChainLen(offsetForGiorno(rr.giorno)||0)); }
      save();
      const lines=[];
      if(newInv.length) lines.push('📨 Invito inviato a <b>'+newInv.join(', ')+'</b>.');
      if(removed.length) lines.push('➖ <b>'+removed.join(', ')+'</b> '+(removed.length>1?'tolti':'tolto')+' dalla partita.');
      if(revoked.length) lines.push('↩️ Invito <b>revocato</b> a <b>'+revoked.join(', ')+'</b> — se '+(revoked.length>1?'rispondono':'risponde')+', diremo che il posto non è più disponibile.');
      lines.push('👥 Sei a <b>'+rosterFilled(rr)+'/'+rosterTarget(rr)+'</b>'+(rosterPending(rr)?(' · in attesa: '+rr.invitati.join(', ')):''));
      addInHtml(lines.join('<br>'),true);
      rosterActionButtons(rr);
      if(newInv.length) sendInvites(rr, newInv); });
  };
  body.appendChild(b);
  openSheet('Gestisci i giocatori', body, r.giorno+' · '+r.ora);
}
/* (Vecchio cluster promemoria a scadenza rimosso: ora la catena "check-in aereo"
   vive in scheduleNudge/rosterNudge sopra, senza auto-rilascio.) */
/* Invito amici — WhatsApp reale: a ciascun amico un TEMPLATE utility con 3 bottoni
   ✅ Confermo / ❌ Non posso / 🔕 Non invitarmi più (l'amico è fuori dalla finestra 24h →
   serve il template; al tap si apre la SUA finestra 24h). Il 3° bottone = opt-out (igiene
   Meta: rispettare chi non vuole più inviti evita segnalazioni spam). ≤3 bottoni = ok WA.
   Qui simulato. Modello B: il posto si riempie SOLO quando l'amico CONFERMA. */
function sendInvites(rec, names){
  addSys('📨 Inviato l’invito a '+names.join(', ')+' (messaggio con ✅ Confermo / ❌ Non posso / 🔕 Non invitarmi più) — ti avviso appena rispondono.');
  names.forEach((nm,i)=>{
    setTimeout(()=>{ const r=S.prenotazioni.find(x=>x.id===rec.id); if(!r || r.stato==='completo') return;   // le risposte arrivano finché la partita non è al completo
      if((r.invitati||[]).indexOf(nm)<0) return;   // invito già risolto/annullato
      botSay(()=>inviteResponse(r,nm)); }, 4000+i*3000);
  });
}
function inviteResponse(r,nm){
  const declina=/Paolo/.test(nm);                  // demo: Paolo rifiuta (❌ Non posso)
  const optOut=/Davide/.test(nm);                  // demo: Davide fa opt-out (🔕 Non invitarmi più)
  r.invitati=(r.invitati||[]).filter(x=>x!==nm);
  if(declina){ save(); addInHtml('❌ <b>'+esc(nm)+'</b> non può per '+esc(r.giorno)+' alle '+r.ora+'. Invita qualcun altro.'); rosterActionButtons(r); return; }
  if(optOut){ const fr=S.friends.find(f=>f.nome.split(' ')[0]===nm); if(fr) fr.optOut=true; save();
    addInHtml('🔕 <b>'+esc(nm)+'</b> ha scelto di <b>non ricevere più inviti</b>. Rispettiamo la sua scelta: non gli manderemo altre richieste. Invita pure qualcun altro.'); rosterActionButtons(r); return; }
  r.amici=(r.amici||[]).concat(nm); save();
  if(rosterPosti(r)===0){ confirmBooking(r); return; }
  const tail=rosterPending(r)?(' · in attesa: '+r.invitati.join(', ')):(' · manca'+(rosterPosti(r)>1?'no':'')+' '+rosterPosti(r));
  addInHtml('✅ <b>'+esc(nm)+'</b> ha confermato! Ora siete <b>'+rosterFilled(r)+'/'+rosterTarget(r)+'</b>'+tail+'.',true);
  rosterActionButtons(r);
}
/* Concierge: la segreteria organizza la partita (+5 € sulla quota di chi prenota per primo, in segreteria). */
function decideConcierge(draft){
  const off=offsetForGiorno(draft.giorno); const fine=addMin(draft.ora,draft.durata);
  const meta=off!=null?slotMetaFor(off,draft.dow,draft.ora,draft.durata,draft.players):null;
  if(meta && meta.status==='busy'){ addInHtml('A quell\'ora è tutto occupato. Scegli un altro orario. 👇'); openBookingFlow({concierge:true,giorno:draft.giorno}); return; }
  const pr=slotPrezzo(meta,draft.players); const campo=campoLibero(draft.dow,draft.ora);
  draft.campo=campo; draft.fine=fine; draft.target=pr.giocatori;
  addInHtml('Ci pensiamo noi 💪 Ecco il riepilogo:');
  addCard('🧑‍💼 <b>Organizza la partita</b>'
    +'<br>📅 '+esc(draft.giorno)+' · '+draft.ora+'–'+fine
    +'<br>📍 Campo '+campo+' · Partita ('+draft.durata+"')"
    +'<br>💶 <b>'+pr.testa+' € a testa</b>'
    +'<br>👥 Ai giocatori pensiamo noi'
    +'<br>'+FEE_LINE);
  addQuick([
    {label:'✅ Organizzate voi',action:()=>{ addOut('Sì, organizzate voi');   /* ≤20 char (reply-button) */ botSay(()=>askMatchMix(mix=>commitConcierge(draft,mix))); }},
    {label:'Annulla',action:()=>botSay(()=>{ addInHtml('Nessun problema, richiesta annullata.'); homeMenu(); })}
  ]);
}
function commitConcierge(draft,mix){
  const rec={id:++S.seq,giorno:draft.giorno,ora:draft.ora,campo:draft.campo,tipo:draft.tipo,durata:draft.durata,
    target:draft.target||4, amici:[], concierge:true, mix:mix, stato:'confermato'};
  S.prenotazioni.push(rec); save();
  addInHtml('🧑‍💼 <b>Richiesta ricevuta!</b>'
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora+' · partita '+mixPhrase(mix)
    +'<br>Campo prenotato a tuo nome. Cerchiamo i giocatori e <b>ti avvisiamo appena è al completo</b>.'
    +'<br>'+FEE_LINE,true);
  setTimeout(()=>{ const r=S.prenotazioni.find(x=>x.id===rec.id); if(!r||r.stato==='completo') return;
    botSay(()=>{ const nomi=fillerNames(r.mix, rosterPosti(r)); r.amici=(r.amici||[]).concat(nomi); save();
      confirmBooking(r,'🧑‍💼 Partita completata dalla segreteria · +'+CONCIERGE_FEE+' € da pagare in segreteria'); });
  }, 6000);
}

/* ---------- Annulla / Modifica --------------------------------------------- */
function startCancel(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da annullare.'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  // LIST MESSAGE (non reply-button): le righe "giorno · ora / Campo N · tipo" superano
  // i 20 char dei reply-button e possono essere >3 → fedele = lista (titolo ≤24, ≤10 righe).
  addListMessage({ body:'Quale prenotazione vuoi annullare? 👇', button:'Apri', title:'Annulla una prenotazione',
    rows: S.prenotazioni.slice(0,9).map(p=>({section:'Le mie prenotazioni', ic:'🗑️', label:p.giorno+' · '+p.ora, desc:'Campo '+p.campo+' · '+p.tipo, action:()=>botSay(()=>startCancelOne(p))})).concat([menuBackRow()]) });
}
function cancelStep(t){
  const d=convo.draft;
  if(convo.step==='pick'){ const p=matchPren(t); if(!p){ addInHtml('Non ho individuato la prenotazione. Riprova indicando il giorno.'); return; }
    d.target=p; convo.step='confirm';
    const warn = conciergeCancelNote(p);
    addInHtml('Vuoi annullare: '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+' · '+p.tipo+'?'+cancelWarn()+warn);
    addQuick([{label:'Sì, annulla',text:'sì',danger:true},{label:'No',text:'no'}]); return; }
  if(convo.step==='confirm'){
    if(/^s[iì]|conferm|annulla/.test(t.toLowerCase())){ const p=d.target; S.prenotazioni=S.prenotazioni.filter(x=>x.id!==p.id); save();
      addInHtml('Fatto. Campo '+p.campo+' di '+esc(p.giorno)+' alle '+p.ora+' liberato. Non hai perso nulla.',true); maybeHint(); homeMenu(); }
    else { addInHtml('Ok, non annullo nulla.'); homeMenu(); }
    resetConvo();
  }
}
function startModify(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da modificare.'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  // LIST MESSAGE (non reply-button): stesso motivo di startCancel (>20 char / >3 voci).
  // Ogni scelta riapre il MODULO in edit-mode (come showBookingDetail / le opzioni).
  addListMessage({ body:'Quale prenotazione vuoi modificare? 👇', button:'Apri', title:'Modifica una prenotazione',
    rows: S.prenotazioni.slice(0,9).map(p=>({section:'Le mie prenotazioni', ic:'✏️', label:p.giorno+' · '+p.ora, desc:'Campo '+p.campo+' · '+p.tipo, action:()=>botSay(()=>addFlowLaunch('Riapriamo il modulo — scegli di nuovo giorno e orario. 👇', ()=>openBookingFlow({editId:p.id, giorno:p.giorno, ora:p.ora})))})).concat([menuBackRow()]) });
}
function matchPren(t){
  t=t.toLowerCase(); const byId=t.match(/\b(\d{1,4})\b/); if(byId){ const p=S.prenotazioni.find(x=>x.id===parseInt(byId[1],10)); if(p) return p; }
  if(/sabato|sab/.test(t)) return S.prenotazioni.find(p=>/sab/i.test(p.giorno));
  if(/marted|mar/.test(t)) return S.prenotazioni.find(p=>/mar/i.test(p.giorno));
  return S.prenotazioni[0];
}

  chat.innerHTML=''; closeSheet(); resetConvo();
  { const bt=document.getElementById('buildTag'); if(bt) bt.textContent=APP_BUILD; }
  try{ console.log('Emulatore Padel Village — build', APP_BUILD); }catch(e){}
  hideCmdPop(); _hintN=0;
  addSys('Suggerimento: digita "/" per i comandi rapidi in ogni momento');
  botSay(()=>{
    // Riconoscimento del numero = IMPLICITO nel saluto per nome (su WhatsApp il
    // business non mostra una banda: sa già chi gli scrive). Niente più banda fissa.
    addInHtml('Ciao '+esc(S.player.nome.split(' ')[0])+', hai contattato la segreteria di Padel Village. Come possiamo aiutarti? Tocca una voce qui sotto o scrivici pure.');
    showIceBreakers();
  },500);
}
/* Composer stile WhatsApp/staff: la freccia d'INVIO ↑ appare solo quando c'è testo
   (dopo aver scritto o dettato); il mic 🎤 resta sempre visibile alla sua sinistra. */
function toggleComposer(){ const send=document.getElementById('send'); if(!send) return; send.style.display=(field.value&&field.value.trim())?'':'none'; }
document.getElementById('bar').addEventListener('submit',e=>{ e.preventDefault(); const f=document.getElementById('field'); const v=f.value.trim(); hideCmdPop(); if(!v) return; f.value=''; sendUser(v); toggleComposer(); });
field.addEventListener('input',()=>{ const v=field.value; if(v.charAt(0)==='/') showCmdPop(v.trim()); else hideCmdPop(); toggleComposer(); });
document.getElementById('resetBtn').addEventListener('click',()=>{ resetDemo(); boot(); });
document.getElementById('emojiBtn').addEventListener('click',()=>toast('Solo demo 🙂'));
document.getElementById('clipBtn').addEventListener('click',()=>toast('Allegati: solo demo'));
/* 🎤 Dettatura vocale (Web Speech API, it-IT). COMODITÀ EMULATORE, non componente
   WhatsApp: sul prodotto reale la dettatura la fa il microfono della TASTIERA del
   telefono. Anti-duplicazione mobile: i segmenti finali che "crescono" sostituiscono
   l'ultimo invece di accodarsi (bug Android/iOS). Riempie #field e simula 'input'
   così il popup dei comandi "/" reagisce. */
(function(){
  const micBtn=document.getElementById('micBtn'); if(!micBtn) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null, dictating=false;
  function stopUI(){ dictating=false; micBtn.classList.remove('recording'); }
  micBtn.addEventListener('click',()=>{
    if(!SR){ toast('🎤 Dettatura non supportata da questo browser'); return; }
    if(dictating){ try{rec&&rec.stop();}catch(e){} stopUI(); return; }
    const base=field.value?field.value.replace(/\s+$/,'')+' ':'';
    try{rec&&rec.abort();}catch(e){}
    rec=new SR(); rec.lang='it-IT';
    const isMobile=(typeof window.matchMedia==='function')&&window.matchMedia('(max-width:899px)').matches;
    rec.continuous=!isMobile; rec.interimResults=true;
    rec.onresult=function(e){
      const finalParts=[]; let interim='';
      for(let i=0;i<e.results.length;i++){ const seg=e.results[i][0].transcript;
        if(e.results[i].isFinal){ const t=seg.trim(); const last=finalParts.length?finalParts[finalParts.length-1]:'';
          if(last&&t.toLowerCase().indexOf(last.toLowerCase())===0) finalParts[finalParts.length-1]=t; else if(t) finalParts.push(t);
        } else interim+=seg;
      }
      const finalTr=finalParts.join(' ');
      field.value=(base+finalTr+(interim?(finalTr?' ':'')+interim:'')).replace(/\s{2,}/g,' ');
      field.dispatchEvent(new Event('input'));
    };
    rec.onerror=function(){ stopUI(); };
    rec.onend=function(){ stopUI(); };
    try{ rec.start(); dictating=true; micBtn.classList.add('recording'); field.focus(); }catch(e){ stopUI(); }
  });
})();
toggleComposer();   // stato iniziale: campo vuoto → freccia d'invio nascosta, solo il mic
boot();
