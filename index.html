<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emulatore chat giocatori — Padel Village</title>
<style>
  :root{--ink:#111b21;--muted:#667781;--wa-green:#128C7E;--wa-bg:#ECE5DD}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0b141a;color:var(--ink);display:flex;justify-content:center}
  .app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;background:var(--wa-bg);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:520px){
    body{align-items:center;background:#111b21}
    .app{height:92vh;max-height:900px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  }
  /* Header */
  .head{background:var(--wa-green);display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;flex:0 0 auto;z-index:5}
  .head .back{font-size:20px;line-height:1;opacity:.9}
  .av{width:36px;height:36px;border-radius:50%;background:#0c5f57;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .hname{font-size:15px;font-weight:600;line-height:1.15}
  .hstatus{font-size:11px;opacity:.85}
  .head .spacer{flex:1}
  .head .reset{font-size:12px;background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 9px;border-radius:14px;cursor:pointer}
  /* Identity band */
  .band{background:#d6e7d2;color:#3a5a40;font-size:12px;text-align:center;padding:6px 12px;flex:0 0 auto}
  /* Chat */
  .chat{flex:1 1 auto;overflow-y:auto;padding:12px 10px 14px;display:flex;flex-direction:column;gap:8px}
  .sys{align-self:center;background:#d6e7d2;color:#3a5a40;font-size:11px;padding:4px 12px;border-radius:10px;text-align:center;max-width:92%}
  .in,.out{max-width:82%;padding:7px 10px 5px;border-radius:9px;font-size:14px;line-height:1.44;position:relative;white-space:pre-wrap;word-wrap:break-word}
  .in{align-self:flex-start;background:#fff;border-top-left-radius:2px}
  .out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
  .meta{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:3px}
  .tick{color:#34b7f1}
  .card{background:#fff;align-self:flex-start;max-width:86%;border-radius:9px;border-top-left-radius:2px;padding:9px 11px;
    font-size:13.5px;line-height:1.6;border-left:3px solid var(--wa-green)}
  /* Reply buttons (stile WhatsApp) */
  .qr{align-self:flex-start;width:min(86%,320px);background:#fff;border-radius:9px;overflow:hidden;margin-top:-2px;
    box-shadow:0 1px 1px rgba(0,0,0,.06);display:flex;flex-direction:column;flex:0 0 auto}
  .qbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:14px;color:#027eb5;
    border-top:1px solid #eff2f3;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:inherit}
  .qr .qbtn:first-child{border-top:0}
  .qbtn.danger{color:#c0392b}
  .qbtn:active{background:#f2f5f6}
  /* Menu a lista (list message) */
  .menu{align-self:flex-start;width:min(92%,340px);background:#fff;border-radius:9px;border-top-left-radius:2px;overflow:hidden;
    box-shadow:0 1px 1px rgba(0,0,0,.06);flex:0 0 auto}
  .menu-head{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px 3px;font-weight:600}
  .menu-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #f0f3f4;cursor:pointer}
  .menu-row:active{background:#f4f7f8}
  .menu-ic{width:24px;text-align:center;font-size:16px}
  .menu-lb{flex:1;font-size:14px;color:var(--ink)}
  .menu-ch{color:#c3cbcf;font-size:18px}
  /* Typing */
  .typing{align-self:flex-start;background:#fff;border-radius:9px;border-top-left-radius:2px;padding:10px 12px;display:inline-flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b5c0c4;display:inline-block;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  /* Nota demo */
  .demo-note{flex:0 0 auto;background:#fff4d6;color:#8a6d00;font-size:11.5px;text-align:center;padding:6px 12px;border-top:1px solid #f0e3b0}
  /* Input */
  .bar{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--wa-bg);flex:0 0 auto}
  .ic-btn{background:none;border:0;font-size:20px;cursor:pointer;color:#54656f;flex:0 0 auto;padding:4px}
  .field{flex:1;background:#fff;border-radius:20px;padding:10px 14px;font-size:15px;border:0;outline:0;font-family:inherit;color:var(--ink)}
  .send{width:42px;height:42px;border-radius:50%;background:var(--wa-green);border:0;color:#fff;font-size:19px;cursor:pointer;flex:0 0 auto}
  .send:active{background:#0c5f57}
  /* Bottom sheet (simulazione WhatsApp Flow / schermate) */
  .sheet-ov{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;z-index:20}
  .sheet-ov.show{opacity:1}
  .sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .25s;padding-bottom:16px}
  .sheet.show{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #eef1f2;display:flex;align-items:flex-start;z-index:2}
  .sheet-handle{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#d5dbdd}
  .sheet-title{font-size:16px;font-weight:600;color:var(--ink);flex:1}
  .sheet-sub{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
  .sheet-x{background:none;border:0;font-size:16px;color:var(--muted);cursor:pointer}
  .flow-lb{font-size:12.5px;font-weight:600;color:var(--wa-green);padding:13px 14px 3px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:3px 14px 4px}
  .chip{border:1px solid #cdd6d9;background:#fff;color:var(--ink);border-radius:16px;padding:8px 13px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .chip.sel{background:var(--wa-green);border-color:var(--wa-green);color:#fff}
  .flow-inp{width:calc(100% - 28px);margin:3px 14px 4px;background:#f3f6f7;border:1px solid #e2e8ea;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:0}
  .friend-list{padding:2px 14px}
  .friend-row{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:14px;border-bottom:1px solid #f2f5f6;cursor:pointer}
  .friend-row input{width:19px;height:19px;flex:0 0 auto}
  .flow-submit{margin:16px 14px 4px;width:calc(100% - 28px);background:var(--wa-green);color:#fff;border:0;border-radius:22px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .toast{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;font-size:13px;padding:9px 15px;border-radius:20px;z-index:30;max-width:80%;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <span class="back">‹</span>
    <div class="av">PV</div>
    <div><div class="hname">Padel Village</div><div class="hstatus" id="hstatus">online</div></div>
    <div class="spacer"></div>
    <button class="reset" id="resetBtn" title="Ripristina demo">⟳ demo</button>
  </div>
  <div class="band" id="band">✓ Numero riconosciuto: …</div>
  <div class="chat" id="chat"></div>
  <div class="demo-note">🔒 Modalità demo — nessuna prenotazione reale</div>
  <form class="bar" id="bar" autocomplete="off">
    <button type="button" class="ic-btn" id="emojiBtn">😊</button>
    <input class="field" id="field" placeholder="Messaggio" autocomplete="off">
    <button type="button" class="ic-btn" id="clipBtn">📎</button>
    <button class="send" id="send" type="submit">↑</button>
  </form>
</div>

<script>
/* ============================================================================
   EMULATORE CHAT GIOCATORI — Padel Village · Fase B (mockup-first)
   100% self-contained: nessuna chiamata reale, nessuna scrittura in Matchpoint.
   Simula i tipi di messaggio WhatsApp (bolle, pulsanti di risposta, menu a
   lista) e i "WhatsApp Flows" (moduli a scomparsa dal basso). Backend FINTO
   in localStorage. Vedi 01-analisi-operativita-chat-giocatori.md
   ========================================================================== */
const LS_KEY='pmo_emu_state_v2';

/* --- Dati demo ------------------------------------------------------------- */
function demoState(){
  return {
    player:{ nome:'Marco Aprea', numero:'+39 333 123 4567', socio:true, livello:'4.0', inRegola:true,
             borselloCent:2400, ultimoMov:'ricarica € 20 il 28/06' },
    friends:[
      {id:11,nome:'Luca Bianchi',livello:'3.5'},
      {id:12,nome:'Sara Rossi',livello:'4.0'},
      {id:13,nome:'Giulia Verdi',livello:'3.0'},
      {id:14,nome:'Paolo Neri',livello:'4.5'}
    ],
    prenotazioni:[
      { id:1, giorno:'Mar 01/07', ora:'19:00', campo:3, tipo:'Partita', durata:90 },
      { id:2, giorno:'Sab 05/07', ora:'10:00', campo:1, tipo:'Partita', durata:90 }
    ],
    seq:100
  };
}
let S=load();
function load(){ try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):demoState();}catch(e){return demoState();} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
function resetDemo(){ S=demoState(); save(); }

let convo={mode:'idle',step:null,draft:{}};
function resetConvo(){ convo={mode:'idle',step:null,draft:{}}; }

/* --- DOM utility ----------------------------------------------------------- */
const chat=document.getElementById('chat');
const appEl=document.querySelector('.app');
function now(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function scrollDown(){ chat.scrollTop=chat.scrollHeight; }
function el(cls,html){ const e=document.createElement('div'); e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addSys(t){ chat.appendChild(el('sys',t)); scrollDown(); }
function addOut(t){ chat.appendChild(el('out', esc(t)+'<span class="meta">'+now()+'</span>')); scrollDown(); }
function addInHtml(html,ticks){ const e=el('in', html+'<span class="meta">'+now()+(ticks?' <span class="tick">✓✓</span>':'')+'</span>'); chat.appendChild(e); scrollDown(); return e; }
function addCard(html){ chat.appendChild(el('card',html)); scrollDown(); }
function addQuick(btns){
  const wrap=el('qr');
  btns.forEach(b=>{ const btn=document.createElement('button'); btn.className='qbtn'+(b.danger?' danger':''); btn.textContent=b.label;
    btn.onclick=()=>{ wrap.remove(); if(b.action) b.action(); else sendUser(b.text!=null?b.text:b.label,b.silent); };
    wrap.appendChild(btn); });
  chat.appendChild(wrap); scrollDown();
}
function addMenu(rows){
  const m=el('menu'); let cur=null;
  rows.forEach(r=>{
    if(r.section && r.section!==cur){ cur=r.section; const h=el('menu-head'); h.textContent=r.section; m.appendChild(h); }
    const row=el('menu-row','<span class="menu-ic">'+(r.ic||'•')+'</span><span class="menu-lb">'+esc(r.label)+'</span><span class="menu-ch">›</span>');
    row.onclick=()=>{ if(r.action) r.action(); else sendUser(r.text!=null?r.text:r.label); };
    m.appendChild(row);
  });
  chat.appendChild(m); scrollDown();
}
function botSay(fn,delay){
  const t=el('typing','<i></i><i></i><i></i>'); chat.appendChild(t); scrollDown();
  const st=document.getElementById('hstatus'); st.textContent='sta scrivendo…';
  setTimeout(()=>{ t.remove(); st.textContent='online'; fn(); }, delay||620);
}
function toast(msg){ const t=el('toast',esc(msg)); appEl.appendChild(t); setTimeout(()=>t.remove(),1700); }

/* --- Bottom sheet (simula WhatsApp Flow / schermate) ----------------------- */
function openSheet(title,bodyNode,subtitle){
  closeSheet();
  const ov=el('sheet-ov'); ov.id='sheetOv';
  const sh=el('sheet');
  const head=el('sheet-head','<div class="sheet-handle"></div><div class="sheet-title">'+esc(title)+(subtitle?'<div class="sheet-sub">'+esc(subtitle)+'</div>':'')+'</div><button class="sheet-x" id="sheetX">✕</button>');
  sh.appendChild(head); sh.appendChild(bodyNode); ov.appendChild(sh); appEl.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) closeSheet(); };
  requestAnimationFrame(()=>{ ov.classList.add('show'); sh.classList.add('show'); });
  document.getElementById('sheetX').onclick=closeSheet;
}
function closeSheet(){ const ov=document.getElementById('sheetOv'); if(ov) ov.remove(); }
function fieldLabel(t){ const d=el('flow-lb'); d.textContent=t; return d; }
function chipRow(items,onPick){
  const row=el('chips');
  items.forEach(it=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=it.label; b.dataset.val=it.val;
    b.onclick=()=>onPick(it.val,b,row); row.appendChild(b); });
  return row;
}
function selectOne(row,btn){ Array.from(row.children).forEach(c=>c.classList.remove('sel')); btn.classList.add('sel'); }
function preselectChip(row,val){ Array.from(row.children).forEach(c=>{ if(String(c.dataset.val)===String(val)) c.classList.add('sel'); }); }

/* --- Dominio --------------------------------------------------------------- */
function euro(cent){ return '€ '+(cent/100).toFixed(2).replace('.',','); }
function durataDefault(tipo){ return tipo==='Lezione'?60:90; }
function lbl(d){ return ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function dateFromOffset(off){ const d=new Date(); d.setDate(d.getDate()+off); return {giorno:lbl(d),dow:d.getDay()}; }
function addMin(hhmm,min){ const [h,m]=hhmm.split(':').map(Number); const tot=h*60+m+min; return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0'); }
const TIMES=['18:00','18:30','19:00','19:30','20:00','20:30','21:00'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
function parseWhen(txt){
  const t=txt.toLowerCase(); const base=new Date(); let target=null;
  if(/\boggi\b/.test(t)) target=new Date(base);
  else if(/\bdomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+1); }
  else if(/\bdopodomani\b/.test(t)){ target=new Date(base); target.setDate(base.getDate()+2); }
  else for(let i=0;i<7;i++){ if(t.includes(GIORNI[i])){ target=new Date(base); let diff=(i-base.getDay()+7)%7; if(diff===0) diff=7; target.setDate(base.getDate()+diff); break; } }
  let ora=null; const m=t.match(/(?:alle|ore)?\s*\b([01]?\d|2[0-3])(?:[:.](\d{2}))?\b/);
  if(m){ ora=m[1].padStart(2,'0')+':'+(m[2]||'00'); }
  return { date:!!target, giorno: target?lbl(target):null, dow: target?target.getDay():null, ora };
}
function parseTipo(txt){ const t=txt.toLowerCase(); if(t.includes('lezione'))return 'Lezione'; if(t.includes('partita'))return 'Partita'; return null; }
function parseDurata(txt){ const m=txt.toLowerCase().match(/(\d{2,3})\s*(?:min|minuti|')/); return m?parseInt(m[1],10):null; }
function inRegola(){ return S.player.socio && S.player.inRegola && S.player.borselloCent>=0; }
function isCritica(dow,ora){ if(dow===0){ const h=parseInt((ora||'12').split(':')[0],10); if(h<13) return true; } return false; }
function campoLibero(dow,ora){ if(isCritica(dow,ora)) return null; const pool=[3,2,4,1]; return pool[(parseInt((ora||'0').replace(':',''),10))%pool.length]; }
function friendName(id){ const f=S.friends.find(x=>x.id===id); return f?f.nome.split(' ')[0]:''; }

/* ============================ INTENT ROUTING =============================== */
function detectIntent(t){
  t=t.toLowerCase();
  if(/profil|i miei dati|chi sono/.test(t)) return 'profilo';
  if(/amic|con cui gioc|lista giocator/.test(t)) return 'amici';
  if(/borsell|saldo|credito|monedero|portafogl/.test(t)) return 'borsellino';
  if(/disponibil|liber|che campi|quali campi|posti/.test(t)) return 'disponibilita';
  if(/cosa ho|mie prenotaz|le mie|prenotazioni/.test(t)) return 'mie';
  if(/annull|disdet|cancell/.test(t)) return 'annulla';
  if(/modific|spost|cambia orario/.test(t)) return 'modifica';
  if(/prenot|campo|partita|lezione|gioc/.test(t)) return 'prenota';
  if(/ciao|salve|buongiorno|buonasera|ehi|hey|menu/.test(t)) return 'saluto';
  return 'fallback';
}
function sendUser(text,silent){
  if(!silent) addOut(text);
  const t=text.trim(); if(!t) return;
  if(convo.mode==='cancel') return botSay(()=>cancelStep(t));
  if(convo.mode==='modify') return botSay(()=>modifyStep(t));
  botSay(()=>route(detectIntent(t),t));
}
function route(intent,t){
  switch(intent){
    case 'saluto': addInHtml('Ciao '+esc(S.player.nome.split(' ')[0])+', come possiamo aiutarti? Ecco cosa possiamo fare:'); showMenu(); break;
    case 'profilo': doProfilo(); break;
    case 'amici': doAmici(); break;
    case 'borsellino': doBorsellino(); break;
    case 'disponibilita': doDisponibilita(t); break;
    case 'mie': doMie(); break;
    case 'annulla': startCancel(); break;
    case 'modifica': startModify(); break;
    case 'prenota': startBooking(t); break;
    default: addInHtml('Scusa, non abbiamo capito bene. Ecco cosa possiamo fare:'); showMenu();
  }
}
function showMenu(){
  addMenu([
    {section:'Prenotazioni', ic:'🎾', label:'Prenota un campo', text:'Vorrei prenotare un campo'},
    {section:'Prenotazioni', ic:'🔍', label:'Disponibilità campi', text:'Che campi liberi ci sono domani sera?'},
    {section:'Prenotazioni', ic:'📅', label:'Le mie prenotazioni', text:'Cosa ho prenotato?'},
    {section:'Account', ic:'👤', label:'Il mio profilo', text:'Il mio profilo'},
    {section:'Account', ic:'👥', label:'I miei amici', text:'I miei amici'},
    {section:'Account', ic:'💶', label:'Il mio borsellino', text:'Saldo borsellino'}
  ]);
}

/* ---------- Profilo -------------------------------------------------------- */
function doProfilo(){
  addInHtml('Ecco il tuo profilo:');
  addCard('<b>'+esc(S.player.nome)+'</b> <span style="background:#d6e7d2;color:#3a5a40;font-size:10.5px;padding:1px 7px;border-radius:8px">socio</span>'
    +'<br>📱 '+esc(S.player.numero)+'<br>🎾 Livello '+esc(S.player.livello)+'<br>💶 Borsellino '+euro(S.player.borselloCent));
  addQuick([{label:'I miei amici',text:'I miei amici'},{label:'Il mio borsellino',text:'Saldo borsellino'}]);
}

/* ---------- Amici ---------------------------------------------------------- */
function doAmici(){
  addInHtml('I tuoi amici con cui giochi:');
  addCard(S.friends.length ? S.friends.map(f=>'👤 '+esc(f.nome)+' · liv. '+esc(f.livello)).join('<br>') : 'Ancora nessun amico in lista.');
  addQuick([{label:'➕ Aggiungi amico',action:openAddFriendFlow},{label:'🎾 Prenota con un amico',action:()=>botSay(()=>{ addInHtml('Apriamo il modulo — trovi gli amici in fondo, spunta chi gioca con te.'); openBookingFlow({}); })}]);
}
function openAddFriendFlow(){
  const body=el('flow');
  body.appendChild(fieldLabel('Nome amico'));
  const inp=document.createElement('input'); inp.className='flow-inp'; inp.placeholder='Es. Andrea Gialli'; body.appendChild(inp);
  body.appendChild(fieldLabel('Livello'));
  let liv='3.5';
  const row=chipRow(['3.0','3.5','4.0','4.5'].map(v=>({label:v,val:v})),(val,btn,r)=>{ selectOne(r,btn); liv=val; });
  body.appendChild(row);
  const b=document.createElement('button'); b.className='flow-submit'; b.textContent='Aggiungi amico';
  b.onclick=()=>{ const nome=inp.value.trim(); if(!nome){ toast('Scrivi il nome.'); return; }
    S.friends.push({id:++S.seq,nome,livello:liv}); save(); closeSheet();
    botSay(()=>addInHtml('Aggiunto! <b>'+esc(nome)+'</b> è ora tra i tuoi amici.',true)); };
  body.appendChild(b);
  openSheet('Aggiungi amico', body, 'Solo demo — nessun invito reale');
  preselectChip(row,'3.5');
}

/* ---------- Borsellino ----------------------------------------------------- */
function doBorsellino(){ addInHtml('Il tuo borsellino: <b>'+euro(S.player.borselloCent)+'</b>.<br>Ultimo movimento: '+esc(S.player.ultimoMov)+'.'); }

/* ---------- Disponibilità -------------------------------------------------- */
function doDisponibilita(t){
  const w=parseWhen(t); const giorno=w.giorno||'Domani';
  addInHtml(esc(giorno)+', fascia 18–21:<br>· Campo 1 — 18:00, 20:30<br>· Campo 2 — 19:00<br>· Campo 4 — 18:30, 20:00');
  addQuick([{label:'Prenota Campo 2 · 19:00',action:()=>botSay(()=>{ addInHtml('Apriamo il modulo con Campo 2 alle 19:00.'); openBookingFlow({giorno:w.giorno,dow:w.dow,ora:'19:00'}); })},{label:'Apri il modulo',action:()=>botSay(()=>openBookingFlow({giorno:w.giorno,dow:w.dow}))}]);
}

/* ---------- Le mie prenotazioni -------------------------------------------- */
function doMie(){
  if(!S.prenotazioni.length){ addInHtml('Al momento non hai prenotazioni future. Vuoi prenotare un campo?'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}]); return; }
  addInHtml('Le tue prossime prenotazioni:');
  addCard(S.prenotazioni.map(p=>'· '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+' · '+p.tipo+(p.amici&&p.amici.length?(' · con '+p.amici.join(', ')):'')).join('<br>'));
  addQuick([{label:'Annulla',action:startCancel},{label:'Modifica',action:startModify}]);
}

/* ---------- Prenotazione: WhatsApp Flow (modulo) --------------------------- */
function startBooking(text){
  const w=parseWhen(text), dur=parseDurata(text);
  if(w.date && w.ora){ return decideAndPresent({giorno:w.giorno,dow:w.dow,ora:w.ora,tipo:'Partita',durata:dur||90,amici:[]}); }
  addInHtml('Ti apriamo il modulo di prenotazione — compila e invia. 👇');
  openBookingFlow({giorno:w.giorno,dow:w.dow,ora:w.ora,durata:dur});
}
function openBookingFlow(prefill){
  prefill=prefill||{};
  const st={ giorno:prefill.giorno||null, dow:(prefill.dow!=null?prefill.dow:null), ora:prefill.ora||null, tipo:'Partita', durata:prefill.durata||90, amici:[] };
  const body=el('flow');
  // Quando
  body.appendChild(fieldLabel('Quando'));
  const dayRow=chipRow([['Oggi',0],['Domani',1],['Dopodomani',2]].map(d=>({label:d[0],val:d[1]})),(val,btn,r)=>{ selectOne(r,btn); const info=dateFromOffset(val); st.giorno=info.giorno; st.dow=info.dow; });
  body.appendChild(dayRow);
  // Ora
  body.appendChild(fieldLabel('Ora'));
  const timeRow=chipRow(TIMES.map(t=>({label:t,val:t})),(val,btn,r)=>{ selectOne(r,btn); st.ora=val; });
  body.appendChild(timeRow);
  // Durata (solo partite: le lezioni non si prenotano da qui)
  body.appendChild(fieldLabel('Durata'));
  const durRow=chipRow([{label:"60'",val:60},{label:"90'",val:90},{label:"120'",val:120}],(val,btn,r)=>{ selectOne(r,btn); st.durata=val; });
  body.appendChild(durRow);
  // Amici
  if(S.friends.length){
    body.appendChild(fieldLabel('Con chi giochi? (facoltativo)'));
    const fl=el('friend-list');
    S.friends.forEach(f=>{ const row=document.createElement('label'); row.className='friend-row';
      const cb=document.createElement('input'); cb.type='checkbox';
      cb.onchange=()=>{ if(cb.checked) st.amici.push(f.id); else st.amici=st.amici.filter(x=>x!==f.id); };
      const sp=document.createElement('span'); sp.textContent=f.nome+' · liv. '+f.livello;
      row.appendChild(cb); row.appendChild(sp); fl.appendChild(row); });
    body.appendChild(fl);
  }
  // Submit
  const foot=document.createElement('button'); foot.className='flow-submit'; foot.textContent='Continua';
  foot.onclick=()=>{
    if(!st.giorno||!st.ora){ toast('Scegli giorno e ora.'); return; }
    if(!st.durata) st.durata=90;
    closeSheet();
    const names=st.amici.map(friendName).filter(Boolean);
    addOut('📋 '+st.giorno+' · '+st.ora+' · '+st.tipo+(names.length?(' · con '+names.join(', ')):''));
    botSay(()=>decideAndPresent({giorno:st.giorno,dow:st.dow,ora:st.ora,tipo:st.tipo,durata:st.durata,amici:st.amici.slice()}));
  };
  body.appendChild(foot);
  openSheet('Prenota un campo', body, 'Compila e invia — come un modulo WhatsApp (Flow)');
  // preselect (sincrono: gli elementi sono già nel DOM)
  if(st.ora) preselectChip(timeRow,st.ora);
  preselectChip(durRow, st.durata||90);
  if(st.dow!=null){ // evidenzia Oggi/Domani/Dopodomani se combacia
    [0,1,2].forEach(o=>{ const info=dateFromOffset(o); if(info.giorno===st.giorno) preselectChip(dayRow,o); });
  }
}
function preselectAndSelect(row,val){ Array.from(row.children).forEach(c=>c.classList.remove('sel')); preselectChip(row,val); }

function decideAndPresent(draft){
  const campo=campoLibero(draft.dow,draft.ora); const fine=addMin(draft.ora,draft.durata);
  if(campo===null || !inRegola()){
    const motivo = campo===null ? 'Questa fascia è molto richiesta' : 'La tua posizione va verificata';
    addInHtml(motivo+': la controlliamo e ti confermiamo appena possibile.');
    addSys('Richiesta in verifica — ti confermiamo a breve');
    const req={giorno:draft.giorno,ora:draft.ora,campo:(campo||2),tipo:draft.tipo,durata:draft.durata,amici:draft.amici||[]};
    setTimeout(()=>botSay(()=>{
      const rec={id:++S.seq,giorno:req.giorno,ora:req.ora,campo:req.campo,tipo:req.tipo,durata:req.durata};
      const names=req.amici.map(friendName).filter(Boolean); if(names.length) rec.amici=names;
      S.prenotazioni.push(rec); save();
      addInHtml('<b>Confermato</b>! '+esc(req.giorno)+' · '+req.ora+' — Campo '+req.campo+' · '+req.tipo+(names.length?(' · con '+names.join(', ')):'')+'. A presto.',true);
    },400),4200);
    return;
  }
  draft.campo=campo; draft.fine=fine;
  const names=(draft.amici||[]).map(friendName).filter(Boolean);
  addInHtml('Abbiamo un campo libero. Confermiamo a tuo nome?');
  addCard('<b>Riepilogo</b><br>'+esc(draft.giorno)+' · '+draft.ora+'–'+fine+'<br>Campo '+campo+' · '+draft.tipo+' ('+draft.durata+"')"+(names.length?('<br>Con: '+names.join(', ')):'')+'<br>A nome di '+esc(S.player.nome));
  addQuick([
    {label:'Conferma',action:()=>{ addOut('Conferma'); botSay(()=>commitBooking(draft)); }},
    {label:'Cambia',action:()=>botSay(()=>{ addInHtml('Riapriamo il modulo.'); openBookingFlow(draft); })}
  ]);
}
function commitBooking(draft){
  const rec={id:++S.seq,giorno:draft.giorno,ora:draft.ora,campo:draft.campo,tipo:draft.tipo,durata:draft.durata};
  const names=(draft.amici||[]).map(friendName).filter(Boolean); if(names.length) rec.amici=names;
  S.prenotazioni.push(rec); save();
  addInHtml('Prenotazione <b>confermata</b>. Campo '+draft.campo+' · '+esc(draft.giorno)+' · '+draft.ora+'–'+draft.fine+' · '+draft.tipo+(names.length?(' · con '+names.join(', ')):'')+'. Ti aspettiamo.',true);
}

/* ---------- Annulla / Modifica --------------------------------------------- */
function startCancel(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da annullare.'); return; }
  convo={mode:'cancel',step:'pick',draft:{}};
  addInHtml('Quale vuoi annullare?');
  addQuick(S.prenotazioni.map(p=>({label:p.giorno+' · '+p.ora+' — Campo '+p.campo, text:'annulla '+p.id})));
}
function cancelStep(t){
  const d=convo.draft;
  if(convo.step==='pick'){ const p=matchPren(t); if(!p){ addInHtml('Non ho individuato la prenotazione. Riprova indicando il giorno.'); return; }
    d.target=p; convo.step='confirm';
    addInHtml('Vuoi annullare: '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+' · '+p.tipo+'? L’azione è definitiva.');
    addQuick([{label:'Sì, annulla',text:'sì',danger:true},{label:'No',text:'no'}]); return; }
  if(convo.step==='confirm'){
    if(/^s[iì]|conferm|annulla/.test(t.toLowerCase())){ S.prenotazioni=S.prenotazioni.filter(x=>x.id!==d.target.id); save();
      addInHtml('Fatto. Campo '+d.target.campo+' di '+esc(d.target.giorno)+' alle '+d.target.ora+' liberato.',true); }
    else addInHtml('Ok, non annullo nulla.');
    resetConvo();
  }
}
function startModify(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da modificare.'); return; }
  convo={mode:'modify',step:'pick',draft:{}};
  addInHtml('Quale prenotazione vuoi modificare?');
  addQuick(S.prenotazioni.map(p=>({label:p.giorno+' · '+p.ora+' — Campo '+p.campo, text:'modifica '+p.id})));
}
function modifyStep(t){
  const d=convo.draft;
  if(convo.step==='pick'){ const p=matchPren(t); if(!p){ addInHtml('Non ho individuato la prenotazione.'); return; }
    d.target=p; convo.step='newtime'; addInHtml('A che nuovo orario la sposto? (es. “alle 20:30”)'); return; }
  if(convo.step==='newtime'){ const w=parseWhen(t); if(!w.ora){ addInHtml('Dimmi il nuovo orario, es. “alle 20:30”.'); return; }
    const idx=S.prenotazioni.findIndex(x=>x.id===d.target.id); const old=S.prenotazioni[idx].ora;
    if(w.giorno) S.prenotazioni[idx].giorno=w.giorno; S.prenotazioni[idx].ora=w.ora; save();
    addInHtml('Aggiornata. '+esc(S.prenotazioni[idx].giorno)+' — Campo '+d.target.campo+' ora alle '+w.ora+' (prima '+old+').',true);
    resetConvo();
  }
}
function matchPren(t){
  t=t.toLowerCase(); const byId=t.match(/\b(\d{1,4})\b/); if(byId){ const p=S.prenotazioni.find(x=>x.id===parseInt(byId[1],10)); if(p) return p; }
  if(/sabato|sab/.test(t)) return S.prenotazioni.find(p=>/sab/i.test(p.giorno));
  if(/marted|mar/.test(t)) return S.prenotazioni.find(p=>/mar/i.test(p.giorno));
  return S.prenotazioni[0];
}

/* ============================ BOOTSTRAP =================================== */
function boot(){
  chat.innerHTML=''; closeSheet(); resetConvo();
  document.getElementById('band').textContent='✓ Numero riconosciuto: '+S.player.nome+' · '+(S.player.socio?'socio':'non socio');
  addSys('Emulatore · dati finti · nessuna chiamata reale');
  botSay(()=>{ addInHtml('Ciao '+esc(S.player.nome.split(' ')[0])+', hai contattato la segreteria di Padel Village. Come possiamo aiutarti? Tocca una voce qui sotto o scrivici pure.'); showMenu(); },500);
}
document.getElementById('bar').addEventListener('submit',e=>{ e.preventDefault(); const f=document.getElementById('field'); const v=f.value.trim(); if(!v) return; f.value=''; sendUser(v); });
document.getElementById('resetBtn').addEventListener('click',()=>{ resetDemo(); boot(); });
document.getElementById('emojiBtn').addEventListener('click',()=>toast('Solo demo 🙂'));
document.getElementById('clipBtn').addEventListener('click',()=>toast('Allegati: solo demo'));
boot();
</script>
