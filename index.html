/* Annulla su una prenotazione specifica (riusa cancelStep). La modifica riapre
   invece il modulo in edit-mode → openBookingFlow({editId})/applyEdit. */
function startCancelOne(p){
  convo={mode:'cancel',step:'confirm',draft:{target:p}};
  addInHtml('Vuoi annullare: '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+'?'+cancelWarn());
  addQuick([{label:'Sì, annulla',text:'sì',danger:true},{label:'No',text:'no'}]);
}
/* Nota di conferma annullo: liberando il campo non resta nulla in sospeso (nessun
   anticipo). Con la responsabilità sul campo, annullare in tempo è la scelta giusta. */
function cancelWarn(){ return '<br>L’azione è definitiva: il campo torna disponibile per altri.'; }

/* ---------- Prenotazione: WhatsApp Flow (modulo) --------------------------- */
/* Fix #3 — «mi mancano giocatori / siamo in due / da soli»: il bisogno NON deve
   evaporare. Lo riconosciamo e rispondiamo con l'anima (senza promettere l'open-match
   che non esiste ancora). */
function _lackingPlayers(t){ return /manc\w*\s+(un\s+|dei\s+|degli\s+|di\s+)?giocator|manc\w*\s+(il\s+)?quart|siamo\s+in\s+(due|2|tre|3)|da\s+sol|trovare\s+(gente|giocator|qualcun)|mi\s+manca/.test(t); }
/* Eco di ciò che ho capito PRIMA di aprire il modulo (giorno + fascia + eventuale
   «pieno→primo libero») così il giocatore si sente CAPITO, non sbattuto in un form muto. */
function bookingEcho(w, lacking, pienoMsg){
  const parts=[];
  if(pienoMsg){ parts.push(pienoMsg); }
  else if(w.giorno){ parts.push('Ok, per <b>'+esc(w.giorno)+'</b>'+(w.fascia?(' '+fasciaLabel(w.fascia)):'')+(w.ora?(' alle '+w.ora):'')+' 👍'); }
  else if(w.fascia){ parts.push('Ok, '+fasciaLabel(w.fascia)+' 👍'); }
  else { parts.push('Apriamo il modulo 🎾'); }
  parts.push('Tocca un orario libero e il campo è tuo.');
  if(lacking){ parts.push('👥 Ai giocatori pensiamo dopo: prendi il campo e <b>al quarto ci pensiamo insieme</b>.'); }
  return parts.join('<br>');
}
function startBooking(text){
  const w=parseWhen(text);
  const lacking=_lackingPlayers((text||'').toLowerCase());
  if(w.date && w.ora){ return decideAndPresent({giorno:w.giorno,dow:w.dow,ora:w.ora,tipo:'Partita',durata:90,amici:[]}); }
  // «oggi pieno → domani» detto a PAROLE (niente salto muto): se il giorno chiesto non
  // ha slot liberi, lo diciamo e apriamo sul primo giorno disponibile.
  if(w.giorno){
    const off=offsetForGiorno(w.giorno);
    if(off!=null && availSlots(off, w.dow)===0){
      let firstFree=null; for(let o=0;o<=MAX_GIORNI;o++){ const di=dayInfo(o); if(availSlots(di.off,di.dow)>0){ firstFree=di; break; } }
      const pienoMsg = firstFree
        ? ('Per <b>'+esc(w.giorno)+'</b> è tutto pieno 😕 — ti propongo il primo giorno libero: <b>'+esc(firstFree.giorno)+'</b>.')
        : ('Per <b>'+esc(w.giorno)+'</b> è tutto pieno 😕 — apri il modulo per cercare un altro giorno.');
      addFlowLaunch(bookingEcho(w, lacking, pienoMsg), ()=>openBookingFlow({giorno: firstFree?firstFree.giorno:w.giorno, ora:w.ora, fascia:w.fascia}));
      return;
    }
  }
  addFlowLaunch(bookingEcho(w, lacking, ''), ()=>openBookingFlow({giorno:w.giorno,ora:w.ora,fascia:w.fascia}));
}
function openBookingFlow(prefill){
  prefill=prefill||{};
  const editId=prefill.editId||null;                       // MODIFICA: rifai il giro sul modulo e AGGIORNA la prenotazione esistente
  const days=[]; for(let o=0;o<=MAX_GIORNI;o++) days.push(dayInfo(o));
  const st={ off:0, ora:null, tipo:'Partita', players:4, durata:90, amici:(prefill.amici||[]).slice() };
  if(prefill.giorno){ const m=days.filter(d=>d.giorno===prefill.giorno)[0]; if(m) st.off=m.off; }
  else{ for(let i=0;i<days.length;i++){ if(availSlots(days[i].off,days[i].dow)>0){ st.off=days[i].off; break; } } }
  // MODIFICA: la prenotazione che stai cambiando "possiede" già il suo slot →
  // in edit-mode lo mostriamo SEMPRE come libero e pre-selezionato (anche se la
  // disponibilità pseudo-casuale lo darebbe occupato: quel campo è il tuo).
  const ownOff = editId ? st.off : null;
  const ownOra = editId ? (prefill.ora||null) : null;
  function flatDay(off,dow){ const arr=daySlotsFlat(off,dow,st.durata,st.players);
    if(editId && off===ownOff && ownOra){ const s=arr.filter(function(x){return x.ora===ownOra;})[0]; if(s) s.status='free'; }
    return arr; }
  const body=el('flow');
  // Passo 1: quando (prossimi 7 giorni con conteggio slot disponibili)
  body.appendChild(fieldLabel('Quando'));
  const dayRow=el('days'); body.appendChild(dayRow);
  // Passo 2: gli orari (slot da 90') del giorno scelto, mostrati DIRETTAMENTE — niente
  // più raggruppamento Mattina/Pomeriggio/Sera (meno tap, più fedele a un RadioButtonsGroup
  // nativo). Nessuna legenda "● Libero": mostriamo solo slot liberi, è ridondante.
  body.appendChild(fieldLabel('Orari disponibili · 90 min'));
  const slotBox=el('slotbox'); body.appendChild(slotBox);
  // Partita sempre 90' in 4 (niente selettore "in quanti giocate").
  // FASE 1 = SOLO giorno/orario (una scelta per volta). Invitare gli amici è la
  // FASE 2, DOPO l'opzione: prima ti assicuri il campo, poi completi la partita
  // (vedi rosterActionButtons).
  const sum=el('flow-sum');   // riepilogo selezione
  body.appendChild(sum);
  const foot=document.createElement('button'); foot.className='flow-submit'; foot.textContent=editId?'Salva':'Prenota';
  foot.onclick=()=>{
    if(!st.ora){ toast('Tocca prima un orario libero.'); return; }
    const d=days[st.off];
    const meta=slotMetaFor(d.off,d.dow,st.ora,st.durata,st.players);
    const dur=90, players=4;   // partita sempre 90' in 4
    closeSheet();
    const names=st.amici.map(friendName).filter(Boolean);
    const pr=slotPrezzo(meta,players);
    if(editId){ addOut('✏️ '+d.giorno+' · '+st.ora);
      botSay(()=>applyEdit(editId,d,st.ora,meta)); return; }
    addOut('📋 '+d.giorno+' · '+st.ora+' · partita '+dur+"' · "+pr.testa+'€/giocatore'+(names.length?(' · con '+names.join(', ')):''));
    botSay(()=>decideAndPresent({giorno:d.giorno,dow:d.dow,ora:st.ora,tipo:st.tipo,durata:dur,amici:st.amici.slice(),players:players}));
  };
  body.appendChild(foot);

  function renderDays(){
    dayRow.innerHTML='';
    days.forEach(d=>{
      const c=availSlots(d.off,d.dow);
      const b=document.createElement('button'); b.type='button'; b.className='day'+(d.off===st.off?' sel':'');
      b.innerHTML='<b>'+d.w+'</b><span>'+d.n+'</span><small class="'+(c?'ok':'no')+'">'+(c?c+' liberi':'pieno')+'</small>';
      b.onclick=()=>{ st.off=d.off; st.ora=null; renderDays(); renderSlots(); updSum(); };
      dayRow.appendChild(b);
    });
  }
  function renderSlots(){
    slotBox.innerHTML='';
    const d=days[st.off];
    // TUTTI gli slot liberi del giorno (già in ordine cronologico via daySlotsFlat),
    // niente filtro per momento. Prezzo: header unico se uniforme, altrimenti per-chip.
    const flat=flatDay(d.off,d.dow).filter(s=>s.status!=='busy');
    if(!flat.length){ slotBox.appendChild(el('slot-empty','Nessun orario libero in questo giorno.')); return; }
    const uniform=flat.every(s=>s.prezzo===flat[0].prezzo);
    if(uniform){ const hdr=el('slot-fascia'); hdr.textContent=flat[0].prezzo+'€ a giocatore'; slotBox.appendChild(hdr); }
    const row=el('chips');
    flat.forEach(s=>{
      const b=document.createElement('button'); b.type='button';
      b.className='chip'+(st.ora===s.ora?' sel':'');
      b.textContent=uniform?s.ora:(s.ora+' · '+s.prezzo+'€');
      b.onclick=()=>{ st.ora=s.ora; renderSlots(); updSum(); };
      row.appendChild(b);
    });
    slotBox.appendChild(row);
  }
  function updSum(){
    const d=days[st.off];
    if(!st.ora){ sum.className='flow-sum'; sum.textContent='Nessun orario selezionato'; return; }
    const meta=slotMetaFor(d.off,d.dow,st.ora,st.durata,st.players);
    const dur=meta ? (meta.kind==='fisso'?90:st.durata) : st.durata;
    const players=meta&&meta.kind==='fisso'?4:st.players;
    const pr=slotPrezzo(meta,players);
    sum.className='flow-sum on';
    // Modifica di una prenotazione GIÀ completa: il roster non cambia spostando
    // l'orario → niente riga "1/4 · completa entro" (fuorviante), solo data + prezzo.
    const editRec=editId?S.prenotazioni.find(x=>x.id===editId):null;
    if(editRec && editRec.stato==='completo'){
      sum.innerHTML='📅 <b>'+esc(d.giorno)+' · '+st.ora+'–'+addMin(st.ora,dur)+'</b>'
        +'<br>💶 <b>'+pr.testa+' € a giocatore</b>';
      return;
    }
    const target=pr.giocatori, inviti=st.amici.length;
    // Riepilogo: cenno LEGGERO alla responsabilità (senza la cifra intera). La riga
    // forte «intero campo XX€ a tuo carico» la diamo UNA volta, alla conferma.
    sum.innerHTML='📅 <b>'+esc(d.giorno)+' · '+st.ora+'–'+addMin(st.ora,dur)+'</b>'
      +'<br>💶 <b>'+pr.testa+' € a giocatore</b>'
      +'<br>👥 1/'+target+' (tu)'+(inviti?(' · ✉️ '+inviti+' invit'+(inviti>1?'i':'o')):'')
      +'<br>👉 <b>Campo tuo</b>: lo completi invitando gli amici.';
  }
  openSheet(editId?'Modifica la prenotazione':'Prenota un campo', body, 'Scegli giorno e orario');
  renderDays(); renderSlots();
  if(prefill.ora){
    const d=days[st.off]; const meta=slotMetaFor(d.off,d.dow,prefill.ora,st.durata,st.players);
    if(meta && (editId || meta.status!=='busy')){ st.ora=prefill.ora; renderSlots(); }
  }
  // Fix #3 — pre-selezione per fascia: se ho capito «stasera/pomeriggio/mattina» ma non
  // un'ora precisa, pre-seleziono il primo slot libero in quella fascia (rispecchia ciò
  // che ho detto nell'eco). L'utente può sempre cambiarlo.
  if(!st.ora && prefill.fascia){
    const d=days[st.off]; const rng=fasciaRange(prefill.fascia);
    const cand=flatDay(d.off,d.dow).filter(s=>s.status!=='busy').filter(s=>{ const h=parseInt(s.ora.split(':')[0],10); return h>=rng[0] && h<rng[1]; })[0];
    if(cand){ st.ora=cand.ora; renderSlots(); }
  }
  updSum();
}
/* MODIFICA: applica al record esistente la nuova scelta fatta nel modulo (giorno/
   orario), ricalcola la finestra di completamento e ripropone le scelte. NON crea
   una nuova prenotazione (a differenza di decideAndPresent). */
function applyEdit(editId,d,ora,meta){
  const rec=S.prenotazioni.find(x=>x.id===editId);
  if(!rec){ addInHtml('Quella prenotazione non è più disponibile.'); homeMenu(); return; }
  rec.giorno=d.giorno; rec.ora=ora; rec.campo=campoLibero(d.dow,ora); rec.durata=90;
  rec.prezzoTesta=slotPrezzo(meta,4).testa;
  rec._nudgeStop=false;                   // spostando la data riparte la catena promemoria
  recomputeCompletion(rec);               // ricalcola solo completo vs confermato (niente scadenza)
  if(rec.stato==='confermato') scheduleNudge(rec.id, nudgeChainLen(offsetForGiorno(rec.giorno)||0));
  save();
  // Card UNICA aggiornata: da-completare → ripropone le scelte; già completa → conferma secca.
  if(rec.stato==='confermato') rosterActionButtons(rec, {receipt:true, header:'📌 <b>Prenotazione aggiornata</b>'});
  else {
    // Prenotazione GIÀ completa: nessuna fase di completamento da riproporre →
    // conferma segmentata + ritorno al menu.
    addInHtml('✅ <b>Prenotazione aggiornata</b><br>📅 '+esc(rec.giorno)+' · '+rec.ora+'<br>📍 Campo '+rec.campo);
    homeMenu();
  }
}

function decideAndPresent(draft){
  // Coerenza con la vista disponibilità: se l'orario chiesto a parole è
  // OCCUPATO — oppure NON è in listino (slotMetaFor → null: es. "alle 22",
  // "alle 14:15", "alle 8") — NON prenotare alla cieca (finirebbe a 0€ su uno
  // slot inesistente): apri il modulo con gli orari veri.
  const off=offsetForGiorno(draft.giorno);
  const draftMeta = off!=null ? slotMetaFor(off,draft.dow,draft.ora,draft.durata,draft.players) : null;
  if(!draftMeta || draftMeta.status==='busy'){
    // NON partire dal "no" secco: confermo il giorno che ho capito, spiego perché
    // quell'ora non va, e propongo lo slot LIBERO più vicino (fiducia > frustrazione).
    const free=(off!=null?daySlotsFlat(off,draft.dow,draft.durata,draft.players):[]).filter(s=>s.status!=='busy');
    const dayLbl=esc(draft.giorno);
    let msg;
    if(!free.length){
      msg='Per '+dayLbl+' non trovo campi liberi 😕 — ti apro il modulo per scegliere un altro giorno.';
    } else {
      const toMin=s=>{const p=s.split(':');return (+p[0])*60+(+p[1]);};
      const want=toMin(draft.ora);
      const near=free.reduce((a,b)=>Math.abs(toMin(b.ora)-want)<Math.abs(toMin(a.ora)-want)?b:a, free[0]);
      const why=draftMeta ? ('alle '+draft.ora+' è già tutto occupato') : ('alle '+draft.ora+' non ci sono campi');
      msg='Per '+dayLbl+' 👍 — '+why+'. Il più vicino che ho libero è alle <b>'+near.ora+'</b> ('+near.prezzo+'€ a giocatore). Ti apro il modulo per confermarlo o scegliere un altro orario.';
    }
    addFlowLaunch(msg, ()=>openBookingFlow({giorno:draft.giorno,durata:draft.durata,amici:draft.amici}));
    return;
  }
  const campo=campoLibero(draft.dow,draft.ora); const fine=addMin(draft.ora,draft.durata);
  const pr=slotPrezzo(draftMeta,draft.players);
  const target=pr.giocatori;
  const names=(draft.amici||[]).map(friendName).filter(Boolean);   // amici scelti = da INVITARE
  draft.campo=campo; draft.fine=fine; draft.target=target; draft.names=names;
  draft.prezzoTesta=pr.testa;
  // Niente più bottone "Procedi": scegliere giorno/orario nel modulo (o la frase
  // scritta) È GIÀ la conferma → opzioniamo SUBITO e sotto mostriamo "come
  // completare la partita". Un passaggio in meno (richiesta utente) e via la copy
  // contraddittoria ("opzioniamo" al futuro mentre il campo non era ancora preso).
  commitOpzione(draft);
}
/* Crea l'OPZIONE (gratis) col solo organizzatore confermato; gli amici scelti
   ricevono un INVITO (il posto si riempie solo quando accettano). */
/* Ricalcola SOLO lo stato squadra (niente scadenza): al completo = 'completo',
   altrimenti 'confermato' (campo tuo, da completare, sotto la tua responsabilità).
   Nessun 'sameDay'/deadline/win: il modello a responsabilità vale per tutte. */
function recomputeCompletion(rec){
  rec.stato = rosterPosti(rec)<=0 ? 'completo' : 'confermato';
}
function commitOpzione(draft){
  const off=offsetForGiorno(draft.giorno);
  const target=draft.target||4;
  const invited=(draft.names||(draft.amici||[]).map(friendName).filter(Boolean)).slice(0,target-1);
  /* `dow` = giorno della settimana: è la chiave con cui l'open-match interroga il
     registro disponibilità. Salvato qui alla creazione perché `giorno` è un'etichetta
     ("Sab 20/07") e ricavarlo dopo costerebbe una scansione (offsetForGiorno). */
  const rec={id:++S.seq,giorno:draft.giorno,dow:(off!=null?dayInfo(off).dow:null),ora:draft.ora,campo:draft.campo,tipo:draft.tipo,durata:draft.durata,
    target:target, amici:[], invitati:invited.slice(),
    prezzoTesta:(draft.prezzoTesta!=null?draft.prezzoTesta:null)};
  recomputeCompletion(rec);                 // completo (4/4) oppure confermato (da completare)
  S.prenotazioni.push(rec); save();
  rosterActionButtons(rec, {receipt:true}); // MSG 1 ricevuta ✅ + MSG 2 (card azione con disclaimer responsabilità)
  if(invited.length) sendInvites(rec, invited);
  if(rec.stato==='confermato') scheduleNudge(rec.id, nudgeChainLen(off||0));   // catena promemoria "check-in aereo"
}
/* FASE 2 — come completare la partita (dopo l'opzione). LIST MESSAGE WhatsApp:
   il CORPO della lista porta lo stato roster + la domanda (così la ricevuta — card
   1 — resta pulita e non si ripete "completa"); ogni riga = titolo (≤24 char) +
   descrizione (≤72 char), così ogni scelta si spiega da sola (i reply-button non
   hanno descrizione). Annulla/aspetta = da "Le mie prenotazioni". */
/* MSG 1 = RICEVUTA: bolla di conferma "Campo prenotato", SEPARATA dalla card d'azione.
   Motivo (test utente): un'unica card con ✅ + dettagli + azione veniva letta come
   "ho finito" → nessuno completava la partita. Emessa SOLO alla conferma iniziale e
   dopo una modifica (opts.receipt), MAI sui re-show del roster (falsa ricevuta). */
function bookingReceipt(rec, header){
  const fine=addMin(rec.ora,rec.durata||90);
  const priceLine=(rec.prezzoTesta!=null)?('<br>💶 <b>'+rec.prezzoTesta+' € a giocatore</b>'):'';   // solo a testa
  addInHtml((header||'📌 <b>Campo prenotato</b> a tuo nome')
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora+'–'+fine+' · Campo '+rec.campo
    +priceLine);
}
function rosterActionButtons(rec, opts){
  const posti=rosterPosti(rec);
  if(opts && opts.receipt) bookingReceipt(rec, opts.header);   // MSG 1 (ricevuta) prima della card d'azione
  // MSG 2 = card d'AZIONE (List) UNICA per ogni prenotazione da completare (oggi o
  // futura: stesso modello a responsabilità). Corpo SEGMENTATO (una riga = un fatto,
  // emoji-àncora, amo in MAIUSCOLO): amo "MANCANO N GIOCATORI" + roster + DISCLAIMER
  // con la cifra dell'intero campo. Data NON ripetuta (è nella ricevuta). Il pulsante
  // DICE l'azione ("Completa la partita") — eccezione voluta a "☰ Apri".
  const amo = posti>1 ? ('MANCANO '+posti+' GIOCATORI') : (posti===1 ? 'MANCA 1 GIOCATORE' : 'PARTITA AL COMPLETO');
  // Il disclaimer FORTE «intero campo XX€ a tuo carico» solo alla PRIMA comparsa
  // (opts.receipt = conferma/aggiornamento prenotazione). Sui re-show dopo un invito
  // NON lo ripetiamo: un cenno leggero e incoraggiante (evita l'effetto rimprovero).
  const firstShow = !!(opts && opts.receipt);
  const filled=rosterFilled(rec), tgt=rosterTarget(rec);
  let body;
  if(firstShow && posti>0){
    // PRIMO show dopo la prenotazione = il momento più delicato: deve dare SOLLIEVO,
    // non paura. Apre con l'ANIMA («campo tuo, al quarto ci pensiamo insieme»), roster
    // NEUTRO (non l'allarme «MANCANO N»), promessa REALE (a ogni "sì" ti avviso), e
    // solo in fondo la nota-prezzo calma (disclaimerLines).
    body='🎾 <b>Campo tuo — al quarto ci pensiamo insieme</b>'
      +'<br>🕒 Si gioca '+esc(rec.giorno)+' alle '+rec.ora
      +'<br>👥 Siete in <b>'+filled+'/'+tgt+'</b> — '+(posti>1?('mancano '+posti):'manca 1')
      +(rosterPending(rec)?('<br>🟡 In attesa: '+rec.invitati.join(', ')):'')
      +'<br>👉 Invita chi vuoi qui sotto: a ogni «sì» ti avviso io.'
      +'<br>'+disclaimerLines(rec);
  } else {
    body='🎾 <b>'+amo+'</b>'
      +'<br>🕒 Si gioca '+esc(rec.giorno)+' alle '+rec.ora
      +'<br>👥 Sei in <b>'+filled+'/'+tgt+'</b>'
      +(rosterPending(rec)?('<br>🟡 In attesa: '+rec.invitati.join(', ')):'')
      +(posti>0 ? '<br>👉 <b>Il campo è già tuo</b> — completa quando vuoi.' : '');
  }
  // Le voci (con descrizione) vivono NELLA SCHERMATA che apre il pulsante (fedele a WA).
  const rows=[
    {section:'Completa la partita', ic:'👥', label:'Invito i miei amici', desc:rosterPending(rec)?('Invita in un tap · 🟡 '+rosterPending(rec)+' in attesa'):'Invita in un tap · ⚪ scegli con chi giocare', action:()=>botSay(()=>openInviteFriendsList(rec))},
    {ic:'💬', label:'Contatta la segreteria', action:()=>botSay(()=>doSegreteria())},
    {section:'Oppure', ic:'✏️', label:'Modifica la prenotazione', desc:'Cambia giorno o orario', action:()=>botSay(()=>{ addFlowLaunch('Riapriamo il modulo — scegli di nuovo giorno e orario.', ()=>openBookingFlow({editId:rec.id, giorno:rec.giorno, ora:rec.ora})); })},
    menuBackRow('Oppure')
  ];
  addListMessage({body:body, button:'Completa la partita', title:'Completa la partita', rows:rows.slice(0,10)});   /* pulsante = CTA (eccezione voluta a "Apri") */
}
/* Partita al completo → prenotazione confermata. */
function confirmBooking(rec,extra){
  rec.stato='completo'; save();
  addInHtml('✅ <b>Prenotazione confermata!</b>'
    +'<br>📅 '+esc(rec.giorno)+' · '+rec.ora
    +'<br>📍 Campo '+rec.campo+' · in '+rosterTarget(rec)
    +(rec.amici&&rec.amici.length?('<br>👥 '+rec.amici.join(', ')):'')
    +(extra?('<br>'+extra):''),true);
  maybeHint(); homeMenu();
}
/* ---------- Promemoria "check-in aereo" (catena a costo Meta zero) ---------
   Dopo la prenotazione, dentro la finestra 24h di servizio (GRATIS), mandiamo un
   promemoria che ricorda la RESPONSABILITÀ e chiede una decisione con 2 reply-button:
   · 🔔 "Ricordamelo ancora" → il tap è un messaggio in entrata che RIAPRE la finestra
     24h → il prossimo nudge resta gratis (catena). Riprogramma il nudge successivo.
   · 🙅 "Me ne occupo io" → stop promemoria + presa di responsabilità piena.
   Cadenza scalata sulla distanza (nudgeChainLen): più la partita è lontana, più
   anelli; in giornata uno solo. Nell'emulatore il delay è ~15 min (NON subito dopo la
   prenotazione: vederlo appena prenotato confondeva); nel prodotto reale sono ore. La
   catena si ferma se la partita diventa completa o se l'utente sceglie "me ne
   occupo io" (rec._nudgeStop). */
function nudgeChainLen(off){ if(off===0) return 1; if(off<=2) return 2; return 3; }
const NUDGE_DELAY_MS=15*60*1000;   // ~15 min: il promemoria non compare subito dopo la prenotazione (nel reale = ore)
const NUDGE_FAST_MS=3000;          // demo-hook (solo collaudo): ~3 s invece di 15 min
/* Demo-hook: `fast` è threadato lungo la catena (NON un global), così il pulsante
   "🔔 Testa promemoria" accelera SOLO la catena della prenotazione testata; le
   prenotazioni reali mantengono i 15 min. Niente stato persistente da resettare. */
function scheduleNudge(recId, n, fast){
  if(n<=0) return;
  setTimeout(()=>{
    const r=S.prenotazioni.find(x=>x.id===recId);
    if(!r || r.stato==='completo' || r._nudgeStop || rosterPosti(r)<=0) return;
    botSay(()=>rosterNudge(r, n, fast));
  }, fast ? NUDGE_FAST_MS : NUDGE_DELAY_MS);
}
function rosterNudge(r, n, fast){
  addInHtml('🔔 <b>Promemoria partita</b>'
    +'<br>📅 '+esc(r.giorno)+' · '+r.ora
    +'<br>'+disclaimerLines(r));
  addQuick([
    {label:'🔔 Ricordamelo ancora', action:()=>{ addOut('Ricordamelo ancora');
      botSay(()=>{ addInHtml('👍 Ti ricorderò ancora di completare la partita.'); scheduleNudge(r.id, n-1, fast); }); }},
    {label:'🙅 Me ne occupo io', action:()=>{ addOut('Me ne occupo io');
      const rr=S.prenotazioni.find(x=>x.id===r.id); if(rr){ rr._nudgeStop=true; save(); }
      botSay(()=>addInHtml('👍 <b>Ci pensi tu</b>'
        +'<br>Non ti mando altri promemoria.'
        +'<br>'+disclaimerLines(r))); }}
  ]);
}
/* Demo-hook (SOLO collaudo): fa comparire SUBITO — in fast mode — il promemoria
   per la prenotazione INCOMPLETA più recente, così è collaudabile in sessione senza
   aspettare 15 min. Ri-arma anche una prenotazione su cui avevi scelto "me ne occupo
   io". Se non c'è nulla da completare, lo dice. */
function demoFireNudge(){
  const cand=S.prenotazioni.slice().reverse().find(r=>r.stato==='confermato' && rosterPosti(r)>0);
  if(!cand){ toast('Prima prenota una partita da completare (con posti liberi).'); return; }
  cand._nudgeStop=false; save();
  toast('🔔 Promemoria in arrivo tra pochi secondi…');
  scheduleNudge(cand.id, nudgeChainLen(offsetForGiorno(cand.giorno)||0), true);   // fast SOLO per questa catena
}
/* Modulo "gestisci i giocatori" = WhatsApp FLOW nativo: UN solo CheckboxGroup + UN
   footer. Tre tipi di riga, tutte nello stesso gruppo (max-selected = target−1 = 3 altri):
   · CONFERMATI ✅ (pre-spuntati) → deseleziona = TOGLI dal roster (se la partita era
     completa torna "da completare");
   · IN ATTESA ✉️ (pre-spuntati) → deseleziona = REVOCA l'invito;
   · AMICI invitabili (non spuntati) → spunta = INVITA (modello B: il posto si riempie
     SOLO quando confermano; cost-zero, l'amico risponde ✅ SÌ / ❌ NO / 🔕 Non invitarmi più).
   Voci non invitabili = disabilitate SOLO per opt-out 🔕 (cost-zero: ogni amico invitabile). NIENTE
   "Ospite" (solo giocatori veri). "Aggiungi un amico" = EmbeddedLink (esce dal Flow per
   condividere un contatto, poi torni qui). Footer unico "Aggiorna partita" applica tutto. */
function openAddPlayersFlow(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  const target=rosterTarget(r);
  const maxOthers=target-1;                              // caselle = gli ALTRI giocatori (tu conti sempre come 1)
  const confirmed=(r.amici||[]).slice();                 // giocatori CONFERMATI (deseleziona = TOGLI)
  const pending=(r.invitati||[]).slice();                // inviti in ATTESA (deseleziona = REVOCA)
  const preChecked=confirmed.concat(pending);
  const avail=S.friends.filter(f=>preChecked.indexOf(f.nome.split(' ')[0])<0);   // invitabili (spunta = INVITA)
  const posti=rosterPosti(r);
  const cap=maxOthers;                                   // max-selected NATIVO = posti totali "altri" (3 su 4)
  const picked=new Set(preChecked);
  const body=el('flow');
  body.appendChild(el('luce-hint', posti>0
    ? ('Manca'+(posti>1?'no':'')+' <b>'+posti+'</b> giocator'+(posti>1?'i':'e')+' per '+esc(r.giorno)+' alle '+r.ora+'. Spunta un amico per <b>invitarlo</b> (messaggio con <b>✅ SÌ / ❌ NO</b>); deseleziona un giocatore per <b>toglierlo</b>.')
    : ('Partita <b>al completo</b> per '+esc(r.giorno)+' alle '+r.ora+'. Deseleziona un giocatore per <b>toglierlo</b> o sostituirlo (la partita tornerà da completare).')));
  body.appendChild(fieldLabel('Chi gioca con te'));
  const counter=el('luce-hint','');
  function refresh(){ counter.innerHTML='Selezionati: <b>'+picked.size+'</b> / '+cap+(preChecked.length?' · deseleziona per togliere o revocare':''); }
  function toggle(cb){
    if(cb.checked){
      if(picked.size>=cap){ cb.checked=false; toast(cap===1?'C\'è posto per 1 solo giocatore.':'Puoi arrivare al massimo a '+cap+' giocatori (oltre a te). Togline uno prima.'); return; }
      picked.add(cb.dataset.nm);
    } else picked.delete(cb.dataset.nm);
    refresh();
  }
  const fl=el('friend-list');
  // 1) giocatori CONFERMATI = pre-spuntati (deseleziona = togli dal roster)
  confirmed.forEach(nm=>{
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.dataset.nm=nm; cb.onchange=()=>toggle(cb);
    const sp=document.createElement('span'); sp.innerHTML='✅ '+esc(nm)+' · <i>in partita</i>';
    row.appendChild(cb); row.appendChild(sp); fl.appendChild(row);
  });
  // 2) inviti in sospeso = pre-spuntati (deseleziona = revoca)
  pending.forEach(nm=>{
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.dataset.nm=nm; cb.onchange=()=>toggle(cb);
    const sp=document.createElement('span'); sp.innerHTML='✉️ '+esc(nm)+' · <i>in attesa</i>';
    row.appendChild(cb); row.appendChild(sp); fl.appendChild(row);
  });
  // 3) amici invitabili (+ disabilitati con motivo: non sul canale / opt-out 🔕)
  if(!avail.length && !preChecked.length){ fl.appendChild(el('luce-hint','Nessun amico ancora: aggiungine uno qui sotto — oppure lascia che sia la <b>segreteria</b> a trovare i giocatori.')); }
  // CheckboxGroup reale: max 20 opzioni nel data-source (confermati + in attesa + invitabili).
  const availCap=avail.slice(0, Math.max(0, 20-preChecked.length));
  availCap.forEach(f=>{ const nm=f.nome.split(' ')[0];
    const enabled = !f.optOut;   // cost-zero: ogni amico invitabile; solo l'opt-out 🔕 disabilita
    const row=document.createElement('label'); row.className='friend-row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.nm=nm;
    if(!enabled){ cb.disabled=true; row.style.opacity='.5'; } else cb.onchange=()=>toggle(cb);
    const note = f.optOut ? ' · <i>🔕 non riceve inviti</i>' : '';
    const sp=document.createElement('span'); sp.innerHTML=esc(f.nome)+note; row.appendChild(cb); row.appendChild(sp); fl.appendChild(row); });
  body.appendChild(fl);
  refresh(); body.appendChild(counter);
  // EmbeddedLink nativo (non un bottone): esce dal Flow per condividere un contatto
  const addF=document.createElement('a'); addF.href='#'; addF.className='flow-link'; addF.textContent='➕ Aggiungi un amico';
  addF.onclick=(e)=>{ e.preventDefault(); closeSheet(); openAddFriendFlow({backTo:r.id}); };
  body.appendChild(addF);
  // Footer UNICO: applica togli (confermati deselez.) + revoche (pending deselez.) + inviti nuovi
  const b=document.createElement('button'); b.className='flow-submit'; b.textContent='Aggiorna partita';
  b.onclick=()=>{
    const removed=confirmed.filter(nm=>!picked.has(nm));                 // confermati tolti
    const revoked=pending.filter(nm=>!picked.has(nm));                   // inviti revocati
    const newInv=[...picked].filter(nm=>preChecked.indexOf(nm)<0);       // nuovi inviti
    if(!removed.length && !revoked.length && !newInv.length){ closeSheet(); toast('Nessuna modifica.'); return; }
    closeSheet();
    botSay(()=>{ const rr=S.prenotazioni.find(x=>x.id===r.id); if(!rr){ addInHtml('Prenotazione non più disponibile.'); return; }
      rr.amici=(rr.amici||[]).filter(nm=>removed.indexOf(nm)<0);
      rr.invitati=(rr.invitati||[]).filter(nm=>revoked.indexOf(nm)<0).concat(newInv);
      rr.declinati=(rr.declinati||[]).filter(nm=>newInv.indexOf(nm)<0);   // re-invito → cancella l'eventuale ❌
      // Ho tolto un giocatore da una partita GIÀ completa → torna "da completare"
      // (confermata, campo tuo, responsabilità riattivata) e riparte la catena promemoria.
      if(rr.stato==='completo' && rosterPosti(rr)>0){ rr.stato='confermato'; rr._nudgeStop=false;
        scheduleNudge(rr.id, nudgeChainLen(offsetForGiorno(rr.giorno)||0)); }
      save();
      const lines=[];
      // Nota: i NUOVI inviti li annuncia sendInvites() (copy onesta "invito aperto") subito dopo.
      if(removed.length) lines.push('➖ <b>'+removed.join(', ')+'</b> '+(removed.length>1?'tolti':'tolto')+' dalla partita.');
      if(revoked.length) lines.push('↩️ Invito <b>revocato</b> a <b>'+revoked.join(', ')+'</b> — se '+(revoked.length>1?'rispondono':'risponde')+', diremo che il posto non è più disponibile.');
      lines.push('👥 Sei a <b>'+rosterFilled(rr)+'/'+rosterTarget(rr)+'</b>'+(rosterPending(rr)?(' · in attesa: '+rr.invitati.join(', ')):''));
      addInHtml(lines.join('<br>'),true);
      rosterActionButtons(rr);
      if(newInv.length) sendInvites(rr, newInv); });
  };
  body.appendChild(b);
  openSheet('Gestisci i giocatori', body, r.giorno+' · '+r.ora);
}
/* (Vecchio cluster promemoria a scadenza rimosso: ora la catena "check-in aereo"
   vive in scheduleNudge/rosterNudge sopra, senza auto-rilascio.) */
/* Invito amici — modello COST-ZERO (vedi openInviteFriendsList/inviteFriend sopra):
   l'invito parte dal WhatsApp PERSONALE dell'organizzatore via link wa.me, quindi ogni
   amico è invitabile (niente template Business, niente "sul canale"). L'amico risponde
   ✅ SÌ / ❌ NO (due link wa.me verso il Business); l'opt-out 🔕 resta come igiene.
   Qui simulato. Modello B: il posto si riempie SOLO quando l'amico CONFERMA. Questo
   batch serve al path CheckboxGroup (openAddPlayersFlow) e agli amici pre-selezionati
   in fase di prenotazione; il tap-singolo della nuova lista usa inviteFriend. */
function sendInvites(rec, names){
  // COPY ONESTA (brief §5): il giallo = invito APERTO, non certo. Niente "inviato/
  // confermato" a monte: il posto si libera SOLO quando l'amico conferma.
  addSys('✉️ Invito aperto per '+names.join(', ')+' — il posto si libera solo alla conferma; ti avviso appena rispond'+(names.length>1?'ono':'e')+'.');
  // Stagger ampio: ogni risposta ora impiega ~6-7s (puntini ≥3s tra le sue card) →
  // le risposte multiple NON si sovrappongono (niente typing indicator doppi).
  names.forEach((nm,i)=>scheduleInviteResponse(rec, nm, 2500+i*8000));
}
/* Programma la risposta SIMULATA dell'amico (riusata dal batch sendInvites e dal
   tap singolo "Invita" della nuova lista). Si annulla da sé se l'invito è già stato
   risolto/revocato o la partita è al completo. */
function scheduleInviteResponse(rec, nm, delay){
  setTimeout(()=>{ const r=S.prenotazioni.find(x=>x.id===rec.id); if(!r || r.stato==='completo') return;   // le risposte arrivano finché la partita non è al completo
    if((r.invitati||[]).indexOf(nm)<0) return;   // invito già risolto/annullato
    botSay(()=>inviteResponse(r,nm), TYPING_MS); }, delay!=null?delay:4000);   // puntini ≥3s prima della risposta
}
function inviteResponse(r,nm){
  const declina=/Paolo/.test(nm);                  // demo: Paolo rifiuta (❌ Non posso)
  const optOut=/Davide/.test(nm);                  // demo: Davide fa opt-out (🔕 Non invitarmi più)
  r.invitati=(r.invitati||[]).filter(x=>x!==nm);
  // La card roster ("Completa la partita") arriva DOPO la riga di risposta, con un
  // altro "sta scrivendo…" → si legge una cosa alla volta (feedback utente).
  if(declina){ if((r.declinati||[]).indexOf(nm)<0) r.declinati=(r.declinati||[]).concat(nm); save();   // resta ❌ nella lista
    addInHtml('❌ <b>'+esc(nm)+'</b> non può per '+esc(r.giorno)+' alle '+r.ora+'. Resta segnato <b>❌</b> nella lista; invita pure qualcun altro.');
    botSay(()=>{ rosterActionButtons(r); rosterOfferAfterMiss(r); }, TYPING_MS); return; }
  if(optOut){ const fr=S.friends.find(f=>f.nome.split(' ')[0]===nm); if(fr) fr.optOut=true; save();
    addInHtml('🔕 <b>'+esc(nm)+'</b> ha scelto di <b>non ricevere più inviti</b>. Rispettiamo la sua scelta: non gli manderemo altre richieste. Invita pure qualcun altro.');
    botSay(()=>{ rosterActionButtons(r); rosterOfferAfterMiss(r); }, TYPING_MS); return; }
  r.amici=(r.amici||[]).concat(nm); r.declinati=(r.declinati||[]).filter(x=>x!==nm); save();   // ha confermato → via l'eventuale ❌
  if(rosterPosti(r)===0){ addInHtml('✅ <b>'+esc(nm)+'</b> ha confermato! Partita <b>al completo</b> 🎾',true); botSay(()=>confirmBooking(r), TYPING_MS); return; }
  const tail=rosterPending(r)?(' · in attesa: '+r.invitati.join(', ')):(' · manca'+(rosterPosti(r)>1?'no':'')+' '+rosterPosti(r));
  addInHtml('✅ <b>'+esc(nm)+'</b> ha confermato! Ora siete <b>'+rosterFilled(r)+'/'+rosterTarget(r)+'</b>'+tail+'.',true);
  botSay(()=>rosterActionButtons(r), TYPING_MS);
}
/* ============================================================================
   INVITO AMICI — modello COST-ZERO (prototipo UX, tutto SIMULATO client-side).
   L'invito "parte" dal WhatsApp PERSONALE dell'organizzatore via link wa.me
   (persona-a-persona = gratis): ogni amico è invitabile, cade la restrizione
   "non sul canale". Tri-stato ONESTO ⚪🟡🟢 (emoji + testo, MAI colore) su ciò che
   l'app può davvero sapere. Un tap per amico, niente invio in blocco.
   ⚠️ Link wa.me SIMULATI: nessuna chat esterna si apre. La Fase 2 reale (gestionale
   + Supabase, link wa.me veri con doppio encodeURIComponent annidato) vive altrove.
   ========================================================================== */
/* Tri-stato di un amico RISPETTO a una prenotazione (emoji + testo). Oltre a ⚪🟡🟢
   c'è il transitorio persistente ❌ "non può quel giorno" (in rec.declinati): chi ha
   rifiutato NON torna ⚪ (perderebbe l'informazione), resta ❌ e va ri-invitato a mano. */
function inviteStateOf(rec, f){
  const nm=f.nome.split(' ')[0];
  if(f.optOut)                           return {ic:'🔕', txt:'non riceve inviti',  can:false};
  if((rec.amici||[]).indexOf(nm)>=0)     return {ic:'🟢', txt:'in partita',          can:false};
  if((rec.invitati||[]).indexOf(nm)>=0)  return {ic:'🟡', txt:'invito aperto',       can:false};
  if((rec.declinati||[]).indexOf(nm)>=0) return {ic:'❌', txt:'non può quel giorno', can:false};
  return {ic:'⚪', txt:'da invitare', can:true};
}
/* Builder del messaggio d'invito organizzatore→amico (testo REALE anche se i link
   wa.me sono qui SIMULATI). I due link interni (SÌ/NO) puntano al Business con un
   payload corto "SI|NO recId friendId". FASE 2: se il messaggio ESTERNO
   organizzatore→amico diventa a sua volta un wa.me precompilato, questi due link
   vanno ANNIDATI → un secondo encodeURIComponent(yes/no). Con invio simulato non
   serve; lo stesso builder è riusabile tale e quale in Fase 2. */
function buildInviteMessage(rec, friend){
  const org=(S.player.nome||'Un amico').split(' ')[0];
  const fn=(friend.nome||'').split(' ')[0];
  const yes='https://wa.me/'+CLUB_WA+'?text='+encodeURIComponent('SI '+rec.id+' '+friend.id);
  const no ='https://wa.me/'+CLUB_WA+'?text='+encodeURIComponent('NO '+rec.id+' '+friend.id);
  const text='Ciao '+fn+'! '+org+' ti invita a padel:\n'
    +rec.giorno+' alle '+rec.ora+', Campo '+rec.campo+'.\n'
    +'✅ SÌ, partecipo → '+yes+'\n'
    +'❌ NO, non posso → '+no;
  return { org, fn, yes, no, text };
}
/* Anteprima RICCA (card): com'è il messaggio che l'amico riceverebbe sul suo
   WhatsApp, coi due "link" SÌ/NO evidenziati (testo, NON cliccabili — simulati).
   Il grigio (--muted) è testo secondario, NON un segnale di stato (il tri-stato = emoji). */
function inviteMessagePreviewHtml(rec, friend){
  const m=buildInviteMessage(rec, friend);
  // Mostriamo il messaggio COME LO VEDE l'amico: SÌ/NO come "link" puliti da toccare,
  // NON le URL wa.me grezze/codificate (%20, id, numero) — sembravano roba tecnica.
  return '📲 <b>Anteprima — il messaggio che riceve '+esc(m.fn)+'</b>'
    +'<div style="margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--wa-bg);border:1px solid #e2d9cf">'
    +'Ciao '+esc(m.fn)+'! <b>'+esc(m.org)+'</b> ti invita a padel:<br>'
    +'📅 '+esc(rec.giorno)+' alle '+rec.ora+', Campo '+rec.campo+'.'
    +'<div style="margin-top:6px;line-height:1.9">'
    +'<span style="color:#128C7E;text-decoration:underline">✅ <b>SÌ, partecipo</b></span><br>'
    +'<span style="color:#128C7E;text-decoration:underline">❌ <b>NO, non posso</b></span>'
    +'</div>'
    +'</div>'
    +'<div style="margin-top:6px;font-size:12px;color:var(--muted)">🔗 Con un tap ci fa sapere se viene · demo: nessun messaggio parte davvero.</div>';
}
/* NUOVA lista "Invita i miei amici" (List Message ≤10 righe): un amico per riga col
   suo tri-stato; tap su un amico ⚪ = lo invita (un tap per amico, fedele a WA).
   Togli/revoca restano nel CheckboxGroup (openAddPlayersFlow). */
function openInviteFriendsList(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  if(r.stato==='completo'){ addInHtml('La partita è già <b>al completo</b> 🎾 — per cambiare i giocatori apri «Gestisci i giocatori».');
    addQuick([{label:'👥 Gestisci i giocatori',action:()=>botSay(()=>addFlowLaunch('Apriamo il modulo — togli o sostituisci.', ()=>openAddPlayersFlow(r)))}, menuBtn()]); return; }
  if(!S.friends.length){
    addInHtml('Non hai ancora amici in rubrica. Aggiungine uno per invitarlo con un tap — oppure <b>scrivi alla segreteria</b> per una mano.');
    addQuick([{label:'➕ Aggiungi amico',action:()=>openAddFriendFlow({backTo:r.id, invite:true})},{label:'💬 Contatta la segreteria',action:()=>botSay(()=>doSegreteria())}]);
    return;
  }
  const posti=rosterPosti(r);
  // Fix #4 — se Marco ha ESAURITO gli amici invitabili (tutti 🟡/🟢/❌/🔕) ma restano
  // posti, PROMUOVIAMO l'open-match: è la frontiera dove oggi la promessa finiva in
  // segreteria. Altrimenti l'open-match resta un'opzione secondaria (amici prima → D6).
  const noInvitable = posti>0 && !hasInvitableFriend(r);
  const body='👥 <b>Invita i tuoi amici</b>'
    +'<br>🕒 '+esc(r.giorno)+' alle '+r.ora+' · Campo '+r.campo
    +'<br>🎾 '+(posti>1?('Mancano <b>'+posti+'</b> giocatori'):(posti===1?'Manca <b>1</b> giocatore':'Al completo'))
    +(noInvitable?'<br>👉 Finiti gli amici liberi? <b>Al quarto ci pensiamo noi.</b>'
                 :'<br>⚪ da invitare · 🟡 in attesa · 🟢 in partita · ❌ non può');
  const friendRows=S.friends.slice(0,7).map(f=>{
    const st=inviteStateOf(r,f);
    const desc = st.can ? 'Tocca per invitarlo (messaggio WhatsApp)'
      : (st.ic==='🟡' ? 'Invito aperto · revoca da «Gestisci i giocatori»'
      : (st.ic==='🟢' ? 'Già in partita · gestisci da «Gestisci i giocatori»'
      : (st.ic==='❌' ? 'Ti ha detto che non può · tocca per ri-invitarlo'
      : 'Ha chiesto di non ricevere inviti')));
    return {section:'I tuoi amici', ic:st.ic, label:f.nome, desc:desc,
      // invitabile → inviteFriend gestisce da sé il "sta scrivendo…"; non-invitabile → botSay per la nota
      action: st.can ? (()=>inviteFriend(r.id, f.id)) : (()=>botSay(()=>inviteInfoTap(r.id, f.id)))};
  });
  // La riga «ci pensiamo noi al quarto» (open-match mediato): PRIMA se Marco è a corto di
  // amici, altrimenti dopo la lista amici come alternativa calma. Marco non vede soci: tocca
  // e il circolo cerca per lui (doOpenMatch).
  // Due strade, stessa promessa: SCEGLIE IL CIRCOLO (un tap, contattiamo noi il primo
  // disponibile) oppure SCEGLIE MARCO (gli diamo fino a 6 nomi disponibili e decide lui).
  // La seconda per prima quando è a corto di amici: lì è la più utile.
  const openRow = posti>0 ? [
    { section: noInvitable?'Al quarto ci pensiamo noi':'Oppure', ic:'👤',
      label:'Scelgo io chi contattare', desc:'Ti mostro i soci liberi in questa fascia',
      action:()=>botSay(()=>openPlafondList(r)) },
    { section: noInvitable?'Al quarto ci pensiamo noi':'Oppure', ic:'🎾',
      label: noInvitable?'Al quarto pensiamo noi':'Trovate voi il quarto',
      desc:'Cerchiamo un socio del tuo livello libero', action:()=>botSay(()=>doOpenMatch(r)) }] : [];
  const rows = (noInvitable ? openRow.concat(friendRows) : friendRows.concat(openRow));
  rows.push({section:'Altro', ic:'👥', label:'Gestisci i giocatori', desc:'Togli o revoca chi hai già invitato', action:()=>botSay(()=>addFlowLaunch('Apriamo il modulo — togli o revoca.', ()=>openAddPlayersFlow(r)))});
  rows.push({section:'Altro', ic:'➕', label:'Aggiungi un amico', desc:'Condividi un contatto per invitarlo', action:()=>botSay(()=>openAddFriendFlow({backTo:r.id, invite:true}))});
  rows.push(menuBackRow('Altro'));
  addListMessage({body:body, button:'Apri', title:'Invita i tuoi amici', rows:rows.slice(0,10)});
}
/* Tap su un amico NON direttamente invitabile (🟡/🟢/❌/🔕): nota onesta.
   Il ❌ (ha rifiutato) NON è un vicolo cieco: offriamo "Invita di nuovo". */
function inviteInfoTap(recId, fid){
  const r=S.prenotazioni.find(x=>x.id===recId); if(!r) return;
  const f=S.friends.find(x=>x.id===fid); if(!f) return;
  const st=inviteStateOf(r,f), nm=f.nome.split(' ')[0];
  if(st.ic==='❌'){
    addInHtml('❌ <b>'+esc(nm)+'</b> ti ha detto che <b>non può</b> quel giorno. Vuoi riprovare a invitarlo lo stesso?');
    addQuick([{label:'✉️ Invita di nuovo',action:()=>inviteFriend(recId, fid)},{label:'👥 Torna alla lista',action:()=>botSay(()=>openInviteFriendsList(r))}]);
    return;
  }
  const msg = st.ic==='🟡' ? '🟡 Hai già un <b>invito aperto</b> per '+esc(nm)+' — aspettiamo la sua risposta. Per revocarlo usa «Gestisci i giocatori».'
    : (st.ic==='🟢' ? '🟢 <b>'+esc(nm)+'</b> è già in partita.'
    : '🔕 <b>'+esc(nm)+'</b> ha chiesto di non ricevere inviti: rispettiamo la sua scelta.');
  addInHtml(msg);
  addQuick([{label:'👥 Torna alla lista',action:()=>botSay(()=>openInviteFriendsList(r))}, menuBtn()]);
}
/* Tap "Invita X" (⚪): CLICK-FIRST (X → 🟡 subito) → anteprima ricca del messaggio →
   risposta SIMULATA (riusa inviteResponse: Luca ✅ / Paolo ❌ / Davide 🔕). */
function inviteFriend(recId, fid){
  const r=S.prenotazioni.find(x=>x.id===recId); if(!r){ addInHtml('Prenotazione non più disponibile.'); return; }
  const f=S.friends.find(x=>x.id===fid); if(!f){ addInHtml('Quell\'amico non è più in lista.'); return; }
  const nm=f.nome.split(' ')[0];
  if(f.optOut || (r.amici||[]).indexOf(nm)>=0 || (r.invitati||[]).indexOf(nm)>=0){ inviteInfoTap(recId, fid); return; }
  if(rosterPosti(r)<=0){ addInHtml('La partita è già al completo 🎾.'); rosterActionButtons(r); return; }
  // CLICK-FIRST (brief §5, ≈ click_at): registra SUBITO l'invito APERTO → 🟡,
  // prima ancora di "inviare" (nel reale è il tap sul link wa.me a segnare il click).
  // Se lo stiamo RI-invitando dopo un ❌, togli il flag "non può".
  r.declinati=(r.declinati||[]).filter(x=>x!==nm);
  r.invitati=(r.invitati||[]).concat(nm); save();
  // RITMO DI LETTURA: i messaggi arrivano UNO ALLA VOLTA, con "sta scrivendo…" (i tre
  // puntini) ≥3s TRA una card e l'altra, il più recente sempre in basso (feedback utente).
  // 1) anteprima ricca del messaggio a X → 2) riga onesta "invito aperto" → poi la
  // risposta simulata. La card roster torna con la risposta.
  botSay(()=>{
    addCard(inviteMessagePreviewHtml(r, f));               // 1) anteprima del messaggio a X
    botSay(()=>{
      addInHtml('✉️ <b>Invito aperto</b> per '+esc(nm)+' — appena risponde te lo dico. Il posto si libera solo alla conferma.', true);   // 2) riga onesta
      scheduleInviteResponse(r, nm, 1500);                 // 3) breve attesa "sta pensando", poi i puntini ≥3s della risposta
    }, TYPING_MS);
  }, TYPING_MS);
}
/* ============================================================================
   FIX #4 — OPEN-MATCH «trovami il quarto» (modello MEDIATO, tutto SIMULATO)
   L'anima resa VERA: «Tu pensa a giocare — il quarto lo troviamo NOI». Quando
   Marco non completa con i suoi amici, il CIRCOLO gli trova un socio compatibile.
   Decisioni di prodotto (chiuse con l'utente, 12/07):
   · D1 MEDIATO: Marco NON vede MAI una lista di soci. Il circolo contatta i
     compatibili; Marco riceve solo «cerco… 🎾 trovato Nome, livello». I "no" degli
     altri soci sono ASSORBITI backstage (privacy) → nessun pool navigabile.
   · D3 AUTO-FILL nome+livello, RIMOVIBILE: il posto si riempie da solo; se proprio
     non gli va, Marco toglie il socio da «Gestisci i giocatori» (già esistente).
     Niente veto per-candidato (rimetterebbe Marco "al lavoro" + esporrebbe lo scartato).
   · D4 LIVELLO ±0.5, nessun altro filtro (no genere/categoria): 4.0 → 3.5–4.5;
     se vuoto → ramo onesto «allargo?» (±1.0). Mai un vicolo cieco.
   · D5 GRATIS (il concierge +5€ è ABOLITO, non si reintroduce).
   · D6 PROATTIVO con garbo (offerto quando finisci gli amici da invitare) + ON-DEMAND
     («trovami il quarto» funziona sempre). NON offerto subito dopo la prenotazione.
   · D7 CONSENSO del socio contattato (✅/❌/🔕) — nel simulato `_declina` = rifiuto
     assorbito; l'opt-out da open-match sarebbe `_openOptOut` (igiene anti-spam Meta).
   Riusa il modello roster (rec.amici) e il chiudi-partita (confirmBooking). ========= */
const OPEN_BAND=0.5;               // banda di livello di default (±0.5); «allarga» → 1.0
/* Assicura che il pool esista anche su stati vecchi salvati in localStorage (demoState
   pre-Fix#4 non aveva S.pool): auto-guarigione, evita che l'open-match sembri "rotto". */
function ensurePool(){ if(!S.pool || !S.pool.length){ S.pool=demoState().pool; save(); } return S.pool; }
/* C'è ancora almeno un amico ⚪ da invitare per questa partita? (decide se PROMUOVERE
   l'open-match: se Marco ha esaurito gli amici, il circolo si fa avanti — "garbo" D6). */
function hasInvitableFriend(rec){ return S.friends.some(f=>inviteStateOf(rec,f).can); }
/* Candidati compatibili, ordinati per «quanto ha senso disturbarli». Esclude: chi NON
   ha dato l'opt-in, chi non è disponibile quel giorno/fascia, chi ha esaurito il cap
   settimanale, chi vuole più preavviso, chi è già in roster/invitato e chi è già stato
   TENTATO per questa partita (rec._poolTried → non ricontattiamo chi ha già declinato).
   NIENTE filtro genere/categoria (D4). Marco non vede mai questo elenco: è il "cervello"
   del bot, non una lista di soci.

   ⭐ La prima riga del filtro è il cuore della Fase 2: `!p.optIn` → fuori. Prima c'era
   `_openOptOut` (opt-OUT: chi non aveva il flag veniva contattato) — e siccome quel flag
   non lo scriveva mai nessuno, erano contattabili TUTTI. Ora vale il contrario: si scrive
   solo a chi ha detto sì. È questo che protegge il quality rating della WABA. */
function poolCandidates(rec, band, mode, includeTried){
  const my=parseFloat(S.player.livello)||4.0; const b=(band||OPEN_BAND)+1e-9;
  const tried=rec._poolTried||[];
  const inRoster=new Set([].concat(rec.amici||[], rec.invitati||[]));
  const slot=slotDiPrenotazione(rec);
  return ensurePool().filter(p=>{
    if(!p.optIn) return false;                                                   // consenso esplicito, o niente
    // `includeTried` = lo usa il PLAFOND: lì i già contattati non spariscono, restano
    // in lista con lo stato 🟡/❌ (come gli amici). Nel percorso automatico invece
    // vanno esclusi, altrimenti si ricontatterebbe chi ha già declinato.
    if(!includeTried && tried.indexOf(p.id)>=0) return false;
    if(inRoster.has(p.nome.split(' ')[0])) return false;
    if(Math.abs((parseFloat(p.livello)||0)-my) > b) return false;
    if((p._contattiSettimana||0) >= dispoMaxSettimana(p.disponibilita)) return false;   // freno anti-spam
    return dispoMatch(p.disponibilita, slot, mode||'esatto');
  }).sort((x,y)=>dispoScore(x,my,slot)-dispoScore(y,my,slot));
}
/* Ordinamento: chi ha dichiarato ESATTAMENTE quel giorno+fascia viene prima di tutti;
   poi la vicinanza di livello; a parità, chi è stato disturbato di meno — così il carico
   si distribuisce invece di martellare sempre il solito volenteroso (che è il modo in cui
   si brucia un socio disponibile). */
function dispoScore(p, my, slot){
  return (dispoMatch(p.disponibilita, slot, 'esatto') ? 0 : 100)
       + Math.abs((parseFloat(p.livello)||0)-my)*10
       + (p._contattiSettimana||0);
}
/* Entry-point «ci pensiamo noi». Riga calma (nessuna lista di soci → D1 mediato),
   poi la ricerca simulata. `band` cresce a 1.0 se Marco chiede di allargare. */
function doOpenMatch(rec, band){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec; ensurePool(); band=band||OPEN_BAND;
  if(rosterPosti(r)<=0){ addInHtml('La tua partita è già <b>al completo</b> 🎾.'); botSay(()=>rosterActionButtons(r)); return; }
  r._poolTried=r._poolTried||[];
  // Riga d'apertura = la promessa mantenuta: cerco IO, tu non fai nulla. Mai «cerco nel
  // database soci»: il tono è «ci pensiamo noi», non tecnico.
  const larga = band>OPEN_BAND ? ' (allargo un pelo il livello)' : '';
  addInHtml('Ci penso io 🎾'
    +'<br>Cerco un giocatore del tuo livello (~<b>'+esc(S.player.livello)+'</b>)'+larga+' libero per <b>'+esc(r.giorno)+'</b> alle '+r.ora+'.'
    +'<br>Rilassati: ti avviso appena l\'ho trovato.');
  botSay(()=>resolveOpenMatch(r, band), TYPING_MS);
}
/* Cuore della mediazione: contatta i candidati (un rifiuto viene ASSORBITO in silenzio,
   Marco non lo vede — è il senso del «noi»), il primo che accetta RIEMPIE il posto
   (riusa rec.amici + il modello roster). Se restano posti, CONTINUA a cercare da solo
   (chaining) → Marco legge «Trovato X… Trovato Y… al completo!». Se non c'è nessuno del
   livello, ramo ONESTO (openMatchNoResult), mai un vicolo cieco. */
function resolveOpenMatch(r, band){
  const rr=S.prenotazioni.find(x=>x.id===r.id)||r;
  if(rosterPosti(rr)<=0){ return; }
  // Scala di degradazione: prima il match ESATTO (giorno+fascia), poi solo il GIORNO
  // (fascia allargata). Entrambi i giri contattano soci che hanno dato l'opt-in E
  // nominato quel giorno → restano inviti attesi. Il terzo gradino (allargare il
  // LIVELLO) resta una scelta ESPLICITA di Marco in openMatchNoResult: non lo facciamo
  // di nostra iniziativa, perché è l'unico che allarga davvero la platea.
  let cands=poolCandidates(rr, band, 'esatto');
  if(!cands.length) cands=poolCandidates(rr, band, 'giorno');
  if(!cands.length){ openMatchNoResult(rr, band); return; }
  // Consenso del contattato (D7): un candidato può declinare (backstage). Contiamo i
  // rifiuti SOLO per ammorbidire il copy («ci ho messo un attimo»), senza svelare CHI.
  let declines=0, picked=null;
  for(const c of cands){
    rr._poolTried.push(c.id);
    // Qui parte IL messaggio → si consuma una unità del cap settimanale che il socio si è
    // dato nel Flow. Nell'emulatore il contatore non si azzera mai (non c'è rollover
    // settimanale); in Fase 2 è una conta scorrevole a 7 giorni sul log dei contatti.
    c._contattiSettimana=(c._contattiSettimana||0)+1;
    if(c._declina && !c._declinaUsed){ c._declinaUsed=true; declines++; continue; }  // rifiuto assorbito
    picked=c; break;
  }
  save();
  if(!picked){ openMatchNoResult(rr, band); return; }   // tutti i candidati hanno declinato
  const nm=picked.nome.split(' ')[0];
  rr.amici=(rr.amici||[]).concat(nm); save();            // AUTO-FILL: il posto si riempie (D3)
  const soft = declines>0 ? 'Ci ho messo un attimo, ma ci siamo 🙌<br>' : '';
  if(rosterPosti(rr)===0){
    addInHtml(soft+'🎾 <b>Trovato!</b> <b>'+esc(nm)+'</b> (livello '+esc(picked.livello)+'), socio del circolo, ci sta. Partita <b>al completo</b>!',true);
    botSay(()=>confirmBooking(rr), TYPING_MS); return;
  }
  // Ancora posti: annuncio il trovato e CONTINUO a cercare gli altri (il circolo lavora).
  addInHtml(soft+'🎾 <b>Trovato!</b> <b>'+esc(nm)+'</b> (livello '+esc(picked.livello)+'), socio del circolo, ci sta. Ora siete <b>'+rosterFilled(rr)+'/'+rosterTarget(rr)+'</b> — cerco '+(rosterPosti(rr)>1?('gli altri '+rosterPosti(rr)):'l\'ultimo')+'.',true);
  botSay(()=>resolveOpenMatch(rr, band), TYPING_MS);
}
/* Nessun socio del livello (o pool esaurito): ONESTO + PROATTIVO, mai vicolo cieco.
   Tengo l'invito aperto e propongo: allarga la banda (se non già a 1.0) · invita un
   amico · lascia che continui a cercare in sottofondo. */
function openMatchNoResult(r, band){
  const rr=S.prenotazioni.find(x=>x.id===r.id)||r;
  if(rosterPosti(rr)<=0) return;
  const canWiden = (band||OPEN_BAND) < 1.0;
  const quanti = rosterPosti(rr)>1 ? 'altri giocatori' : 'un altro giocatore';
  // Copy onesta dopo il registro: il tappo può essere la DISPONIBILITÀ, non il livello
  // (prima era sempre «del tuo livello» — con l'opt-in sarebbe spesso una bugia).
  addInHtml('Per <b>'+esc(rr.giorno)+'</b> alle '+rr.ora+' non ho ancora trovato '+quanti+' libero 😕'
    +'<br>Nessun problema: tengo l\'invito <b>aperto</b> e continuo a cercare.'
    +(canWiden?'<br>Vuoi che <b>allarghi un po\'</b> il livello?':''));
  const qs=[];
  if(canWiden) qs.push({label:'🎾 Allarga il livello', action:()=>{ addOut('Allarga il livello'); botSay(()=>doOpenMatch(rr, 1.0)); }});
  qs.push({label:'👥 Invito un amico', action:()=>botSay(()=>openInviteFriendsList(rr))});
  qs.push({label:'🔕 Continua a cercare', action:()=>{ addOut('Continua pure a cercare'); botSay(()=>{ addInHtml('👍 Ci penso io: continuo a cercare in sottofondo e <b>ti avviso appena trovo</b> qualcuno del tuo livello. Intanto il campo resta tuo.'); homeMenu(); }); }});
  addQuick(qs);
}
/* PROATTIVO con garbo (D6): al momento giusto — Marco ha esaurito gli amici da invitare
   e restano posti — il circolo si fa avanti con UNA riga calma + un bottone. NON è spam:
   compare solo alla frontiera «finiti gli amici», dove oggi la promessa finiva in segreteria. */
function maybeOfferOpenMatch(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  if(rosterPosti(r)<=0) return false;
  if(hasInvitableFriend(r)) return false;         // ha ancora amici ⚪ → non forziamo (amici prima)
  addInHtml('Finiti gli amici da invitare? Tranquillo 🎾'
    +'<br><b>Al quarto ci pensiamo noi</b>: ci sono soci che hanno detto di essere liberi per '+esc(r.giorno)+' alle '+r.ora+'.'
    +'<br>Vuoi <b>sceglierli tu</b> o faccio io?');
  // Reply-button: max 3, titolo ≤20 char (qui 12 e 11) → si sta.
  addQuick([{label:'👤 Scelgo io', action:()=>{ addOut('Scelgo io'); botSay(()=>openPlafondList(r)); }},
            {label:'🎾 Cercate voi', action:()=>{ addOut('Cercate voi'); botSay(()=>doOpenMatch(r)); }},
            menuBtn()]);
  return true;
}
/* Dopo un ❌/🔕 (inviteResponse): SOLO se ha senso (posti aperti + niente amici ⚪) offro
   l'open-match, con un "sta scrivendo…" per il ritmo di lettura. Il gate PRIMA del botSay
   evita il typing-fantasma quando l'offerta non parte (ha ancora amici da invitare). */
function rosterOfferAfterMiss(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  if(rosterPosti(r)>0 && !hasInvitableFriend(r)){ botSay(()=>maybeOfferOpenMatch(r)); }
}
/* ---------- PLAFOND «scelgo io chi contattare» ------------------------------
   Riletta la promessa «al quarto ci pensiamo noi»: non «facciamo tutto noi di
   nascosto», ma «ti diamo un GRUPPO di persone disponibili e scegli tu chi contattare».
   Il circolo resta il tramite (il messaggio parte dal suo numero: i soci non si
   scrivono mai tra loro), quindi paga e si prende le eventuali lamentele → i freni
   restano tutti.

   DUE freni distinti, che fanno cose diverse:
   · PLAFOND (lato mittente) = quante persone il circolo mette a disposizione di Marco
     per volta — `PLAFOND_MAX`. Evita che uno chieda a venti persone in un colpo.
   · CAP settimanale (lato destinatario) = quante volte quella persona ha accettato di
     essere cercata (scelto da lei nel Flow disponibilità). Prima la proteggeva dai
     messaggi del circolo, ora la protegge dalle richieste DEGLI ALTRI SOCI.
     È già applicato da poolCandidates → chi ha esaurito il cap non compare proprio.

   PRIVACY: si mostra **nome + iniziale del cognome** («Marta B.»), mai il cognome
   intero. Il solo nome non basterebbe: in un circolo ci sono tre Marco e due Marta, e
   l'app usa già il primo nome come chiave del roster — Marco chiederebbe alla persona
   sbagliata senza accorgersene. NIENTE filtro per sesso: il gruppo è misto (D4).

   Un tap = una richiesta = un messaggio: si contatta UNA persona per volta (come gli
   amici), non in blocco. Chi ha già ricevuto la richiesta resta in lista con 🟡/❌
   invece di sparire, così Marco vede a che punto è. */
const PLAFOND_MAX=6;                 // quante persone il circolo propone per volta
/* «Marta Belli» → «Marta B.» — identità sufficiente a distinguere due omonimi, senza
   consegnare il cognome di un socio a un altro socio. */
function nomeIniziale(nomeCompleto){
  const parti=String(nomeCompleto||'').trim().split(/\s+/);
  return parti.length<2 ? (parti[0]||'') : (parti[0]+' '+parti[1].charAt(0).toUpperCase()+'.');
}
/* Stato di un socio del plafond rispetto a QUESTA prenotazione — stesso linguaggio
   visivo degli amici (⚪🟡🟢❌), così Marco non impara due grammatiche diverse. */
function plafondStateOf(rec, p){
  if((rec.amici||[]).indexOf(p.nome.split(' ')[0])>=0) return {ic:'🟢', can:false, txt:'in partita'};
  if((rec._plafondNo||[]).indexOf(p.id)>=0)            return {ic:'❌', can:false, txt:'non può'};
  if((rec._plafondAttesa||[]).indexOf(p.id)>=0)        return {ic:'🟡', can:false, txt:'in attesa'};
  return {ic:'⚪', can:true, txt:'da contattare'};
}
/* I candidati del plafond: stessa selezione e stesso ordinamento del percorso
   automatico (opt-in ∧ disponibilità ∧ cap ∧ livello, ordinati per match esatto →
   livello → chi è stato disturbato meno), ma senza escludere i già contattati e
   troncati a PLAFOND_MAX. */
function plafondCandidates(rec, band){
  let c=poolCandidates(rec, band, 'esatto', true);
  if(c.length<PLAFOND_MAX){
    const ids=new Set(c.map(x=>x.id));
    c=c.concat(poolCandidates(rec, band, 'giorno', true).filter(x=>!ids.has(x.id)));
  }
  return c.slice(0, PLAFOND_MAX);
}
function openPlafondList(rec){
  const r=S.prenotazioni.find(x=>x.id===rec.id)||rec;
  if(rosterPosti(r)<=0){ addInHtml('La tua partita è già <b>al completo</b> 🎾.'); botSay(()=>rosterActionButtons(r)); return; }
  const slot=slotDiPrenotazione(r);
  const cands=plafondCandidates(r);
  if(!cands.length){ openMatchNoResult(r, OPEN_BAND); return; }       // mai vicolo cieco
  const posti=rosterPosti(r);
  const rows=cands.map(p=>{
    const st=plafondStateOf(r,p);
    // Onestà nella descrizione: «disponibile mar sera» solo se ha davvero dichiarato
    // QUELLA fascia; se lo abbiamo preso allargando, si dice che è un'altra fascia.
    const esatto=dispoMatch(p.disponibilita, slot, 'esatto');
    const quando=esatto ? ('disponibile '+DISPO_DOW_LB[slot.dow].toLowerCase()+' '+slot.fascia)
                        : ('libero '+DISPO_DOW_LB[slot.dow].toLowerCase()+', in altra fascia');
    const desc = st.can ? ('Livello '+p.livello+' · '+quando)
                        : (st.ic==='🟡' ? 'Richiesta inviata · aspettiamo la risposta'
                        : (st.ic==='🟢' ? 'Ha accettato · è in partita'
                        : 'Ha detto che non può · tocca per riprovare'));
    return { section:'Disponibili in questa fascia', ic:st.ic, label:nomeIniziale(p.nome), desc:desc,
             action: st.can ? (()=>contattaSocio(r.id, p.id)) : (()=>botSay(()=>plafondInfoTap(r.id, p.id))) };
  });
  rows.push({ section:'Oppure', ic:'🎾', label:'Scegliete voi per me',
              desc:'Ci pensiamo noi: contattiamo il primo disponibile', action:()=>botSay(()=>doOpenMatch(r)) });
  rows.push(menuBackRow('Oppure'));
  addListMessage({
    body:'👤 <b>Scegli chi contattare</b>'
      +'<br>🕒 '+esc(r.giorno)+' alle '+r.ora+' · Campo '+r.campo
      +'<br>🎾 '+(posti>1?('Mancano <b>'+posti+'</b> giocatori'):'Manca <b>1</b> giocatore')
      +'<br>Sono soci che hanno <b>dichiarato</b> di essere liberi in questa fascia. Scrivo io per te, uno alla volta.',
    button:'Apri', title:'Chi vuoi che contatti?', rows:rows.slice(0,10) });
}
/* Tap su un socio NON contattabile (🟡/🟢/❌): nota onesta, mai vicolo cieco. */
function plafondInfoTap(recId, pid){
  const r=S.prenotazioni.find(x=>x.id===recId); if(!r) return;
  const p=(S.pool||[]).filter(x=>x.id===pid)[0]; if(!p) return;
  const st=plafondStateOf(r,p), nm=nomeIniziale(p.nome);
  if(st.ic==='❌'){
    addInHtml('❌ <b>'+esc(nm)+'</b> ha detto che <b>non può</b> per '+esc(r.giorno)+' alle '+r.ora+'. Vuoi che riprovi lo stesso?');
    addQuick([{label:'✉️ Richiedi ancora',action:()=>contattaSocio(recId,pid)},
              {label:'👤 Torna alla lista',action:()=>botSay(()=>openPlafondList(r))}]);
    return;
  }
  addInHtml(st.ic==='🟡' ? ('🟡 La richiesta a <b>'+esc(nm)+'</b> è già partita — aspettiamo la risposta.')
                         : ('🟢 <b>'+esc(nm)+'</b> ha già accettato: è in partita.'));
  addQuick([{label:'👤 Torna alla lista',action:()=>botSay(()=>openPlafondList(r))}, menuBtn()]);
}
/* Un tap = UNA richiesta = UN messaggio (che paga il circolo). Consuma una unità del
   cap settimanale di chi la riceve, esattamente come il percorso automatico. */
function contattaSocio(recId, pid){
  const r=S.prenotazioni.find(x=>x.id===recId); if(!r){ addInHtml('Prenotazione non più disponibile.'); return; }
  const p=(S.pool||[]).filter(x=>x.id===pid)[0]; if(!p) return;
  if(rosterPosti(r)<=0){ addInHtml('La partita è già al completo 🎾.'); botSay(()=>rosterActionButtons(r)); return; }
  const nm=nomeIniziale(p.nome);
  r._poolTried=(r._poolTried||[]).concat(p.id);
  r._plafondNo=(r._plafondNo||[]).filter(x=>x!==p.id);          // ri-richiesta dopo un ❌
  r._plafondAttesa=(r._plafondAttesa||[]).concat(p.id);
  p._contattiSettimana=(p._contattiSettimana||0)+1;             // il freno che protegge LEI
  save();
  addSys('✉️ Richiesta inviata a '+nm+' — la manda il circolo per te; ti avviso appena risponde.');
  setTimeout(()=>{ const rr=S.prenotazioni.find(x=>x.id===recId);
    if(!rr || rr.stato==='completo') return;
    if((rr._plafondAttesa||[]).indexOf(p.id)<0) return;          // già risolta
    botSay(()=>plafondResponse(rr, p), TYPING_MS); }, 2500);
}
function plafondResponse(r, p){
  const nm=nomeIniziale(p.nome);
  r._plafondAttesa=(r._plafondAttesa||[]).filter(x=>x!==p.id);
  if(p._declina && !p._declinaUsed){                              // demo: Matteo declina
    p._declinaUsed=true; r._plafondNo=(r._plafondNo||[]).concat(p.id); save();
    addInHtml('❌ <b>'+esc(nm)+'</b> non può per '+esc(r.giorno)+' alle '+r.ora+'. Resta <b>❌</b> in lista: prova con un altro.');
    botSay(()=>{ rosterActionButtons(r); }, TYPING_MS); return;
  }
  r.amici=(r.amici||[]).concat(p.nome.split(' ')[0]); save();     // il roster resta a primo nome (chiave esistente)
  if(rosterPosti(r)===0){
    addInHtml('✅ <b>'+esc(nm)+'</b> ci sta! Partita <b>al completo</b> 🎾',true);
    botSay(()=>confirmBooking(r), TYPING_MS); return;
  }
  addInHtml('✅ <b>'+esc(nm)+'</b> ci sta! Ora siete <b>'+rosterFilled(r)+'/'+rosterTarget(r)+'</b> — manca'+(rosterPosti(r)>1?('no '+rosterPosti(r)):' 1')+'.',true);
  botSay(()=>rosterActionButtons(r), TYPING_MS);
}

/* ---------- Annulla / Modifica --------------------------------------------- */
function startCancel(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da annullare.'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}, menuBtn()]); return; }
  // LIST MESSAGE (non reply-button): le righe "giorno · ora / Campo N · tipo" superano
  // i 20 char dei reply-button e possono essere >3 → fedele = lista (titolo ≤24, ≤10 righe).
  addListMessage({ body:'Quale prenotazione vuoi annullare?', button:'Apri', title:'Annulla una prenotazione',
    rows: S.prenotazioni.slice(0,9).map(p=>({section:'Le mie prenotazioni', ic:'🗑️', label:p.giorno+' · '+p.ora, desc:'Campo '+p.campo+' · '+p.tipo, action:()=>botSay(()=>startCancelOne(p))})).concat([menuBackRow()]) });
}
function cancelStep(t){
  const d=convo.draft;
  if(convo.step==='pick'){ const p=matchPren(t); if(!p){ addInHtml('Non ho individuato la prenotazione. Riprova indicando il giorno.'); return; }
    d.target=p; convo.step='confirm';
    addInHtml('Vuoi annullare: '+esc(p.giorno)+' · '+p.ora+' — Campo '+p.campo+' · '+p.tipo+'?'+cancelWarn());
    addQuick([{label:'Sì, annulla',text:'sì',danger:true},{label:'No',text:'no'}]); return; }
  if(convo.step==='confirm'){
    if(/^s[iì]|conferm|annulla/.test(t.toLowerCase())){ const p=d.target; S.prenotazioni=S.prenotazioni.filter(x=>x.id!==p.id); save();
      addInHtml('Fatto. Campo '+p.campo+' di '+esc(p.giorno)+' alle '+p.ora+' liberato. Non hai perso nulla.',true); maybeHint(); homeMenu(); }
    else { addInHtml('Ok, non annullo nulla.'); homeMenu(); }
    resetConvo();
  }
}
function startModify(){
  if(!S.prenotazioni.length){ addInHtml('Non hai prenotazioni da modificare.'); addQuick([{label:'🎾 Prenota un campo',text:'Vorrei prenotare un campo'}, menuBtn()]); return; }
  // LIST MESSAGE (non reply-button): stesso motivo di startCancel (>20 char / >3 voci).
  // Ogni scelta riapre il MODULO in edit-mode (come showBookingDetail / le opzioni).
  addListMessage({ body:'Quale prenotazione vuoi modificare?', button:'Apri', title:'Modifica una prenotazione',
    rows: S.prenotazioni.slice(0,9).map(p=>({section:'Le mie prenotazioni', ic:'✏️', label:p.giorno+' · '+p.ora, desc:'Campo '+p.campo+' · '+p.tipo, action:()=>botSay(()=>addFlowLaunch('Riapriamo il modulo — scegli di nuovo giorno e orario.', ()=>openBookingFlow({editId:p.id, giorno:p.giorno, ora:p.ora})))})).concat([menuBackRow()]) });
}
function matchPren(t){
  t=t.toLowerCase(); const byId=t.match(/\b(\d{1,4})\b/); if(byId){ const p=S.prenotazioni.find(x=>x.id===parseInt(byId[1],10)); if(p) return p; }
  if(/sabato|sab/.test(t)) return S.prenotazioni.find(p=>/sab/i.test(p.giorno));
  if(/marted|mar/.test(t)) return S.prenotazioni.find(p=>/mar/i.test(p.giorno));
  return S.prenotazioni[0];
}

/* Composer stile WhatsApp: la freccia d'INVIO ↑ appare solo quando c'è testo. */
function toggleComposer(){ const send=document.getElementById('send'); if(!send) return; send.style.display=(field.value&&field.value.trim())?'':'none'; }
document.getElementById('bar').addEventListener('submit',e=>{ e.preventDefault(); const f=document.getElementById('field'); const v=f.value.trim(); hideCmdPop(); if(!v) return; f.value=''; sendUser(v); toggleComposer(); });
field.addEventListener('input',()=>{ const v=field.value; if(v.charAt(0)==='/') showCmdPop(v.trim()); else hideCmdPop(); toggleComposer(); });
document.getElementById('resetBtn').addEventListener('click',()=>{ resetDemo(); boot(); });
document.getElementById('nudgeTestBtn').addEventListener('click', demoFireNudge);
document.getElementById('emojiBtn').addEventListener('click',()=>toast('Solo demo 🙂'));
