# Deploy statico dell'emulatore su GitHub Pages via GitHub Actions.
# Sostituisce la vecchia pipeline "legacy" (Jekyll), che era LENTISSIMA/incastrata
# in coda (build da 15+ min per un solo index.html). Questa è veloce e osservabile.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una deploy per volta; non annulla quella in corso (evita deploy a metà).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # sito statico: tutta la root (index.html + .nojekyll)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
