# Deploy statico dell'emulatore su GitHub Pages via GitHub Actions.
# Sostituisce la vecchia pipeline "legacy" (Jekyll), che era LENTISSIMA/incastrata
# in coda (build da 15+ min per un solo index.html). Questa è veloce e osservabile.
#
# RESILIENZA: il passo finale di GitHub Pages (actions/deploy-pages) ogni tanto
# fallisce con un errore transitorio ("Deployment failed, try again later" — è un
# backend condiviso best-effort, fuori dal controllo del runner). Per questo lo
# ripetiamo fino a 3 volte con pause crescenti. L'UPLOAD dell'artefatto resta UNO
# solo (ripeterlo creerebbe artefatti doppi → "Multiple artifacts... count is 2").
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una deploy per volta; non annulla quella in corso (evita deploy a metà).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.dep1.outputs.page_url || steps.dep2.outputs.page_url || steps.dep3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # sito statico: tutta la root (index.html + .nojekyll)

      # --- Deploy con retry (solo questo passo, artefatto già caricato una volta) ---
      - name: Deploy to GitHub Pages (tentativo 1)
        id: dep1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Pausa prima del 2° tentativo
        if: steps.dep1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (tentativo 2)
        id: dep2
        if: steps.dep1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Pausa prima del 3° tentativo
        if: steps.dep1.outcome == 'failure' && steps.dep2.outcome == 'failure'
        run: sleep 40
      - name: Deploy to GitHub Pages (tentativo 3, finale)
        id: dep3
        if: steps.dep1.outcome == 'failure' && steps.dep2.outcome == 'failure'
        uses: actions/deploy-pages@v4
